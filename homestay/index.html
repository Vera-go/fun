<style>
:root{--bg:#F2FAF5;--card:#fff;--ink:#1F3B33;--muted:#6B8A7F;--line:#DDEBE3;--acc:#1F9D7A;--acc2:#FF8A5B;--warn:#D65A4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}

header .sub{font-size:13px;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;background:#E2F0E8;border-radius:16px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px;font-weight:900;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(31,59,51,.1)}

.card h2{margin:0 0 4px;font-size:17px}
.card .hint{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{background:#FFF4DD;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.65;margin-bottom:14px}
.group{font-size:13px;font-weight:900;color:var(--acc);margin:14px 0 6px}
.group:first-of-type{margin-top:0}
.phrase{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;background:#FBFEFC;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}

.phrase .t{flex:1;min-width:0}
.phrase .en{font-size:16px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}

.phrase.vendor .go{background:var(--acc2)}

.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>label{flex:1;min-width:130px}
label{font-size:13px;font-weight:800;color:var(--muted);display:grid;gap:4px}
input,textarea{font:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#FBFEFC;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.6}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;font-weight:900;cursor:pointer;background:var(--acc);color:#fff;box-shadow:0 3px 0 #147A5E}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #147A5E}
.btn.ghost{background:#E6F3EC;color:var(--ink);box-shadow:0 3px 0 #CFE4D8}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.chk input{width:auto}
/* 美食 */
.food{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;background:#FBFEFC}
.food .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.food .zhn{font-size:17px;font-weight:900}
.food .enn{font-size:15px;font-weight:800;color:var(--acc)}
.food p{margin:6px 0 8px;font-size:13.5px;line-height:1.65;color:#3C5A50}
.food .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:900;border-radius:99px;padding:2px 9px;background:#EEF5F1;color:#4F6F63}
.pill.hot{background:#FFE6E1;color:#C4452F}
.food .btns{margin-left:auto;display:flex;gap:6px}
/* 行程 */
.plan h3{margin:0 0 2px;font-size:16px}
.plan .when{font-size:12.5px;font-weight:900;color:var(--acc);margin-bottom:6px}
.plan ol{margin:6px 0 8px;padding-left:20px;font-size:14px;line-height:1.75}
.plan .tip{font-size:13px;line-height:1.65;color:#3C5A50;background:#F2FAF5;border-radius:12px;padding:8px 10px;margin-top:6px}

.show{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.show.on{display:flex}
.show .big{font-size:clamp(28px,9vw,56px);font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.show .sm{font-size:clamp(15px,4.5vw,22px);color:var(--muted);margin-top:14px}
.show .acts{display:flex;gap:10px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1F3B33;color:#fff;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:800;z-index:60}
.portal-foot{text-align:center;color:#6B8A7F;font:13px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:20px 16px 36px}.portal-foot a{color:#6B8A7F;text-decoration:none}.portal-foot a:hover{text-decoration:underline}
@media print{
  header,.tabs,.bar,.portal-foot,.noprint{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

/* ---------- 念出來 ---------- */
let voices = [];
const loadVoices = () => { voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; };
if(window.speechSynthesis){ loadVoices(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", loadVoices); }
function pickVoice(lang){
  const pref = lang === "en" ? ["en-AU","en-GB","en-US","en"] : ["zh-TW","zh-HK","zh-CN","zh"];
  for(const p of pref){ const v = voices.find(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase())); if(v) return v; }
  return null;
}
function say(text, lang){
  if(!window.speechSynthesis){ toast("這個瀏覽器不能念出來，可以用「放大」給她看"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === "en" ? "en-AU" : "zh-TW";
  u.rate = lang === "en" && S.slow ? .75 : .95;
  speechSynthesis.speak(u);
}
let toastTimer = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2400);
}

/* ---------- 畫面 ---------- */
let tab = "chat", lastShow = null;
const SPK = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>';
function phraseCard(c, idx, g){
  const cls = c.t === "h" ? "her" : c.t === "v" ? "vendor" : "";
  const tag = c.t === "h" ? '<span class="tag her">她可能會問</span>' : c.t === "v" ? '<span class="tag ven">給店家</span>' : '<span class="tag me">我說</span>';
  const en = fill(c.en), zh = fill(c.zh);
  // 給店家看的卡：中文放大、念中文；其他卡：英文放大、念英文
  return `<button class="phrase ${cls}" data-g="${g}" data-i="${idx}"><div class="t"><div class="en">${esc(en)}</div><div class="zh">${esc(zh)}${tag}</div></div><div class="go" aria-hidden="true">${SPK}</div></button>`;
}
function cardsView(key){
  const settings = key === "home" ? `<div class="card"><h2>家裡的設定</h2><p class="hint">填好之後，下面的句子會自動換成你們家的資料。只存在這支手機。</p><div class="row">
    <label>晚餐時間<input id="sDinner" value="${esc(S.dinner)}" placeholder="例如 6:30 pm"></label>
    <label>門禁時間<input id="sCurfew" value="${esc(S.curfew)}" placeholder="例如 9:00 pm"></label></div><div class="row" style="margin-top:8px">
    <label>Wi-Fi 名稱<input id="sWifiName" value="${esc(S.wifiName)}" placeholder="Wi-Fi name"></label>
    <label>Wi-Fi 密碼<input id="sWifiPass" value="${esc(S.wifiPass)}" placeholder="Password"></label></div></div>` : "";
  const note = key === "order" ? `<div class="note">這一頁可以給她自己用：她看英文挑句子，點一下會把中文放大並念給店家聽。標「她可能會問」的，是讓你知道她在問什麼。</div>` : key === "chat" ? `<div class="note">點一張卡，會用英文念出來。她可能會問的句子，旁邊標了「她可能會問」，是讓你聽懂或看懂她在說什麼。</div>` : "";
  return note + settings + CARDS[key].map((grp, gi) => `<div class="card"><div class="group">${esc(grp.g)}</div>${grp.items.map((c, i) => phraseCard(c, i, gi)).join("")}</div>`).join("");
}
function foodView(){
  const sp = n => n === 0 ? '<span class="pill">不辣</span>' : n === 1 ? '<span class="pill hot">可能有點辣</span>' : '<span class="pill hot">辣</span>';
  const br = n => n === 1 ? '<span class="pill">新手友善</span>' : n === 2 ? '<span class="pill">可以試試</span>' : '<span class="pill hot">勇敢挑戰</span>';
  return `<div class="note">給她看這一頁，問「想試試嗎？」。我是依一般做法寫的，每家店配料不同，過敏或吃素請在攤位上再問一次（見「點餐和逛街」）。</div>` +
    FOODS.map((f, i) => `<div class="food"><div class="top"><span class="zhn">${esc(f.zh)}</span><span class="enn">${esc(f.en)}</span></div><p>${esc(f.d)}</p><div class="meta">${br(f.brave)}${sp(f.spice)}<span class="btns"><button class="btn ghost sm" data-fshow="${i}">放大</button><button class="btn sm" data-fsay="${i}">念英文</button></span></div></div>`).join("");
}
function funView(){
  const n = Object.keys(S.want).filter(k => S.want[k]).length;
  const eff = ["", "輕鬆", "走一些路", "要點體力"];
  return `<div class="note">這些是 16、17 歲外國高中生可能會喜歡的點子。她看到想去的可以按「想去」，我幫你記起來，最後挑一兩個就好，不要排太滿，她第一週也要適應時差和天氣。營業時間、票價和是否要預約，出發前請再查，也要先問學校有沒有規定交換學生的活動範圍。</div>
    <div class="bar"><span class="muted small">她想去的：${n} 個</span></div>` +
    ACTS.map((a, i) => `<div class="food"><div class="top"><span class="zhn">${esc(a.zh)}</span><span class="enn">${esc(a.en)}</span></div><p>${esc(a.d)}</p><div class="meta"><span class="pill">${esc(a.io)}</span>${a.rain ? '<span class="pill">雨天可以</span>' : '<span class="pill hot">雨天要考慮</span>'}<span class="pill">${eff[a.eff]}</span><span class="btns"><button class="btn ${S.want[a.zh] ? "" : "ghost"} sm" data-awant="${i}">${S.want[a.zh] ? "想去 ✓" : "想去"}</button><button class="btn sm" data-aask="${i}">問她</button></span></div></div>`).join("");
}
function planView(){
  const cur = PLANS[S.plan];
  return `<div class="note">這是「夜市加輕鬆逛」的三個選項，營業時間、票價和班次我沒有即時資料，<b>出發前請用 Google 地圖和官方網站再確認一次</b>。也記得先問學校有沒有規定交換學生週末能去哪裡。</div>
    <div class="tabs" id="planTabs">${Object.entries(PLANS).map(([k, p]) => `<button data-plan="${k}" class="${k === S.plan ? "on" : ""}">${esc(p.name.split("・")[0])}</button>`).join("")}</div>
    <div class="card plan"><h3>${esc(cur.name)}</h3><div class="when">${esc(cur.when)}</div><ol>${cur.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="tip">${esc(cur.tip)}</div></div>
    <div class="card"><h2>想去的地方、要記得的事</h2><p class="hint">自己的筆記，只存在這支手機。</p><textarea id="planNotes" rows="5" placeholder="例如：問她想吃什麼、想去哪裡">${esc(S.notes)}</textarea></div>`;
}
function sosView(){
  return `<div class="note noprint">把資料填好，印出來貼在家裡，或給她的手機拍照存起來。資料只存在這支手機，不會上傳。</div>
    <div class="card"><h2>緊急聯絡卡 Emergency card</h2><div style="display:grid;gap:8px;margin-top:8px">${SOS_FIELDS.map(([k, label]) => `<label>${esc(label)}<input data-sos="${k}" value="${esc(S.sos[k] || "")}"></label>`).join("")}</div>
    <div class="bar noprint" style="margin-top:12px"><button class="btn" id="sosCopy">複製成文字</button><button class="btn ghost" id="sosPrint">列印</button></div></div>
    <div class="card noprint"><p class="hint" style="margin:0">台灣的緊急電話：報警 110，火警和救護車 119。非緊急的身體不舒服，先告訴接待家庭，再決定要不要看醫生。</p></div>
    ${SOS_CARDS.map((grp, gi) => `<div class="card noprint"><div class="group">${esc(grp.g)}</div>${grp.items.map((c, i) => phraseCard(c, i, "sos" + gi)).join("")}</div>`).join("")}`;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const v = $("#view");
  if(tab === "food") v.innerHTML = foodView();
  else if(tab === "fun") v.innerHTML = funView();
  else if(tab === "plan") v.innerHTML = planView();
  else if(tab === "sos") v.innerHTML = sosView();
  else v.innerHTML = `<div class="bar"><label class="chk"><input type="checkbox" id="slow" ${S.slow ? "checked" : ""}> 念慢一點</label><span class="sp"></span></div>` + cardsView(tab);
}
function cardAt(g, i){
  if(String(g).startsWith("sos")) return SOS_CARDS[+String(g).slice(3)].items[i];
  return CARDS[tab][g].items[i];
}
function openShow(big, sm, lang){
  $("#showBig").textContent = big; $("#showSm").textContent = sm; $("#show").classList.add("on"); lastShow = {text:big, lang};
}
/* ---------- 事件 ---------- */
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#view").addEventListener("click", e => {
  const ph = e.target.closest(".phrase");
  if(ph){
    const c = cardAt(ph.dataset.g, +ph.dataset.i); if(!c) return;
    if(c.t === "v"){ openShow(fill(c.zh), fill(c.en), "zh"); say(fill(c.zh), "zh"); }
    else say(fill(c.en), "en");
    return;
  }
  const aw = e.target.closest("[data-awant]"); if(aw){ const a = ACTS[+aw.dataset.awant]; S.want[a.zh] = !S.want[a.zh]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const aa = e.target.closest("[data-aask]"); if(aa){ const a = ACTS[+aa.dataset.aask]; openShow(a.ask, a.zh + "（" + a.en + "）", "en"); say(a.ask, "en"); return; }
  const fs = e.target.closest("[data-fsay]"); if(fs){ const f = FOODS[+fs.dataset.fsay]; say(f.en, "en"); return; }
  const fh = e.target.closest("[data-fshow]"); if(fh){ const f = FOODS[+fh.dataset.fshow]; openShow(f.zh, f.en, "zh"); return; }
  const pt = e.target.closest("[data-plan]"); if(pt){ S.plan = pt.dataset.plan; save(); render(); return; }
  if(e.target.id === "sosCopy"){
    const t = SOS_FIELDS.map(([k, l]) => `${l}: ${S.sos[k] || ""}`).join("\n");
    navigator.clipboard.writeText(t).then(() => toast("已複製"), () => prompt("複製下面的文字：", t)); return;
  }
  if(e.target.id === "sosPrint") window.print();
});
$("#view").addEventListener("input", e => {
  const t = e.target;
  if(t.id === "slow"){ S.slow = t.checked; save(); return; }
  const map = {sDinner:"dinner", sCurfew:"curfew", sWifiName:"wifiName", sWifiPass:"wifiPass"};
  if(map[t.id]){ S[map[t.id]] = t.value.trim().slice(0, 40); save(); return; }
  if(t.id === "planNotes"){ S.notes = t.value.slice(0, 2000); save(); return; }
  if(t.dataset && t.dataset.sos){ S.sos[t.dataset.sos] = t.value.slice(0, 200); save(); }
});
// 設定欄位改完離開時才重畫句卡，避免輸入到一半被打斷
$("#view").addEventListener("focusout", e => { if(/^s(Dinner|Curfew|WifiName|WifiPass)$/.test(e.target.id)) setTimeout(() => { if(!document.activeElement || !/^s(Dinner|Curfew|WifiName|WifiPass)$/.test(document.activeElement.id)) render(); }, 80); });
$("#showClose").addEventListener("click", () => { $("#show").classList.remove("on"); if(window.speechSynthesis) speechSynthesis.cancel(); });
$("#showSay").addEventListener("click", () => { if(lastShow) say(lastShow.text, lastShow.lang); });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#showClose").click(); });
render();
</script>
</body>
</html>

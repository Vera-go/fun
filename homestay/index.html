<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寄宿小幫手</title>
<meta name="description" content="接待外國交換學生用的中英句卡：晚餐聊天、家裡規矩、夜市點餐、週末行程和緊急聯絡卡，點一下就能念出來或放大給對方看。">
<meta property="og:title" content="寄宿小幫手｜接待交換學生的中英句卡">
<meta property="og:description" content="晚餐聊天、家裡規矩、夜市點餐、週末行程和緊急聯絡卡，點一下念出來或放大給對方看。">
<meta name="theme-color" content="#F2FAF5">
<style>
:root{--bg:#F2FAF5;--card:#fff;--ink:#1F3B33;--muted:#6B8A7F;--line:#DDEBE3;--acc:#1F9D7A;--acc2:#FF8A5B;--warn:#D65A4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{margin:0;font-size:24px;font-weight:900}
header .sub{font-size:13px;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;background:#E2F0E8;border-radius:16px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px;font-weight:900;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(31,59,51,.1)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(31,59,51,.06);margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px}
.card .hint{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{background:#FFF4DD;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.65;margin-bottom:14px}
.group{font-size:13px;font-weight:900;color:var(--acc);margin:14px 0 6px}
.group:first-of-type{margin-top:0}
.phrase{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;background:#FBFEFC;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.phrase:active{transform:translateY(1px);background:#F0F9F4}
.phrase .t{flex:1;min-width:0}
.phrase .en{font-size:16px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}
.phrase .zh{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.phrase .go{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.phrase.her .go{background:#8C9FD8}
.phrase.vendor .go{background:var(--acc2)}
.tag{display:inline-block;font-size:11.5px;font-weight:900;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.tag.me{background:#DDF3EA;color:#1A7D61}.tag.her{background:#E4E9F8;color:#5B6FB0}.tag.ven{background:#FFE6DA;color:#C5602F}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>label{flex:1;min-width:130px}
label{font-size:13px;font-weight:800;color:var(--muted);display:grid;gap:4px}
input,textarea{font:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#FBFEFC;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.6}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;font-weight:900;cursor:pointer;background:var(--acc);color:#fff;box-shadow:0 3px 0 #147A5E}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #147A5E}
.btn.ghost{background:#E6F3EC;color:var(--ink);box-shadow:0 3px 0 #CFE4D8}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.chk input{width:auto}
/* 美食 */
.food{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;background:#FBFEFC}
.food .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.food .zhn{font-size:17px;font-weight:900}
.food .enn{font-size:15px;font-weight:800;color:var(--acc)}
.food p{margin:6px 0 8px;font-size:13.5px;line-height:1.65;color:#3C5A50}
.food .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:900;border-radius:99px;padding:2px 9px;background:#EEF5F1;color:#4F6F63}
.pill.hot{background:#FFE6E1;color:#C4452F}
.food .btns{margin-left:auto;display:flex;gap:6px}
/* 行程 */
.plan h3{margin:0 0 2px;font-size:16px}
.plan .when{font-size:12.5px;font-weight:900;color:var(--acc);margin-bottom:6px}
.plan ol{margin:6px 0 8px;padding-left:20px;font-size:14px;line-height:1.75}
.plan .tip{font-size:13px;line-height:1.65;color:#3C5A50;background:#F2FAF5;border-radius:12px;padding:8px 10px;margin-top:6px}
/* 全螢幕給她看 */
.show{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.show.on{display:flex}
.show .big{font-size:clamp(28px,9vw,56px);font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.show .sm{font-size:clamp(15px,4.5vw,22px);color:var(--muted);margin-top:14px}
.show .acts{display:flex;gap:10px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1F3B33;color:#fff;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:800;z-index:60}
.portal-foot{text-align:center;color:#6B8A7F;font:13px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:20px 16px 36px}.portal-foot a{color:#6B8A7F;text-decoration:none}.portal-foot a:hover{text-decoration:underline}
/* 一起玩 */
.deck{text-align:center;padding:22px 16px}
.deck .qen{font-size:clamp(22px,6.5vw,30px);font-weight:900;line-height:1.4}
.deck .qzh{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.6}
.deck .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 6px}
.deck .opt{border:2px solid var(--line);border-radius:14px;padding:10px 8px;background:#FBFEFC;font-weight:800;font-size:15px;line-height:1.4}
.deck .opt small{display:block;font-weight:700;font-size:12.5px;color:var(--muted);margin-top:2px}
.deck .count{font-size:64px;font-weight:900;color:var(--acc2);min-height:78px;line-height:78px}
.deck .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.deck .big{font-size:clamp(34px,11vw,52px);font-weight:900;color:var(--acc)}
.deck .ans{margin-top:14px;background:#F2FAF5;border-radius:14px;padding:12px;font-size:15px;line-height:1.7}
.deck .ans .ex{color:var(--muted);font-size:13.5px;margin-top:4px}
.prog{font-size:12.5px;color:var(--muted);font-weight:800;margin-bottom:8px}
.bingo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.bcell{border:2px solid var(--line);border-radius:12px;background:#FBFEFC;padding:6px 3px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;color:inherit;cursor:pointer;line-height:1.25;position:relative}
.bcell b{font-size:13px}.bcell small{font-size:10.5px;color:var(--muted);font-weight:700;overflow-wrap:anywhere}
.bcell.on{background:var(--acc);border-color:var(--acc);color:#fff}.bcell.on small{color:#D6F3E8}
.bcell.line{box-shadow:0 0 0 3px var(--acc2)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:24px;line-height:1;color:#D2DED7;cursor:pointer;padding:2px}
.stars button.on{color:#FFB020}
.snackrow{border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;background:#FBFEFC}
.snackrow .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.snackrow p{margin:4px 0 6px;font-size:13px;color:#3C5A50;line-height:1.6}
.rank{list-style:none;margin:6px 0 0;padding:0}.rank li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:800}
.rank li:last-child{border-bottom:0}.rank .st{color:#FFB020;margin-left:auto;letter-spacing:1px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px}
.spots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.tile{aspect-ratio:1;border-radius:12px;border:2px solid #147A5E;background:linear-gradient(135deg,#27B38E,#147A5E);color:#fff;font:inherit;font-size:24px;font-weight:900;cursor:pointer;padding:2px;line-height:1.25;display:grid;place-items:center}
.tile:active{transform:scale(.96)}
.tile.open{background:#fff;border-color:var(--line);color:var(--ink);font-size:11.5px;font-weight:800;animation:flip .45s}
.tile.cur{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2)}
.tile.go{background:#DDF3EA;border-color:var(--acc)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@media(prefers-reduced-motion:reduce){.tile.open{animation:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips span{background:#DDF3EA;color:#1A7D61;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:900}
.hstage{position:relative;text-align:center;padding:18px 14px 20px}
.htime{font-size:20px;font-weight:900;color:var(--acc2)}
.hword{margin:18px 0 8px;font-size:clamp(40px,14vw,72px);font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.hword small{display:block;font-size:clamp(20px,6.5vw,30px);color:var(--acc);margin-top:8px;overflow-wrap:anywhere}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.hbtns button{border:0;border-radius:18px;padding:22px 8px;font:inherit;font-size:20px;font-weight:900;cursor:pointer}
.hbtns .ok{background:var(--acc);color:#fff;box-shadow:0 4px 0 #147A5E}.hbtns .no{background:#FFE6DA;color:#C5602F;box-shadow:0 4px 0 #F2CDB9}
.hbtns button:active{transform:translateY(3px);box-shadow:none}
.hcount{font-size:110px;font-weight:900;color:var(--acc2);line-height:1.2;padding:30px 0}
.words{margin:6px 0 0;padding:0;list-style:none;display:flex;gap:6px;flex-wrap:wrap}.words li{background:#EEF5F1;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800}.words.ok li{background:#DDF3EA;color:#1A7D61}
@media print{
  header,.tabs,.bar,.portal-foot,.noprint{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

<div class="wrap">

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "homestay.v1";
let S = {wifiName:"", wifiPass:"", dinner:"", curfew:"", slow:false, plan:"A", notes:"", sos:{}, want:{}, bingo:{}, snacks:{}, mySnacks:[], learned:{}, go:{}};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const fill = (t) => t
  .replace(/\{wifiName\}/g, S.wifiName || "___").replace(/\{wifiPass\}/g, S.wifiPass || "___")
  .replace(/\{dinner\}/g, S.dinner || "___").replace(/\{curfew\}/g, S.curfew || "___");

/* ---------- 句卡資料 ----------
   m = 我說給她聽（英文念出來）　h = 她可能會問我（英文，附中文意思）　v = 給店家看（中文念出來） */
const CARDS = {
  chat: [
    {g:"第一次見面", items:[
      {t:"m", en:"Welcome to Taiwan! Welcome to our home.", zh:"歡迎來到台灣！歡迎來我們家。"},

      {t:"m", en:"Please speak slowly. If I don't understand, I will say it again.", zh:"請說慢一點。如果我沒聽懂，我會再說一次。"},
      {t:"m", en:"Please feel at home. If you need anything, just tell me.", zh:"請當作在自己家。有需要什麼，直接告訴我。"},
      {t:"m", en:"Are you tired from the flight? Do you want to rest first?", zh:"搭飛機累嗎？要先休息嗎？"}
    ]},
    {g:"吃飯的時候", items:[
      {t:"m", en:"Dinner is ready!", zh:"晚餐好了！"},
      {t:"m", en:"Do you like this food? It's OK to say no.", zh:"你喜歡這道菜嗎？說不喜歡也沒關係。"},
      {t:"m", en:"Is it too spicy? Too salty?", zh:"會太辣嗎？太鹹嗎？"},
      {t:"m", en:"Would you like some more?", zh:"要再來一點嗎？"},
      {t:"m", en:"What do you usually eat for dinner in Australia?", zh:"你在澳洲晚餐通常吃什麼？"},
      {t:"m", en:"What food do you want to try in Taiwan?", zh:"你想在台灣試試什麼食物？"},
      {t:"h", en:"What is this? What is it made of?", zh:"這是什麼？是用什麼做的？"},
      {t:"h", en:"I'm full, thank you. It was delicious!", zh:"我吃飽了，謝謝。很好吃！"}
    ]},
    {g:"聊聊天", items:[
      {t:"m", en:"How was school today?", zh:"今天學校怎麼樣？"},
      {t:"m", en:"Did you make any friends?", zh:"你有交到朋友嗎？"},
      {t:"m", en:"What was the most interesting thing today?", zh:"今天最有趣的事是什麼？"},
      {t:"m", en:"Tell me about your family and your home in Australia.", zh:"說說你的家人和你在澳洲的家。"},
      {t:"m", en:"What do you like to do on weekends?", zh:"你週末喜歡做什麼？"},
      {t:"m", en:"Is there a word people say in Australia that we wouldn't understand?", zh:"澳洲有沒有什麼說法，我們可能聽不懂？"},
      {t:"h", en:"Can you teach me some Chinese words?", zh:"你可以教我一些中文嗎？"},
      {t:"h", en:"How do you say this in Chinese?", zh:"這個中文怎麼說？"}
    ]},
    {g:"飲食和口味", items:[
      {t:"m", en:"Is there any food you can't eat, or any food you don't like?", zh:"有沒有什麼不能吃，或不喜歡吃的東西？"},
      {t:"m", en:"Are you allergic to anything? Nuts, seafood, milk, eggs?", zh:"你有對什麼過敏嗎？堅果、海鮮、牛奶、蛋？"},
      {t:"m", en:"Are you vegetarian? Do you eat beef or pork?", zh:"你吃素嗎？你吃牛肉或豬肉嗎？"},
      {t:"m", en:"What would you like for breakfast? Toast, eggs, or rice porridge?", zh:"你早餐想吃什麼？吐司、蛋，還是稀飯？"},
      {t:"m", en:"What do you want to drink? Water, juice, milk, or tea?", zh:"你想喝什麼？水、果汁、牛奶，還是茶？"},
      {t:"h", en:"I don't eat meat. Is there any in this?", zh:"我不吃肉。這個裡面有肉嗎？"},
      {t:"h", en:"I'm allergic to peanuts. Does this have peanuts?", zh:"我對花生過敏。這個有花生嗎？"},

      {t:"h", en:"Could I have some water, please?", zh:"可以給我一杯水嗎？"},
      {t:"m", en:"No problem. You don't have to eat everything. Tell me what you like.", zh:"沒問題，不用每樣都吃完。告訴我你喜歡什麼。"}
    ]},
    {g:"想家和心情", items:[
      {t:"m", en:"How are you feeling today? Are you OK?", zh:"你今天感覺怎麼樣？還好嗎？"},
      {t:"m", en:"It's normal to feel homesick. You can tell me anytime.", zh:"想家是正常的。隨時都可以跟我說。"},
      {t:"m", en:"Do you want to call or message your family? You can use our Wi-Fi.", zh:"你想打給或傳訊息給家人嗎？可以用我們的 Wi-Fi。"},
      {t:"m", en:"Do you want some time alone? That's OK too.", zh:"你想自己安靜一下嗎？這樣也可以。"},

      {t:"h", en:"Thank you for looking after me.", zh:"謝謝你們照顧我。"}
    ]},
    {g:"學校和朋友", items:[
      {t:"m", en:"What time does school start? I will make sure you are ready.", zh:"學校幾點開始？我會讓你準時準備好。"},
      {t:"m", en:"Do you need help with your homework or with Chinese?", zh:"你需要幫忙功課或中文嗎？"},
      {t:"m", en:"Did you eat lunch at school? What did you have?", zh:"你中午在學校吃飯了嗎？吃了什麼？"},
      {t:"m", en:"If a friend invites you out, please tell me first, and tell me where you will go.", zh:"如果朋友邀你出去，請先告訴我，也告訴我你要去哪裡。"},
      {t:"h", en:"Can I join a school club or activity?", zh:"我可以參加學校的社團或活動嗎？"},
      {t:"h", en:"My friend invited me to go out. Is it OK?", zh:"朋友邀我出去，可以嗎？"},
      {t:"h", en:"Can you help me with my homework?", zh:"你可以幫我寫功課嗎？"}

let voices = [];
const loadVoices = () => { voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; };
if(window.speechSynthesis){ loadVoices(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", loadVoices); }
function pickVoice(lang){
  const pref = lang === "en" ? ["en-AU","en-GB","en-US","en"] : ["zh-TW","zh-HK","zh-CN","zh"];
  for(const p of pref){ const v = voices.find(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase())); if(v) return v; }
  return null;
}
function say(text, lang){
  if(!window.speechSynthesis){ toast("這個瀏覽器不能念出來，可以用「放大」給她看"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === "en" ? "en-AU" : "zh-TW";
  u.rate = lang === "en" && S.slow ? .75 : .95;
  speechSynthesis.speak(u);
}
let toastTimer = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2400);
}

  if(PLAY.hStage === "play"){
    const w = headsWords();
    return `<div class="card hstage"><div class="htime" id="htime">${PLAY.hLeft} 秒</div><div class="hword">${esc(w[0])}<small>${esc(w[1])}</small></div>
      <div class="hbtns"><button class="no" data-hskip="1">跳過</button><button class="ok" data-hok="1">猜對了</button></div><p class="hint" style="margin:14px 0 0">已猜對 ${PLAY.hOK.length} 個</p></div>`;
  }
  const list = (arr, cls) => arr.length ? `<ul class="words ${cls}">${arr.map(w => `<li>${esc(w[0])} ${esc(w[1])}</li>`).join("")}</ul>` : '<p class="hint" style="margin:4px 0 0">沒有</p>';
  return `<div class="card deck"><div class="qzh">時間到！</div><div class="big">猜對 ${PLAY.hOK.length} 個</div></div>
    <div class="card"><h2>猜對的</h2>${list(PLAY.hOK, "ok")}<h2 style="margin-top:12px">跳過的</h2>${list(PLAY.hSkip, "")}</div>
    <div class="bar"><button class="btn" data-hstart="1">同一主題再玩一輪</button><button class="btn ghost" data-hmenu="1">換主題</button></div>`;
}
function playView(){
  if(!PLAY.mode){
    return `<div class="note">一起玩，不計分，目的是聊天。用同一支手機，念出來給她聽，也讓她看英文。她不想回答的題目可以直接跳過。</div>
      <div class="card"><h2>默契大考驗</h2><p class="hint">每題四個選項，數到三，兩個人同時指出自己的選擇，再問「為什麼？」。看看我們一不一樣。</p><button class="btn" data-pmode="match">開始（${MATCH_Q.length} 題）</button></div>
      <div class="card"><h2>俚語配對</h2><p class="hint">她教你幾句澳洲人常說的話，你再教她幾句台灣人常說的。先猜，再揭曉。</p><div class="row"><button class="btn" data-pmode="slang-au">她教我（澳洲）</button><button class="btn ghost" data-pmode="slang-tw">我教她（台灣）</button></div></div>
      <div class="card"><h2>台灣體驗賓果</h2><p class="hint">10 天裡完成 16 件台灣的事，做完就打勾，連成一線有亮框。進度記在這支手機上。</p><button class="btn" data-pmode="bingo">開始</button></div>
      <div class="card"><h2>景點盲翻</h2><p class="hint">16 個外國人來台灣常去的北部景點，每張都蓋著，隨便翻開一張，看看運氣把你們帶去哪裡。</p><button class="btn" data-pmode="spots">開始翻</button></div>
      <div class="card"><h2>猜猜我是誰</h2><p class="hint">手機放額頭，對方用動作和簡單的字提示，在時間內猜越多越好。有台灣食物、澳洲、動物、日常物品等 7 個主題。</p><button class="btn" data-pmode="heads">開始</button></div>
      <div class="card"><h2>零食盲測</h2><p class="hint">準備幾種台灣零食，她邊吃邊打星星，最後出現「她最喜歡的台灣味」排行榜。</p><button class="btn" data-pmode="snack">開始</button></div>
      <div class="card"><h2>學中文小挑戰</h2><p class="hint">數字、顏色、家人、問候、點餐，每個詞有拼音，點一下念出來。</p><button class="btn" data-pmode="learn">開始</button></div>`;
  }
  if(PLAY.mode === "heads") return headsView();
  if(PLAY.mode === "spots") return spotsView();
  if(PLAY.mode === "bingo") return bingoView();
  if(PLAY.mode === "snack") return snackView();
  if(PLAY.mode === "learn") return learnView();
  const back = '<div class="bar"><button class="btn ghost sm" data-pback="1">← 回遊戲選單</button><span class="sp"></span><button class="btn ghost sm" data-pshuf="1">重新洗牌</button></div>';
  const n = PLAY.deck.length, c = PLAY.deck[PLAY.i], prog = `<div class="prog">${PLAY.i + 1} / ${n}</div>`;
  const nav = `<div class="ctl"><button class="btn ghost sm" data-pprev="1" ${PLAY.i ? "" : "disabled"}>上一題</button><button class="btn sm" data-pnext="1">${PLAY.i < n - 1 ? "下一題" : "再玩一輪"}</button></div>`;
  if(PLAY.mode === "match"){
    const opts = c.o.map(o => `<div class="opt">${esc(o[0])}<small>${esc(o[1])}</small></div>`).join("");
    return back + `<div class="card deck">${prog}<div class="qen">${esc(c.en)}</div><div class="qzh">${esc(c.zh)}</div><div class="opts">${opts}</div>
      <div class="count" id="count"></div>
      <div class="ctl"><button class="btn ghost sm" data-pspeak="q">念題目</button><button class="btn" data-p321="1">數到三，一起指！</button><button class="btn ghost sm" data-pwhy="1">為什麼？</button></div>${nav}</div>`;
  }
  const au = PLAY.side === "au";
  const reveal = PLAY.step === 1;
  const ans = reveal ? `<div class="ans"><b>${esc(c.en)}</b><br>${esc(c.zh)}<div class="ex">${esc(c.ex)}</div></div>` : "";
  return back + `<div class="card deck">${prog}<div class="muted small" style="margin-bottom:8px">${au ? "她教你的澳洲說法" : "你教她的台灣說法"}</div>
    <div class="big">${esc(c.w)}</div>${c.py ? `<div class="qzh">${esc(c.py)}</div>` : ""}
    <div class="qzh" style="margin-top:10px">${reveal ? "" : au ? "你猜猜是什麼意思？" : "Can you guess what this means?"}</div>${ans}
    <div class="ctl"><button class="btn ghost sm" data-pspeak="w">${au ? "念出來" : "念中文"}</button>${reveal ? "" : '<button class="btn" data-preveal="1">揭曉</button>'}${reveal ? '<button class="btn ghost sm" data-pspeak="ex">念例句</button>' : ""}</div>${nav}</div>`;
}
function planView(){
  const cur = PLANS[S.plan];
  return `<div class="note">這是「夜市加輕鬆逛」的三個選項，營業時間、票價和班次我沒有即時資料，<b>出發前請用 Google 地圖和官方網站再確認一次</b>。也記得先問學校有沒有規定交換學生週末能去哪裡。</div>
    <div class="tabs" id="planTabs">${Object.entries(PLANS).map(([k, p]) => `<button data-plan="${k}" class="${k === S.plan ? "on" : ""}">${esc(p.name.split("・")[0])}</button>`).join("")}</div>
    <div class="card plan"><h3>${esc(cur.name)}</h3><div class="when">${esc(cur.when)}</div><ol>${cur.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="tip">${esc(cur.tip)}</div></div>
    <div class="card"><h2>想去的地方、要記得的事</h2><p class="hint">自己的筆記，只存在這支手機。</p><textarea id="planNotes" rows="5" placeholder="例如：問她想吃什麼、想去哪裡">${esc(S.notes)}</textarea></div>`;
}
function sosView(){
  return `<div class="note noprint">把資料填好，印出來貼在家裡，或給她的手機拍照存起來。資料只存在這支手機，不會上傳。</div>
    <div class="card"><h2>緊急聯絡卡 Emergency card</h2><div style="display:grid;gap:8px;margin-top:8px">${SOS_FIELDS.map(([k, label]) => `<label>${esc(label)}<input data-sos="${k}" value="${esc(S.sos[k] || "")}"></label>`).join("")}</div>
    <div class="bar noprint" style="margin-top:12px"><button class="btn" id="sosCopy">複製成文字</button><button class="btn ghost" id="sosPrint">列印</button></div></div>
    <div class="card noprint"><p class="hint" style="margin:0">台灣的緊急電話：報警 110，火警和救護車 119。非緊急的身體不舒服，先告訴接待家庭，再決定要不要看醫生。</p></div>
    ${SOS_CARDS.map((grp, gi) => `<div class="card noprint"><div class="group">${esc(grp.g)}</div>${grp.items.map((c, i) => phraseCard(c, i, "sos" + gi)).join("")}</div>`).join("")}`;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const v = $("#view");
  if(tab === "food") v.innerHTML = foodView();
  else if(tab === "fun") v.innerHTML = funView();
  else if(tab === "play") v.innerHTML = playView();
  else if(tab === "plan") v.innerHTML = planView();
  else if(tab === "sos") v.innerHTML = sosView();
  else v.innerHTML = `<div class="bar"><label class="chk"><input type="checkbox" id="slow" ${S.slow ? "checked" : ""}> 念慢一點</label><span class="sp"></span></div>` + cardsView(tab);
}
function cardAt(g, i){
  if(String(g).startsWith("sos")) return SOS_CARDS[+String(g).slice(3)].items[i];
  return CARDS[tab][g].items[i];
}
function openShow(big, sm, lang){
  $("#showBig").textContent = big; $("#showSm").textContent = sm; $("#show").classList.add("on"); lastShow = {text:big, lang};
}
/* ---------- 事件 ---------- */
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("#view").addEventListener("click", e => {
  const ph = e.target.closest(".phrase");
  if(ph){
    const c = cardAt(ph.dataset.g, +ph.dataset.i); if(!c) return;
    if(c.t === "v"){ openShow(fill(c.zh), fill(c.en), "zh"); say(fill(c.zh), "zh"); }
    else say(fill(c.en), "en");
    return;
  }
  const hc = e.target.closest("[data-hcat]"); if(hc){ const k = hc.dataset.hcat; const all = k === "all"; const items = all ? HEADS.flatMap(h => h.items) : HEADS[+k].items; PLAY.hName = all ? "全部混合" : HEADS[+k].cat; PLAY.hAll = items; PLAY.hStage = "ready"; render(); return; }
  const hd = e.target.closest("[data-hdur]"); if(hd){ PLAY.hDur = +hd.dataset.hdur; render(); return; }
  if(e.target.closest("[data-hstart]")){ PLAY.hDeck = shuffle(PLAY.hAll); headsStart(); return; }
  if(e.target.closest("[data-hmenu]")){ headsStop(); PLAY.hStage = "menu"; render(); return; }
  if(e.target.closest("[data-hok]")){ if(PLAY.hStage !== "play") return; PLAY.hOK.push(headsWords()); PLAY.hI++; if(navigator.vibrate) try{ navigator.vibrate(60); }catch(err){} render(); return; }
  if(e.target.closest("[data-hskip]")){ if(PLAY.hStage !== "play") return; PLAY.hSkip.push(headsWords()); PLAY.hI++; render(); return; }
  const sp = e.target.closest("[data-spot]"); if(sp){ const i = +sp.dataset.spot; PLAY.flip[i] = true; PLAY.cur = i; render(); window.scrollTo(0, 0); return; }
  if(e.target.closest("[data-spotshuf]")){ PLAY.deck = shuffle(SPOTS); PLAY.flip = {}; PLAY.cur = null; render(); return; }
  if(e.target.closest("[data-spotgo]")){ const c = PLAY.deck[PLAY.cur]; S.go[c.zh] = !S.go[c.zh]; save(); render(); return; }
  if(e.target.closest("[data-spotask]")){ const c = PLAY.deck[PLAY.cur]; const q = "How about " + c.en + "? " + c.ed; openShow(q, c.zh + "（" + c.en + "）", "en"); say(q, "en"); return; }
  if(e.target.closest("[data-bingo]")){ const i = e.target.closest("[data-bingo]").dataset.bingo; S.bingo[i] = !S.bingo[i]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if(e.target.closest("[data-bingoreset]")){ if(confirm("要把賓果全部清掉重來嗎？")){ S.bingo = {}; save(); render(); } return; }
  if(e.target.closest("[data-bingocopy]")){ const t = "台灣體驗賓果\n" + BINGO.map((b, i) => (S.bingo[i] ? "✓ " : "□ ") + b[0] + " " + b[1]).join("\n"); navigator.clipboard.writeText(t).then(() => toast("已複製"), () => prompt("複製下面的文字：", t)); return; }
  const sk = e.target.closest("[data-snack]"); if(sk){ const k = sk.dataset.snack, n = +sk.dataset.star; S.snacks[k] = S.snacks[k] === n ? 0 : n; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if(e.target.closest("[data-snackadd]")){ const el = $("#snackName"), name = (el.value || "").trim().slice(0, 16); if(!name) return; if(!S.mySnacks.includes(name) && !SNACKS.some(x => x.zh === name) && S.mySnacks.length < 12){ S.mySnacks.push(name); save(); } render(); return; }
  if(e.target.closest("[data-snackcopy]")){ const t = "她最喜歡的台灣味\n" + allSnacks().filter(x => S.snacks[x.k] > 0).sort((a, b) => S.snacks[b.k] - S.snacks[a.k]).map((x, i) => (i + 1) + ". " + x.zh + " " + "★".repeat(S.snacks[x.k])).join("\n"); navigator.clipboard.writeText(t).then(() => toast("已複製"), () => prompt("複製下面的文字：", t)); return; }
  const lc = e.target.closest("[data-lcat]"); if(lc){ const ci = +lc.dataset.lcat; PLAY.cat = ci; PLAY.deck = shuffle(LEARN[ci].items.map(it => ({w:it[0], py:it[1], en:it[2]}))); PLAY.i = 0; PLAY.step = 0; PLAY.side = "learn"; render(); window.scrollTo(0, 0); return; }
  if(e.target.closest("[data-lback]")){ PLAY.cat = null; PLAY.deck = []; render(); return; }
  if(e.target.closest("[data-plearned]")){ const c = PLAY.deck[PLAY.i]; S.learned[c.w] = !S.learned[c.w]; save(); render(); return; }
  const pm = e.target.closest("[data-pmode]"); if(pm){
    const m = pm.dataset.pmode;
    if(m === "heads"){ PLAY = {mode:"heads", deck:[], i:0, step:0, side:"au", hStage:"menu", hDur:60}; }
    else if(m === "spots"){ PLAY = {mode:"spots", deck:shuffle(SPOTS), i:0, step:0, side:"au", flip:{}, cur:null}; }
    else if(m === "bingo" || m === "snack"){ PLAY = {mode:m, deck:[], i:0, step:0, side:"au"}; }
    else if(m === "learn"){ PLAY = {mode:"learn", deck:[], i:0, step:0, side:"learn", cat:null}; }
    else if(m === "match"){ PLAY = {mode:"match", deck:shuffle(MATCH_Q), i:0, step:0, side:"au"}; }
    else { const side = m === "slang-au" ? "au" : "tw"; PLAY = {mode:"slang", deck:shuffle(SLANG[side]), i:0, step:0, side}; }
    render(); window.scrollTo(0, 0); return; }
  if(e.target.closest("[data-pback]")){ headsStop(); PLAY.mode = null; render(); return; }
  if(e.target.closest("[data-pshuf]")){ PLAY.deck = shuffle(PLAY.deck); PLAY.i = 0; PLAY.step = 0; render(); return; }
  if(e.target.closest("[data-pnext]")){ PLAY.i = PLAY.i < PLAY.deck.length - 1 ? PLAY.i + 1 : 0; if(PLAY.i === 0) PLAY.deck = shuffle(PLAY.deck); PLAY.step = 0; render(); return; }
  if(e.target.closest("[data-pprev]")){ if(PLAY.i > 0){ PLAY.i--; PLAY.step = 0; render(); } return; }
  if(e.target.closest("[data-preveal]")){ PLAY.step = 1; render(); const c = PLAY.deck[PLAY.i]; if(PLAY.side === "au") say(c.w + ". It means " + c.en, "en"); return; }
  if(e.target.closest("[data-pwhy]")){ say("Why did you choose that?", "en"); return; }
  const ps = e.target.closest("[data-pspeak]"); if(ps){
    const c = PLAY.deck[PLAY.i], k = ps.dataset.pspeak;
    if(k === "q") say(c.en + ". " + c.o.map(o => o[0]).join(". "), "en");
    else if(k === "ex") say(c.ex, PLAY.side === "au" ? "en" : "zh");
    else say(c.w, PLAY.side === "au" ? "en" : "zh");
    return; }
  if(e.target.closest("[data-p321]")){
    const el = $("#count"); if(!el) return;
    say("Three, two, one, point!", "en");
    ["3", "2", "1", "指！"].forEach((t, i) => setTimeout(() => { const x = $("#count"); if(x) x.textContent = t; }, i * 700));
    setTimeout(() => { const x = $("#count"); if(x) x.textContent = ""; }, 3600);
    return; }
  const aw = e.target.closest("[data-awant]"); if(aw){ const a = ACTS[+aw.dataset.awant]; S.want[a.zh] = !S.want[a.zh]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const aa = e.target.closest("[data-aask]"); if(aa){ const a = ACTS[+aa.dataset.aask]; openShow(a.ask, a.zh + "（" + a.en + "）", "en"); say(a.ask, "en"); return; }
  const fs = e.target.closest("[data-fsay]"); if(fs){ const f = FOODS[+fs.dataset.fsay]; say(f.en, "en"); return; }
  const fh = e.target.closest("[data-fshow]"); if(fh){ const f = FOODS[+fh.dataset.fshow]; openShow(f.zh, f.en, "zh"); return; }
  const pt = e.target.closest("[data-plan]"); if(pt){ S.plan = pt.dataset.plan; save(); render(); return; }
  if(e.target.id === "sosCopy"){
    const t = SOS_FIELDS.map(([k, l]) => `${l}: ${S.sos[k] || ""}`).join("\n");
    navigator.clipboard.writeText(t).then(() => toast("已複製"), () => prompt("複製下面的文字：", t)); return;
  }
  if(e.target.id === "sosPrint") window.print();
});
$("#view").addEventListener("input", e => {
  const t = e.target;
  if(t.id === "slow"){ S.slow = t.checked; save(); return; }
  const map = {sDinner:"dinner", sCurfew:"curfew", sWifiName:"wifiName", sWifiPass:"wifiPass"};
  if(map[t.id]){ S[map[t.id]] = t.value.trim().slice(0, 40); save(); return; }
  if(t.id === "planNotes"){ S.notes = t.value.slice(0, 2000); save(); return; }
  if(t.dataset && t.dataset.sos){ S.sos[t.dataset.sos] = t.value.slice(0, 200); save(); }
});
// 設定欄位改完離開時才重畫句卡，避免輸入到一半被打斷
$("#view").addEventListener("focusout", e => { if(/^s(Dinner|Curfew|WifiName|WifiPass)$/.test(e.target.id)) setTimeout(() => { if(!document.activeElement || !/^s(Dinner|Curfew|WifiName|WifiPass)$/.test(document.activeElement.id)) render(); }, 80); });
$("#showClose").addEventListener("click", () => { $("#show").classList.remove("on"); if(window.speechSynthesis) speechSynthesis.cancel(); });
$("#showSay").addEventListener("click", () => { if(lastShow) say(lastShow.text, lastShow.lang); });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#showClose").click(); });
render();
</script>
</body>
</html>

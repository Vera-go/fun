<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>16 型角色一覽</title>
<style>body{margin:0;background:#0A0A0A;color:#fff;font-family:sans-serif;display:grid;grid-template-columns:repeat(4,252px);gap:8px;padding:8px}
.c{background:#1A1A1A;border-radius:12px;text-align:center;padding-bottom:6px}.c svg{width:252px;height:260px;display:block}</style></head>
<body>
<script src="../content.js"></script>
<script src="../card.js"></script>
<script>
// 開發用：一次看 16 型角色（底線開頭的資料夾不會被 GitHub Pages 發布）
["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"].forEach(code => {
  const d = document.createElement("div"); d.className = "c";
  d.innerHTML = characterSvg(code) + `<b>${code}</b> ${NS.types[code].name}`;
  document.body.appendChild(d);
});
</script>
</body></html>

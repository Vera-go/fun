<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>喵喵列車長</title>
<meta name="description" content="當上喵喵列車長，沿路收編流浪貓，吃健康的食物，不要撞到同伴！">
<meta property="og:title" content="喵喵列車長｜收編流浪貓">
<meta property="og:description" content="當上喵喵列車長，沿路收編流浪貓，吃健康的食物，不要撞到同伴！">
<meta name="theme-color" content="#FFF4E2">
<style>
:root{--bg:#FFF4E2;--ink:#3A2A20;--muted:#8A7462;--card:#FFFFFF;--line:#3A2A20;--acc:#FF8A3D;--acc2:#E6527A;--good:#3BA55C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 0}
header{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
header h1{font-size:24px;margin:0;font-weight:900;letter-spacing:1px}
header .sub{font-size:13px;color:var(--muted);font-weight:700}
.hud{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px 8px;font-weight:900;font-size:14px;line-height:1.3}
.pill small{font-weight:700;color:var(--muted);font-size:12px}
.hud .sp{flex:1}
.ibtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 8px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:4px;box-shadow:2px 2px 0 var(--line)}
.ibtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.stage{position:relative;border:3px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:4px 4px 0 var(--line);background:#F7E6C8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:auto}
.toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3}
.toast{background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;font-weight:800;max-width:92%;text-align:center;animation:tin .25s ease-out;box-shadow:2px 2px 0 var(--line)}
.toast small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:1px}
.toast.bad{background:#FFF0EC}
.toast.gold{background:#FFF6CC}
.toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(255,244,226,.86);z-index:4;overflow:auto}
.ov[hidden]{display:none}
.panel{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:440px;box-shadow:4px 4px 0 var(--line);text-align:center;max-height:100%;overflow:auto}
.panel h2{margin:0 0 6px;font-size:21px}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.6}
.muted{color:var(--muted)}
.btn{border:2.5px solid var(--line);border-radius:14px;padding:10px 16px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.pick button{border:2px solid #E6D6C2;background:#FFF9F0;border-radius:12px;padding:4px 2px 3px;cursor:pointer;font:inherit;font-size:12px;font-weight:800;color:var(--ink)}
.pick button.on{border-color:var(--acc);background:#FFE7D3;box-shadow:0 0 0 2px var(--acc)}
.pick canvas{width:100%;max-width:64px;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stats div{background:#FFF6EA;border-radius:12px;padding:6px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted);font-weight:700}
.fact{background:#EEF8F0;border-radius:12px;padding:8px 10px;font-size:13.5px;text-align:left;line-height:1.6;margin-top:8px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0;text-align:left}
.book .it{display:flex;gap:8px;align-items:center;background:#FFF9F0;border:2px solid #EADBC8;border-radius:12px;padding:6px}
.book .it canvas{width:56px;height:56px;flex:none}
.book .it b{font-size:14px}
.book .it p{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
.book .it.no{opacity:.6}
.help{text-align:left;font-size:14px;line-height:1.7;margin:6px 0;padding-left:20px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;text-align:left;margin:8px 0}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px;background:#FFF9F0;border-radius:10px;padding:4px 6px}
.legend canvas{width:34px;height:34px;flex:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin:12px auto 0;touch-action:manipulation}
.pad button{border:2.5px solid var(--line);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--line);font-size:22px;font-weight:900;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pad button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line);background:#FFE7D3}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media(max-width:520px){.ibtn .lbl{display:none}}
.tip{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0}
@media(hover:hover) and (pointer:fine){.pad{display:none}}
.portal-foot{text-align:center;color:#8A7462;font:13px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:20px 16px 36px}.portal-foot a{color:#8A7462;text-decoration:none}.portal-foot svg{display:inline-block}.portal-foot a:hover,.portal-foot a:focus-visible{text-decoration:underline;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <canvas id="logo" width="88" height="88" style="width:44px;height:44px"></canvas>
    <div><h1>喵喵列車長</h1><div class="sub">沿路收編流浪貓，帶大家一起回家</div></div>
  </header>
  <div class="hud">
    <span class="pill" title="隊伍裡的貓咪">貓咪 <span id="hLen">1</span></span>
    <span class="pill" title="分數">分數 <span id="hScore">0</span></span>
    <span class="pill" title="復活次數（吃金色貓罐罐可以增加）">復活 <span id="hLives">1</span></span>
    <span class="sp"></span>
    <button class="ibtn" id="bPause" title="暫停（空白鍵）">暫停</button>
    <button class="ibtn" id="bMusic" title="背景音樂"></button>
    <button class="ibtn" id="bBook">圖鑑</button>
    <button class="ibtn" id="bHelp">說明</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toasts" id="toasts"></div>
    <div class="ov" id="ov"><div class="panel" id="panel"></div></div>
  </div>
  <div class="pad" id="pad">
    <button class="u" data-d="up" aria-label="上">▲</button>
    <button class="l" data-d="left" aria-label="左">◀</button>
    <button class="d" data-d="down" aria-label="下">▼</button>
    <button class="r" data-d="right" aria-label="右">▶</button>
  </div>
  <p class="tip">方向鍵、WASD、在畫面上滑動，或按下面的按鈕都可以轉彎。空白鍵暫停。</p>
</div>
<!-- 回工具箱放在頁面最下方（各網站一致：上方不放） -->
<footer class="portal-foot"><a href="../"><svg viewBox="0 0 32 32" width="1.15em" height="1.15em" aria-hidden="true" focusable="false" style="vertical-align:-.2em"><path d="M10 11 V8 Q10 5 13 5 H19 Q22 5 22 8 V11" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="11" width="26" height="16" rx="3" fill="#E6325F" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 18 H29" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12.5" y="15.5" width="7" height="5.5" rx="1.5" fill="#FFD60A" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> 回工具箱</a>・<a href="../wish/#new">想要新功能？來許願</a></footer>

<script>
/* =========================================================
   喵喵列車長（許願池 #17）
   玩法像貪吃蛇：帶頭的貓（列車長）一直往前走，沿路收編流浪貓，隊伍越來越長。
   - 健康食物：大家開心；不健康的食物：有貓變胖（健康食物可以讓胖貓瘦回來）
   - 金色貓罐罐：多一次復活
   - 休息站（貓窩）：走進去會睡一下，讓手休息
   - 撞牆或撞到同伴：貓咪散開或疊成貓山；還有復活次數就重新排好繼續
   所有圖都是用程式畫的，沒有用圖片和 emoji。
   ========================================================= */
const COLS = 13, ROWS = 15;
const INK = "#3A2A20";

// ---------- 貓咪品種（花色、眼睛、小知識） ----------
const BREEDS = [
  {id:"orange",  name:"橘貓",   base:"#F6A64A", eye:"#7FB33A", fact:"橘貓大多是公貓，因為決定橘色的基因在 X 染色體上。"},
  {id:"calico",  name:"三花貓", base:"#FFFDF8", eye:"#D9A531", fact:"三花貓有白、橘、黑三種顏色，幾乎都是母貓，公三花非常少見。"},
  {id:"tuxedo",  name:"賓士貓", base:"#2E2B2B", eye:"#E8C547", fact:"黑白配色像穿著燕尾服，英文叫 tuxedo cat（燕尾服貓）。"},
  {id:"tabby",   name:"虎斑貓", base:"#B39878", eye:"#8BB04A", fact:"虎斑貓的額頭上，常常有一個像英文字母「M」的花紋。"},
  {id:"black",   name:"黑貓",   base:"#2B2A2E", eye:"#F2C230", fact:"在日本和英國，有些地方把黑貓當成會帶來好運的貓。"},
  {id:"white",   name:"白貓",   base:"#FFFFFF", eye:"#62A8E8", fact:"藍眼睛的白貓，比較容易天生聽力不好，要多一點耐心。"},
  {id:"siamese", name:"暹羅貓", base:"#F3E7D3", eye:"#4C9BE0", fact:"暹羅貓身上比較冷的地方（耳朵、臉、腳、尾巴）顏色會比較深。"},
  {id:"grey",    name:"灰貓",   base:"#9EA7B2", eye:"#7CC08A", fact:"灰色其實是「變淡的黑色」，所以灰貓也常被叫做藍貓。"},
  {id:"tortie",  name:"玳瑁貓", base:"#3B2C25", eye:"#E2A53A", fact:"玳瑁貓是黑色和橘色混在一起，跟三花貓一樣幾乎都是母貓。"},
  {id:"cow",     name:"乳牛貓", base:"#FFFFFF", eye:"#C9A640", fact:"白底黑斑像乳牛，每一隻的花紋都不一樣，像身分證一樣。"},
];
const BY = Object.fromEntries(BREEDS.map(b => [b.id, b]));
const STREET_FACTS = [
  "街上耳朵被剪掉一小角的貓，代表已經結紮、有人在照顧，叫做「剪耳貓」。",
  "貓咪不能吃洋蔥、巧克力、葡萄，人吃的炸物和零食太鹹太油，對貓也不好。",
  "想幫助流浪貓，可以先問問附近的動物保護團體，用「領養代替購買」。",
  "貓咪一天大約要睡 12 到 16 個小時，睡飽了才有精神。",
  "貓咪慢慢眨眼睛，是在說「我信任你」，你也可以慢慢眨眼回應牠。",
];

// ---------- 食物 ----------
const FOODS = {
  fish:    {name:"魚",       good:true,  msg:"吃了新鮮的魚，大家都好開心！"},
  chicken: {name:"水煮雞肉", good:true,  msg:"水煮雞肉，好吃又健康！"},
  grass:   {name:"貓草",     good:true,  msg:"嚼嚼貓草，肚子舒服多了！"},
  fries:   {name:"薯條",     good:false, msg:"薯條太鹹又太油了……"},
  cake:    {name:"蛋糕",     good:false, msg:"蛋糕太甜了……"},
  fried:   {name:"炸雞",     good:false, msg:"炸雞太油了……"},
};
const GOOD_FOODS = ["fish", "chicken", "grass"], BAD_FOODS = ["fries", "cake", "fried"];

// ---------- 存檔（最高分、圖鑑、上次選的列車長、音樂開關） ----------
const SAVE_KEY = "meowtrain.v1";
let save = {best:0, seen:{}, leader:"orange", music:true};
try{ Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); }catch(e){}
const persist = () => { try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} };

// ---------- 畫布 ----------
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let CELL = 32, DPR = 1;
function resize(){
  const w = document.getElementById("stage").clientWidth;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CELL = w / COLS;
  cv.width = Math.round(w * DPR); cv.height = Math.round(CELL * ROWS * DPR);
  cv.style.height = (CELL * ROWS) + "px";
}

// ---------- 畫貓 ----------
// (x, y) 是格子中心；s 是格子大小。opt: mood（normal/happy/scared/sleep/dizzy）、fat（0～2）、leader、shake、alpha、rot
function drawCat(c, x, y, s, breedId, opt = {}){
  const b = BY[breedId] || BREEDS[0];
  const mood = opt.mood || "normal", fat = opt.fat || 0;
  c.save();
  c.translate(x + (opt.shake ? (Math.random() - .5) * s * .12 : 0), y);
  if(opt.rot) c.rotate(opt.rot);
  if(opt.alpha != null) c.globalAlpha = opt.alpha;
  const lw = Math.max(1.2, s * .045);
  c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = "round"; c.lineCap = "round";
  const r = s * .33, hy = -s * .07;            // 頭的半徑、位置
  const bw = s * (.3 + fat * .085), bh = s * (.2 + fat * .03), by = s * .2;
  // 尾巴
  c.beginPath(); c.moveTo(bw * .7, by + bh * .3); c.quadraticCurveTo(bw * 1.45, by - bh * .2, bw * 1.15, by - bh * 1.3);
  c.strokeStyle = INK; c.lineWidth = s * .13; c.stroke();
  c.strokeStyle = tailColor(b); c.lineWidth = s * .13 - lw * 2; c.stroke();
  c.lineWidth = lw; c.strokeStyle = INK;
  // 身體
  c.beginPath(); c.ellipse(0, by, bw, bh, 0, 0, Math.PI * 2); c.fillStyle = bodyColor(b); c.fill(); c.stroke();
  if(b.id === "tuxedo" || b.id === "cow" || b.id === "calico"){ // 白肚子或身上的斑
    c.save(); c.beginPath(); c.ellipse(0, by, bw, bh, 0, 0, Math.PI * 2); c.clip();
    if(b.id === "tuxedo"){ c.fillStyle = "#fff"; c.beginPath(); c.ellipse(0, by + bh * .3, bw * .45, bh * .9, 0, 0, Math.PI * 2); c.fill(); }
    if(b.id === "cow"){ c.fillStyle = "#2B2A2E"; c.beginPath(); c.ellipse(-bw * .5, by - bh * .2, bw * .35, bh * .6, .3, 0, Math.PI * 2); c.fill(); }
    if(b.id === "calico"){ c.fillStyle = "#F09A3E"; c.beginPath(); c.ellipse(bw * .5, by, bw * .35, bh * .7, 0, 0, Math.PI * 2); c.fill(); }
    c.restore(); c.beginPath(); c.ellipse(0, by, bw, bh, 0, 0, Math.PI * 2); c.stroke();
  }
  // 耳朵（害怕時往兩邊壓平）
  const flat = mood === "scared" ? .55 : 0;
  for(const sd of [-1, 1]){
    c.save(); c.translate(sd * r * .62, hy - r * .62); c.rotate(sd * (.25 + flat));
    c.beginPath(); c.moveTo(-r * .34, r * .22); c.lineTo(0, -r * .5); c.lineTo(r * .34, r * .22); c.closePath();
    c.fillStyle = earColor(b, sd); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-r * .16, r * .12); c.lineTo(0, -r * .24); c.lineTo(r * .16, r * .12); c.closePath();
    c.fillStyle = "#F7A8B8"; c.fill();
    c.restore();
  }
  // 頭（胖的時候臉頰鼓鼓的）
  const hw = r * (1 + fat * .1), hh = r * .92;
  c.beginPath(); c.ellipse(0, hy, hw, hh, 0, 0, Math.PI * 2); c.fillStyle = b.base; c.fill();
  c.save(); c.clip(); headPattern(c, b, hw, hh, hy); c.restore();
  c.beginPath(); c.ellipse(0, hy, hw, hh, 0, 0, Math.PI * 2); c.stroke();
  // 臉
  const ey = hy - r * .05, ex = r * .4;
  const dark = ["tuxedo", "black", "tortie"].includes(b.id);
  const faceInk = dark ? "#FFF6E8" : INK;
  c.strokeStyle = faceInk; c.fillStyle = faceInk;
  if(mood === "happy"){
    for(const sd of [-1, 1]){ c.beginPath(); c.arc(sd * ex, ey + r * .08, r * .16, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
  }else if(mood === "sleep"){
    for(const sd of [-1, 1]){ c.beginPath(); c.arc(sd * ex, ey - r * .02, r * .15, Math.PI * .15, Math.PI * .85); c.stroke(); }
  }else if(mood === "dizzy"){
    for(const sd of [-1, 1]){ const cx2 = sd * ex; c.beginPath(); c.moveTo(cx2 - r * .13, ey - r * .13); c.lineTo(cx2 + r * .13, ey + r * .13); c.moveTo(cx2 + r * .13, ey - r * .13); c.lineTo(cx2 - r * .13, ey + r * .13); c.stroke(); }
  }else if(mood === "scared"){
    for(const sd of [-1, 1]){
      c.beginPath(); c.arc(sd * ex, ey, r * .22, 0, Math.PI * 2); c.fillStyle = "#fff"; c.fill(); c.strokeStyle = INK; c.stroke();
      c.beginPath(); c.arc(sd * ex, ey + r * .02, r * .07, 0, Math.PI * 2); c.fillStyle = INK; c.fill();
    }
  }else{
    for(const sd of [-1, 1]){
      c.beginPath(); c.ellipse(sd * ex, ey, r * .15, r * .19, 0, 0, Math.PI * 2); c.fillStyle = b.eye; c.fill();
      c.lineWidth = lw * .8; c.strokeStyle = INK; c.stroke();
      c.beginPath(); c.ellipse(sd * ex, ey, r * .06, r * .15, 0, 0, Math.PI * 2); c.fillStyle = "#1E1612"; c.fill();
      c.beginPath(); c.arc(sd * ex + r * .05, ey - r * .07, r * .04, 0, Math.PI * 2); c.fillStyle = "#fff"; c.fill();
    }
    c.lineWidth = lw;
  }
  // 腮紅
  if(mood === "happy" || opt.blush){ c.fillStyle = "rgba(255,120,150,.45)"; for(const sd of [-1, 1]){ c.beginPath(); c.ellipse(sd * r * .62, ey + r * .3, r * .15, r * .09, 0, 0, Math.PI * 2); c.fill(); } }
  // 鼻子、嘴巴
  const ny = hy + r * .24;
  c.beginPath(); c.moveTo(-r * .08, ny - r * .04); c.lineTo(r * .08, ny - r * .04); c.lineTo(0, ny + r * .05); c.closePath(); c.fillStyle = "#F07F98"; c.fill();
  c.strokeStyle = faceInk; c.lineWidth = lw * .85;
  if(mood === "scared"){ c.beginPath(); c.ellipse(0, ny + r * .2, r * .08, r * .1, 0, 0, Math.PI * 2); c.fillStyle = "#7A3340"; c.fill(); }
  else if(mood === "happy"){ c.beginPath(); c.moveTo(-r * .16, ny + r * .1); c.quadraticCurveTo(0, ny + r * .34, r * .16, ny + r * .1); c.closePath(); c.fillStyle = "#C2475E"; c.fill(); }
  else { c.beginPath(); c.moveTo(-r * .18, ny + r * .1); c.quadraticCurveTo(-r * .09, ny + r * .2, 0, ny + r * .07); c.quadraticCurveTo(r * .09, ny + r * .2, r * .18, ny + r * .1); c.stroke(); }
  // 鬍鬚

let AC = null, master = null, musicGain = null, musicTimer = null, nextNoteTime = 0, noteIdx = 0;
function audio(){
  if(!AC){
    try{

      master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
      musicGain = AC.createGain(); musicGain.gain.value = 0; musicGain.connect(master);

// 喵：鋸齒波通過帶通濾波，音高先升再降
function meow(kind = "happy"){
  const a = audio(); if(!a) return;
  const t = a.currentTime, scared = kind === "scared";
  const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = "sawtooth";
  const base = scared ? 820 + Math.random() * 120 : 520 + Math.random() * 160;
  const dur = scared ? .32 : .5;
  o.frequency.setValueAtTime(base * .8, t);
  o.frequency.linearRampToValueAtTime(base * (scared ? 1.55 : 1.25), t + dur * .35);
  o.frequency.linearRampToValueAtTime(base * (scared ? 1.2 : .85), t + dur);
  if(scared){ const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 28; lg.gain.value = 40; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur); }

  f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(scared ? 2400 : 1800, t + dur * .4); f.frequency.linearRampToValueAtTime(1000, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(scared ? .22 : .2, t + .04); g.gain.linearRampToValueAtTime(.12, t + dur * .7); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function blip(freqs, type = "triangle", len = .09, vol = .14){
  const a = audio(); if(!a) return;
  freqs.forEach((fr, i) => {
    const t = a.currentTime + i * len, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + len * 1.6);

const MIDI = n => 440 * Math.pow(2, (n - 69) / 12);
const MEL = [76,79,81,79, 76,74,72,74, 76,76,79,76, 74,0,72,0, 69,72,74,76, 79,76,74,72, 74,76,74,72, 69,0,0,0,

const BASS = [48,43,45,40, 41,48,43,43, 48,45,41,43, 41,43,48,48];
const BPM = 112, EIGHTH = 60 / BPM / 2;
function scheduleMusic(){
  if(!AC) return;
  while(nextNoteTime < AC.currentTime + .15){
    const i = noteIdx % MEL.length, n = MEL[i], t = nextNoteTime;
    if(n){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.value = MIDI(n);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + EIGHTH * 1.8);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + EIGHTH * 1.9);
    }
    if(i % 4 === 0){
      const bn = BASS[(i / 4) % BASS.length], o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = MIDI(bn);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.13, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + EIGHTH * 3.6);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + EIGHTH * 3.8);
    }
    if(i % 2 === 1){ // 輕輕的沙鈴
      const len = .04, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate), d = buf.getChannelData(0);
      for(let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
      const s = AC.createBufferSource(), hp = AC.createBiquadFilter(), g = AC.createGain();

      s.buffer = buf; s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t);
    }

}
function setMusic(on, soft){
  if(!audio()) return;
  const target = on && save.music ? (soft ? .25 : .7) : 0;
  musicGain.gain.cancelScheduledValues(AC.currentTime);

  if(target && !musicTimer){ nextNoteTime = AC.currentTime + .1; musicTimer = setInterval(scheduleMusic, 50); }
  if(!target && musicTimer){ setTimeout(() => { if(musicGain.gain.value < .01 && musicTimer){ clearInterval(musicTimer); musicTimer = null; } }, 1200); }
}

const occupied = (x, y) => G.train.some(c => c.x === x && c.y === y) || (G.stray && G.stray.x === x && G.stray.y === y) ||
  G.foods.some(f => f.x === x && f.y === y) || (G.can && G.can.x === x && G.can.y === y) || (G.bed && G.bed.x === x && G.bed.y === y);
function freeCell(){
  const h = G.train[0], [dx, dy] = DIRS[G.dir];
  for(let k = 0; k < 300; k++){
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
    if(occupied(x, y)) continue;
    // 不要直接生在列車長正前方 2 格內
    let ahead = false; for(let s = 1; s <= 2; s++) if(h.x + dx * s === x && h.y + dy * s === y) ahead = true;

function spawnStray(){
  const p = freeCell(); if(!p) return;
  // 還沒收編過的品種比較容易出現
  const pool = BREEDS.flatMap(b => G.collected[b.id] ? [b.id] : [b.id, b.id, b.id]);
  G.stray = {...p, breed: pool[Math.floor(Math.random() * pool.length)], born: G.t};
}
function spawnFood(){
  const p = freeCell(); if(!p) return;
  const good = Math.random() < .62;
  const list = good ? GOOD_FOODS : BAD_FOODS;
  G.foods.push({...p, kind: list[Math.floor(Math.random() * list.length)]});
}

// ---------- 操作 ----------
function turn(d){
  audio();
  if(state === "menu" || state === "over") return;
  if(state === "paused") return;
  if(state === "nap"){ wake(); return; }
  if(state === "ready" && !G.started){
    if(G.train.length > 1 && d === OPP[G.dir]) return;
    G.dir = d; G.started = true; state = "play"; G.acc = 0; setMusic(true); return;
  }
  const last = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
  if(d === last || d === OPP[last]) return;
  if(G.queue.length < 2) G.queue.push(d);
}
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const map = {arrowup:"up", w:"up", arrowdown:"down", s:"down", arrowleft:"left", a:"left", arrowright:"right", d:"right"};
  if(map[k]){ e.preventDefault(); turn(map[k]); }
  else if(k === " " || k === "p"){ e.preventDefault(); togglePause(); }
  else if(k === "enter" && (state === "over" || state === "menu")){ e.preventDefault(); newGame(); }
});
let touch0 = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", e => { if(e.target.closest(".panel")) return; const t = e.touches[0]; touch0 = {x:t.clientX, y:t.clientY}; }, {passive:true});
stage.addEventListener("touchmove", e => { if(!touch0) return; e.preventDefault();
  const t = e.touches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  if(Math.max(Math.abs(dx), Math.abs(dy)) > 22){ turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")); touch0 = {x:t.clientX, y:t.clientY}; }
}, {passive:false});
stage.addEventListener("touchend", () => { touch0 = null; });
document.querySelectorAll(".pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.d); }));
function togglePause(){
  if(state === "play" || state === "ready" || state === "nap"){ pausedFrom = state; state = "paused"; setMusic(false);
    showOverlay(`<h2>暫停中</h2><p class="muted">貓咪們在原地等你。</p><div class="btns"><button class="btn acc" data-act="resume">繼續</button><button class="btn" data-act="menu">換列車長／重來</button></div>`); }
  else if(state === "paused") resume();
}
function resume(){ if(state !== "paused") return; state = pausedFrom; hideOverlay(); if(state !== "ready" || G.started) setMusic(true, state === "nap"); }
document.addEventListener("visibilitychange", () => { if(document.hidden && (state === "play" || state === "nap")) togglePause(); });

// ---------- 每一步 ----------
function step(){
  if(G.queue.length) G.dir = G.queue.shift();
  const [dx, dy] = DIRS[G.dir], h = G.train[0];
  const nx = h.x + dx, ny = h.y + dy;
  G.train.forEach(c => { c.px = c.x; c.py = c.y; });
  // 撞牆或撞到同伴（尾巴這一步會讓開，所以不算）
  const hitWall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
  const willGrow = G.stray && G.stray.x === nx && G.stray.y === ny;
  const body = willGrow ? G.train : G.train.slice(0, -1);
  const hitSelf = !hitWall && body.some(c => c.x === nx && c.y === ny);
  if(hitWall || hitSelf){ crash(hitWall ? "wall" : "self", nx, ny); return; }
  // 往前走：每隻貓走到前一隻的位置
  const tail = G.train[G.train.length - 1], tx = tail.x, ty = tail.y;
  for(let i = G.train.length - 1; i > 0; i--){ G.train[i].x = G.train[i - 1].x; G.train[i].y = G.train[i - 1].y; }
  h.x = nx; h.y = ny;
  // 收編流浪貓
  if(willGrow){
    const b = BY[G.stray.breed];
    G.train.push({x:tx, y:ty, px:tx, py:ty, breed:b.id, fat:0, happy:1500, scared:0});
    const first = !save.seen[b.id];
    save.seen[b.id] = (save.seen[b.id] || 0) + 1; G.collected[b.id] = (G.collected[b.id] || 0) + 1; persist();
    G.score += 10;
    toast(`收編了一隻${b.name}！${first ? "（圖鑑新登場）" : ""}`, b.fact, first ? "gold" : "");
    meow("happy");
    G.stray = null; spawnStray();
    G.tickMs = Math.max(115, 260 - (G.train.length - 1) * 7);
  }
  // 吃東西
  const fi = G.foods.findIndex(f => f.x === nx && f.y === ny);
  if(fi >= 0){
    const f = G.foods[fi], F = FOODS[f.kind]; G.foods.splice(fi, 1);
    if(F.good){
      G.eatenGood++; G.score += 5; SFX.good();
      G.train.forEach(c => c.happy = 1800);
      const fatOne = G.train.find(c => c.fat > 0);
      if(fatOne){ fatOne.fat--; toast(F.msg, `${BY[fatOne.breed].name}吃得健康，瘦回來一點了。`); }
      else toast(F.msg);
    }else{
      G.eatenBad++; G.score += 1; SFX.bad();
      const cand = G.train.filter(c => c.fat < 2);
      const n = Math.min(cand.length, 1 + Math.floor(Math.random() * 2));
      const names = [];
      for(let k = 0; k < n; k++){ const c = cand.splice(Math.floor(Math.random() * cand.length), 1)[0]; c.fat++; names.push(BY[c.breed].name); }
      toast(F.msg, names.length ? `${[...new Set(names)].join("、")}變胖了！吃健康的食物可以瘦回來。` : "大家都已經胖嘟嘟了，快吃點健康的吧！", "bad");
    }
    spawnFood();
  }
  // 金色貓罐罐
  if(G.can && G.can.x === nx && G.can.y === ny){
    G.can = null; G.lives = Math.min(5, G.lives + 1); G.score += 15; SFX.can(); G.canTimer = 20000 + Math.random() * 10000;
    toast("吃到金色貓罐罐！復活次數 +1", `現在可以復活 ${G.lives} 次。`, "gold");
  }
  // 休息站
  if(G.bed && G.bed.x === nx && G.bed.y === ny){ G.bed = null; nap(); }
  // 前面 2 格有同伴：那隻貓會害怕
  let scaredNow = false;
  for(let s = 1; s <= 2; s++){
    const ax = h.x + dx * s, ay = h.y + dy * s;
    G.train.forEach((c, i) => { if(i > 1 && c.x === ax && c.y === ay){ if(!c.scared) scaredNow = true; c.scared = 700; } });
  }
  if(scaredNow && G.t - G.lastScaredMeow > 900){ meow("scared"); G.lastScaredMeow = G.t; }
  updateHud();
}
function nap(){
  state = "nap"; G.naps++; G.score += 3; G.napUntil = G.t + 5000; G.queue = []; SFX.bed(); setMusic(true, true);
  G.train.forEach(c => { c.px = c.x; c.py = c.y; });
  toast("到休息站了，大家睡一下", "手也休息一下吧。5 秒後出發，按任意方向鍵可以提早叫醒大家。");
  G.bedTimer = 25000 + Math.random() * 10000;
}
function wake(){ if(state !== "nap") return; state = "play"; G.acc = 0; setMusic(true); }

// ---------- 撞到了 ----------
function crash(kind, nx, ny){
  SFX.crash();
  const h = G.train[0];
  const style = G.train.length >= 3 && Math.random() < .5 ? "pile" : "scatter";
  G.crash = {kind, style, t0:G.t, cx:h.x, cy:h.y,
    parts: G.train.map((c, i) => {
      const ang = Math.random() * Math.PI * 2, sp = 2.5 + Math.random() * 3;
      return {vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp - 2, spin:(Math.random() - .5) * 6, i};
    })};
  // 貓山的位置：從撞到的地方往上疊
  const n = G.train.length; let idx = 0; const pile = [];
  for(let row = 0; idx < n; row++){
    const cnt = Math.max(1, Math.ceil(Math.sqrt(n)) - row);
    for(let k = 0; k < cnt && idx < n; k++, idx++) pile.push({dx:(k - (cnt - 1) / 2) * .78, dy:-row * .62});
  }
  G.crash.pile = pile.reverse();
  state = "crash"; setMusic(false);
  toast(kind === "wall" ? "撞到牆了！" : "撞到同伴了！",
    style === "pile" ? "大家嚇得疊成一座貓山……" : "大家嚇得全部散開了……", "bad");
}
function afterCrash(){
  if(G.lives > 0){
    G.lives--;
    rebuildTrain();
    state = "ready"; G.started = true; G.readyUntil = G.t + 2400; G.crash = null; G.queue = [];
    toast("大家重新排好隊了", `剩下 ${G.lives} 次復活。2 秒後出發！`);
    updateHud();
  }else{
    state = "over"; gameOver();
  }
}
// 復活：把隊伍從左下角開始蛇行排好，列車長在最後一格，面向空的地方
function rebuildTrain(){
  const n = G.train.length, path = [];
  for(let r = 0; path.length < n + 1; r++){
    const y = ROWS - 1 - r; if(y < 0) break;
    const xs = [...Array(COLS).keys()]; if(r % 2) xs.reverse();
    xs.forEach(x => path.push({x, y}));
  }
  const cats = G.train.slice();
  for(let i = 0; i < n; i++){ const p = path[n - 1 - i]; const c = cats[i]; c.x = c.px = p.x; c.y = c.py = p.y; c.scared = 0; }
  const h = path[n - 1], nx = path[n];
  G.dir = nx.x > h.x ? "right" : nx.x < h.x ? "left" : "up";
  // 清掉被壓到的東西
  const onTrain = (o) => o && G.train.some(c => c.x === o.x && c.y === o.y);
  if(onTrain(G.stray)){ G.stray = null; spawnStray(); }
  G.foods = G.foods.filter(f => !onTrain(f)); while(G.foods.length < 2) spawnFood();
  if(onTrain(G.can)) G.can = null;
  if(onTrain(G.bed)) G.bed = null;
}
function gameOver(){
  const len = G.train.length - 1, best = G.score > save.best;
  if(best){ save.best = G.score; persist(); }
  const kinds = Object.keys(G.collected).length;
  const fact = STREET_FACTS[Math.floor(Math.random() * STREET_FACTS.length)];
  showOverlay(`<h2>${best ? "新紀錄！" : "這趟列車到站了"}</h2>
    <p class="muted">${len ? `你收編了 ${len} 隻流浪貓，${kinds} 種花色。` : "這次沒有收編到貓咪，再試一次吧！"}</p>
    <div class="stats"><div><b>${G.score}</b><span>分數</span></div><div><b>${len}</b><span>收編的貓</span></div><div><b>${save.best}</b><span>最高分</span></div></div>
    <p class="muted" style="font-size:13px">健康食物 ${G.eatenGood} 次・不健康的 ${G.eatenBad} 次・在休息站睡了 ${G.naps} 次</p>
    <div class="fact"><b>貓咪小知識</b><br>${fact}</div>
    <div class="btns"><button class="btn acc" data-act="again">再玩一次</button><button class="btn" data-act="menu">換列車長</button><button class="btn" data-act="book">看圖鑑</button></div>`);
}

// ---------- 主迴圈 ----------
let lastTs = 0;
function loop(ts){
  const dt = Math.min(100, ts - (lastTs || ts)); lastTs = ts;
  if(G && state !== "paused" && state !== "menu"){
    G.t += dt;
    G.train.forEach(c => { c.happy = Math.max(0, c.happy - dt); c.scared = Math.max(0, c.scared - dt); });
    if(state === "play"){
      G.acc += dt;
      while(G.acc >= G.tickMs && state === "play"){ G.acc -= G.tickMs; step(); }
      // 罐罐、休息站定時出現
      if(!G.can){ G.canTimer -= dt; if(G.canTimer <= 0){ const p = freeCell(); if(p){ G.can = {...p, until:G.t + 9000}; toast("金色貓罐罐出現了！", "吃到可以多一次復活，9 秒後會消失。", "gold"); } G.canTimer = 22000 + Math.random() * 10000; } }
      else if(G.t > G.can.until){ G.can = null; }
      if(!G.bed){ G.bedTimer -= dt; if(G.bedTimer <= 0){ const p = freeCell(); if(p){ G.bed = {...p}; toast("休息站出現了", "走進貓窩，大家可以睡一下。"); } G.bedTimer = 1e9; } }
    }else if(state === "nap"){
      if(G.t >= G.napUntil) wake();
    }else if(state === "ready" && G.started && G.readyUntil && G.t >= G.readyUntil){
      state = "play"; G.acc = 0; G.readyUntil = 0; setMusic(true);
    }else if(state === "crash"){
      if(G.t - G.crash.t0 > 1900) afterCrash();
    }
  }
  draw(ts);
  requestAnimationFrame(loop);
}

// ---------- 畫面 ----------
function drawBoard(){
  const s = CELL;
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
    ctx.fillStyle = (x + y) % 2 ? "#F7E6C8" : "#F2DDBA"; ctx.fillRect(x * s, y * s, s + .5, s + .5);
  }
  // 地上的小腳印
  ctx.fillStyle = "rgba(160,120,80,.12)";
  [[2, 3], [10, 5], [6, 11], [11, 13], [3, 13]].forEach(([x, y]) => { const cx = (x + .5) * s, cy = (y + .5) * s;
    ctx.beginPath(); ctx.ellipse(cx, cy + s * .08, s * .16, s * .13, 0, 0, Math.PI * 2); ctx.fill();
    for(const [dx, dy] of [[-.17, -.12], [-.06, -.2], [.06, -.2], [.17, -.12]]){ ctx.beginPath(); ctx.arc(cx + dx * s, cy + dy * s, s * .05, 0, Math.PI * 2); ctx.fill(); } });
}
function draw(ts){
  const s = CELL;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBoard();
  if(!G){ return; }
  const t = G.t;
  // 物品
  if(G.bed) drawItem(ctx, (G.bed.x + .5) * s, (G.bed.y + .5) * s, s, "bed", t);
  G.foods.forEach(f => drawItem(ctx, (f.x + .5) * s, (f.y + .5) * s, s, f.kind, t));
  if(G.can){ const left = G.can.until - t; if(left > 2500 || Math.floor(t / 150) % 2) drawItem(ctx, (G.can.x + .5) * s, (G.can.y + .5) * s, s, "can", t); }
  if(G.stray){
    const st = G.stray, bob = Math.sin(t / 250) * s * .04;
    drawCat(ctx, (st.x + .5) * s, (st.y + .5) * s + bob, s * .9, st.breed, {blush:true});
    // 小對話框「喵？」
    const bx = (st.x + .5) * s + s * .38, by = (st.y + .5) * s - s * .5;
    ctx.save(); ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * .04);
    ctx.beginPath(); ctx.roundRect(bx - s * .26, by - s * .17, s * .52, s * .3, s * .1); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = `900 ${s * .2}px system-ui,"Noto Sans TC",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("喵？", bx, by - s * .02); ctx.restore();
  }
  // 隊伍
  const k = state === "play" ? Math.min(1, G.acc / G.tickMs) : 1;
  const ease = k;
  if(state === "crash") drawCrash(t);
  else{
    for(let i = G.train.length - 1; i >= 0; i--){
      const c = G.train[i];
      const x = (c.px + (c.x - c.px) * ease + .5) * s, y = (c.py + (c.y - c.py) * ease + .5) * s;
      const mood = state === "nap" ? "sleep" : c.scared ? "scared" : c.happy ? "happy" : "normal";
      const hop = state === "play" ? Math.abs(Math.sin((t / 140) + i * .9)) * s * .05 : 0;
      drawCat(ctx, x, y - hop, s * 1.02, c.breed, {mood, fat:c.fat, leader:i === 0, shake:!!c.scared});
      if(c.happy > 1200 && i % 2 === 0) heart(ctx, x + s * .3, y - s * .5 - (1800 - c.happy) / 1800 * s * .4, s * .16);
    }
  }
  // 睡覺的 Zzz
  if(state === "nap"){
    const h = G.train[0], hx = (h.x + .5) * s, hy = (h.y + .5) * s;
    ctx.save(); ctx.fillStyle = "#6E57C9"; ctx.textAlign = "center";
    for(let j = 0; j < 3; j++){ const p = ((t / 900) + j / 3) % 1; ctx.globalAlpha = 1 - p; ctx.font = `900 ${s * (.3 + p * .3)}px system-ui,sans-serif`; ctx.fillText("z", hx + s * (.3 + p * .5), hy - s * (.5 + p * 1.1)); }
    ctx.restore();
    banner(`小睡一下… ${Math.ceil((G.napUntil - t) / 1000)}`, "按方向鍵可以提早出發");
  }
  if(state === "ready"){
    if(!G.started) banner("按方向鍵或滑一下，出發！", "收編流浪貓，避開牆壁和同伴");
    else if(G.readyUntil) banner(`準備出發 ${Math.ceil((G.readyUntil - t) / 1000)}`, "");
  }
}
function drawCrash(t){
  const s = CELL, C = G.crash, p = Math.min(1, (t - C.t0) / 1200);
  G.train.forEach((c, i) => {
    const part = C.parts[i];
    let x, y, rot = 0;
    if(C.style === "scatter"){
      const tt = (t - C.t0) / 1000;
      x = (c.x + .5 + part.vx * tt * Math.max(0, 1 - tt * .35)) * s;
      y = (c.y + .5 + (part.vy * tt + 3.2 * tt * tt) * Math.max(0, 1 - tt * .35)) * s;
      rot = part.spin * tt;
    }else{
      const target = C.pile[i], e = 1 - Math.pow(1 - p, 3);
      const tx = C.cx + .5 + target.dx, ty = Math.max(1.2, C.cy + .5) + target.dy;
      x = ((c.x + .5) + (tx - c.x - .5) * e) * s;
      y = ((c.y + .5) + (ty - c.y - .5) * e - Math.sin(e * Math.PI) * 1.2) * s;
    }
    drawCat(ctx, x, y, s * 1.02, c.breed, {mood: i === 0 ? "dizzy" : "scared", fat:c.fat, leader:i === 0, rot, shake:true});
  });
}
function banner(title, sub){
  const W = COLS * CELL, y = ROWS * CELL * .2;
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,.88)"; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  const bw = Math.min(W - 24, 340), bh = sub ? 66 : 46;
  ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, y - bh / 2, bw, bh, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.font = `900 18px system-ui,"Noto Sans TC",sans-serif`; ctx.fillText(title, W / 2, y - (sub ? 11 : 0));
  if(sub){ ctx.fillStyle = "#8A7462"; ctx.font = `700 13px system-ui,"Noto Sans TC",sans-serif`; ctx.fillText(sub, W / 2, y + 14); }
  ctx.restore();
}

// ---------- 畫面上的文字 ----------
function updateHud(){
  document.getElementById("hLen").textContent = G ? G.train.length : 1;
  document.getElementById("hScore").textContent = G ? G.score : 0;
  document.getElementById("hLives").textContent = G ? G.lives : 1;
}
function toast(msg, sub = "", cls = ""){
  const box = document.getElementById("toasts");
  const el = document.createElement("div"); el.className = "toast " + cls;
  el.innerHTML = esc(msg) + (sub ? `<small>${esc(sub)}</small>` : "");
  box.appendChild(el);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, sub ? 3200 : 2000);
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[ch]));
const ov = document.getElementById("ov"), panel = document.getElementById("panel");
function showOverlay(html){ panel.innerHTML = html; ov.hidden = false; panel.scrollTop = 0; }
function hideOverlay(){ ov.hidden = true; }
let overlayBack = null;   // 從圖鑑或說明回去哪裡

function showMenu(){
  state = "menu"; setMusic(false);
  showOverlay(`<h2>選一隻貓當列車長</h2>
    <p class="muted">列車長會一直往前走，沿路收編流浪貓。</p>
    <div class="pick" id="pick"></div>
    <p id="pickName" style="font-weight:900;margin:2px 0"></p>
    <div class="btns"><button class="btn acc" data-act="start">出發！</button><button class="btn" data-act="help">怎麼玩</button></div>
    ${save.best ? `<p class="muted" style="font-size:13px">最高分 ${save.best}・圖鑑 ${Object.keys(save.seen).length} / ${BREEDS.length}</p>` : ""}`);
  const pick = document.getElementById("pick");
  BREEDS.forEach(b => {
    const btn = document.createElement("button"); btn.type = "button"; btn.dataset.breed = b.id;
    btn.appendChild(miniCanvas(64, (c, px) => drawCat(c, px / 2, px * .56, px * .9, b.id, {leader:true})));
    btn.appendChild(document.createTextNode(b.name));
    btn.onclick = () => { save.leader = b.id; persist(); markPick(); meow("happy"); };
    pick.appendChild(btn);
  });
  markPick();
}
function markPick(){
  document.querySelectorAll("#pick button").forEach(b => b.classList.toggle("on", b.dataset.breed === save.leader));
  const b = BY[save.leader]; const el = document.getElementById("pickName"); if(el) el.textContent = `${b.name}列車長`;
}
function showBook(back){
  overlayBack = back;
  const n = Object.keys(save.seen).length;
  showOverlay(`<h2>流浪貓圖鑑 ${n} / ${BREEDS.length}</h2>
    <p class="muted">收編過的貓咪會記在這裡。</p>
    <div class="book" id="book"></div>
    <div class="btns"><button class="btn acc" data-act="back">回去</button></div>`);
  const book = document.getElementById("book");
  BREEDS.forEach(b => {
    const got = save.seen[b.id];
    const it = document.createElement("div"); it.className = "it" + (got ? "" : " no");
    it.appendChild(miniCanvas(56, (c, px) => { if(got) drawCat(c, px / 2, px * .55, px * .9, b.id, {mood:"happy"}); else { c.globalAlpha = .25; drawCat(c, px / 2, px * .55, px * .9, "black", {mood:"sleep"}); } }));
    const tx = document.createElement("div");
    tx.innerHTML = got ? `<b>${b.name}</b> <span class="muted" style="font-size:12px">收編 ${got} 次</span><p>${esc(b.fact)}</p>` : `<b>？？？</b><p>還沒收編過。</p>`;
    it.appendChild(tx); book.appendChild(it);
  });
}
function showHelp(back){
  overlayBack = back;
  showOverlay(`<h2>怎麼玩</h2>
    <ol class="help">
      <li>列車長會<b>一直往前走</b>，用方向鍵、WASD、滑動或下面的按鈕轉彎。</li>
      <li>走到<b>流浪貓</b>身上就收編牠，隊伍會變長、速度也會變快。</li>
      <li>撞到<b>牆壁</b>或<b>自己的隊伍</b>就會出事。快撞到的貓咪會嚇到發抖、喵喵叫。</li>
      <li>還有<b>復活次數</b>的話，大家會重新排好隊繼續走。</li>
      <li>累了就走進<b>休息站</b>的貓窩，大家睡 5 秒，你的手也休息一下。</li>
    </ol>
    <div class="legend" id="legend"></div>
    <div class="btns"><button class="btn acc" data-act="back">知道了</button></div>`);
  const lg = document.getElementById("legend");
  [["fish", "魚、水煮雞肉、貓草：健康，大家開心，胖貓會瘦回來"], ["fries", "薯條、蛋糕、炸雞：不健康，會有貓變胖"], ["can", "金色貓罐罐：復活次數 +1（會消失）"], ["bed", "休息站：睡一下，讓手休息"]].forEach(([k, txt]) => {
    const d = document.createElement("div");
    d.appendChild(miniCanvas(34, (c, px) => drawItem(c, px / 2, px / 2, px * .95, k, 0)));
    d.appendChild(document.createTextNode(txt)); lg.appendChild(d);
  });
}
panel.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if(!a) return;
  audio();
  const act = a.dataset.act;
  if(act === "start" || act === "again"){ newGame(); }
  else if(act === "menu"){ showMenu(); }
  else if(act === "resume"){ resume(); }
  else if(act === "book"){ showBook(state === "over" ? "over" : "menu"); }
  else if(act === "help"){ showHelp("menu"); }
  else if(act === "back"){
    if(overlayBack === "over") gameOver();
    else if(overlayBack === "paused"){ showOverlay(`<h2>暫停中</h2><p class="muted">貓咪們在原地等你。</p><div class="btns"><button class="btn acc" data-act="resume">繼續</button><button class="btn" data-act="menu">換列車長／重來</button></div>`); }
    else showMenu();
  }
});
document.getElementById("bPause").onclick = () => { audio(); if(state === "menu" || state === "over") return; togglePause(); };
document.getElementById("bMusic").onclick = () => { save.music = !save.music; persist(); musicLabel(); if(state === "play" || state === "nap") setMusic(true, state === "nap"); else setMusic(false); };
document.getElementById("bBook").onclick = () => {
  if(state === "play" || state === "ready" || state === "nap") togglePause();
  showBook(state === "paused" ? "paused" : state === "over" ? "over" : "menu");
};
document.getElementById("bHelp").onclick = () => {
  if(state === "play" || state === "ready" || state === "nap") togglePause();
  showHelp(state === "paused" ? "paused" : state === "over" ? "over" : "menu");
};

// ---------- 開始 ----------
const logo = document.getElementById("logo").getContext("2d");
logo.clearRect(0, 0, 88, 88); drawCat(logo, 44, 50, 80, "orange", {leader:true, mood:"happy"});
musicLabel();
resize(); addEventListener("resize", () => { resize(); });
showMenu();
requestAnimationFrame(loop);
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>喵喵列車長</title>
<meta name="description" content="當上喵喵列車長，沿路收編流浪貓，吃健康的食物，不要撞到同伴！">
<meta property="og:title" content="喵喵列車長｜收編流浪貓">
<meta property="og:description" content="當上喵喵列車長，沿路收編流浪貓，吃健康的食物，不要撞到同伴！">
<meta name="theme-color" content="#FFF4E2">
<style>
:root{--bg:#FFF4E2;--ink:#3A2A20;--muted:#8A7462;--card:#FFFFFF;--line:#3A2A20;--acc:#FF8A3D;--acc2:#E6527A;--good:#3BA55C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 0}
header{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
header h1{font-size:24px;margin:0;font-weight:900;letter-spacing:1px}
header .sub{font-size:13px;color:var(--muted);font-weight:700}
.hud{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px 8px;font-weight:900;font-size:14px;line-height:1.3}
.pill.fatp{background:#FFE3DC;border-color:#C2475E;color:#9B2C42}
.pill[hidden]{display:none}
.pill small{font-weight:700;color:var(--muted);font-size:12px}
.hud .sp{flex:1}
.ibtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 8px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:4px;box-shadow:2px 2px 0 var(--line)}
.ibtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.stage{position:relative;flex:none;border:3px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:4px 4px 0 var(--line);background:#F7E6C8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.game{display:flex;gap:16px;align-items:flex-start;justify-content:center}
.side{flex:none;width:300px}
.side header{margin-top:0}
.side .hud{margin-bottom:14px}
.side .tip{text-align:left;margin-top:12px}
.side h3{margin:0 0 6px;font-size:14px;color:var(--muted)}
.hint{margin:0 0 12px;font-size:13px;font-weight:800;background:#fff;border:2px solid #E6D6C2;border-radius:12px;padding:6px 10px;line-height:1.7}
.hint:empty{display:none}
.hint i,.tierh i{font-style:normal;padding:1px 7px;border-radius:99px;color:#fff;font-size:12px}
.toasts{display:flex;flex-direction:column;gap:6px}
.toasts .empty{font-size:13px;color:var(--muted);border:2px dashed #E6D6C2;border-radius:14px;padding:10px 12px}
@media(max-width:760px){.game{flex-direction:column;align-items:stretch;gap:8px}.side{display:contents}.side header{order:0;margin:2px 0 0}.side .hud{order:1;margin-bottom:0}.hint{order:2;margin:0}.side .rec{display:none}.stage{order:3}.side h3{display:none}.toasts{order:4;min-height:58px}.toasts .toast.old{display:none}.side .tip{order:5;text-align:center;margin-top:4px}}
.toast{background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:14px;font-weight:800;animation:tin .25s ease-out;box-shadow:2px 2px 0 var(--line);transition:opacity .4s}
.toast.old{opacity:.5;box-shadow:none}
.toast small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:1px}
.toast.bad{background:#FFF0EC}
.toast.gold{background:#FFF6CC}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(255,244,226,.86);z-index:4;overflow:auto}
.ov[hidden]{display:none}
.panel{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:440px;box-shadow:4px 4px 0 var(--line);text-align:center;max-height:100%;overflow:auto}
.panel h2{margin:0 0 6px;font-size:21px}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.6}
.muted{color:var(--muted)}
.btn{border:2.5px solid var(--line);border-radius:14px;padding:10px 16px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.pick button{border:2px solid #E6D6C2;background:#FFF9F0;border-radius:12px;padding:4px 2px 3px;cursor:pointer;font:inherit;font-size:12px;font-weight:800;color:var(--ink)}
.pick button:disabled{cursor:not-allowed;color:#BFAF9C}
.pick button.on{border-color:var(--acc);background:#FFE7D3;box-shadow:0 0 0 2px var(--acc)}
.pick canvas{width:100%;max-width:64px;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stats div{background:#FFF6EA;border-radius:12px;padding:6px;position:relative}
.newrec{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--acc2);color:#fff;font-style:normal;font-size:11px;font-weight:900;border-radius:99px;padding:1px 7px;white-space:nowrap}
.rec{margin:0 0 12px;font-size:13px;background:#fff;border:2px solid #E6D6C2;border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.rec b{font-size:15px}
.rec .t{grid-column:1/-1;font-weight:900;color:var(--muted)}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted);font-weight:700}
.lbbox{background:#FFF6EA;border-radius:12px;padding:8px 10px;font-size:14px;margin-top:8px;text-align:left;line-height:1.6}
.lbbox .small,.panel .small{font-size:12px;margin:4px 0 0}
.lbform{display:flex;gap:6px;margin-top:6px}
.lbform input{flex:1;min-width:0;font:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.btn.small{padding:6px 12px;font-size:14px}
.lbtabs{display:flex;gap:4px;background:#F3E6D2;border-radius:99px;padding:4px;margin:6px 0 10px}
.lbtabs button{flex:1;border:0;background:transparent;border-radius:99px;padding:6px;font:inherit;font-weight:900;color:var(--muted);cursor:pointer}
.lbtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lblist{display:grid;gap:4px;text-align:left;max-height:52vh;overflow:auto}
.lbrow{display:flex;align-items:center;gap:8px;background:#FFF9F0;border-radius:12px;padding:4px 10px}
.lbrow.mine{background:#FFE7D3;box-shadow:inset 0 0 0 2px var(--acc)}
.lbrow canvas{width:34px;height:34px;flex:none}
.lbrow .rk{width:26px;text-align:center;font-weight:900;color:var(--muted)}
.lbrow .rk.r1{color:#C99400;font-size:18px}.lbrow .rk.r2{color:#8C9AA8;font-size:17px}.lbrow .rk.r3{color:#B87333;font-size:16px}
.lbrow .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .v{text-align:right;font-size:13px}
.lbrow .v b{font-size:17px}
.lbrow .v small{display:block;color:var(--muted);font-size:11px}
.sh{font-size:15px;margin:12px 0 4px;text-align:left}
table.score{width:100%;border-collapse:collapse;font-size:13.5px;text-align:left}
table.score td{padding:4px 6px;border-bottom:1px solid #F0E3D0}
table.score td:nth-child(even){font-weight:900;color:var(--acc);text-align:right;white-space:nowrap}
.fact{background:#EEF8F0;border-radius:12px;padding:8px 10px;font-size:13.5px;text-align:left;line-height:1.6;margin-top:8px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0;text-align:left}
.book .it{display:flex;gap:8px;align-items:center;background:#FFF9F0;border:2px solid #EADBC8;border-radius:12px;padding:6px}
.book .it canvas{width:56px;height:56px;flex:none}
.book .it b{font-size:14px}
.book .it p{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
.book .it.no{opacity:.6}
.tierh{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--muted);margin-top:4px}
.help{text-align:left;font-size:14px;line-height:1.7;margin:6px 0;padding-left:20px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;text-align:left;margin:8px 0}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px;background:#FFF9F0;border-radius:10px;padding:4px 6px}
.legend canvas{width:34px;height:34px;flex:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin:12px auto 0;touch-action:manipulation}
.pad button{border:2.5px solid var(--line);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--line);font-size:22px;font-weight:900;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pad button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line);background:#FFE7D3}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media(max-width:520px){.ibtn .lbl{display:none}}
.tip{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0}
@media(hover:hover) and (pointer:fine){.pad{display:none}}
.portal-foot{text-align:center;color:#8A7462;font:13px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:20px 16px 36px}.portal-foot a{color:#8A7462;text-decoration:none}.portal-foot svg{display:inline-block}.portal-foot a:hover,.portal-foot a:focus-visible{text-decoration:underline;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="game">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="ov" id="ov"><div class="panel" id="panel"></div></div>
    </div>
    <aside class="side">
      <header>
        <canvas id="logo" width="88" height="88" style="width:44px;height:44px"></canvas>
        <div><h1>喵喵列車長</h1><div class="sub">沿路收編流浪貓，帶大家一起回家</div></div>
      </header>
      <div class="hud">
        <span class="pill" title="隊伍裡的貓咪">貓咪 <span id="hLen">1</span></span>
        <span class="pill" title="分數">分數 <span id="hScore">0</span></span>
        <span class="pill" title="復活次數（吃金色貓罐罐可以增加）">復活 <span id="hLives">1</span></span>
        <span class="pill fatp" id="hFat" title="變胖的貓（吃健康的食物會瘦回來）" hidden>胖貓 <span>0</span></span>
        <span class="sp"></span>
        <button class="ibtn" id="bPause" title="暫停（空白鍵）">暫停</button>
        <button class="ibtn" id="bMusic" title="背景音樂"></button>
        <button class="ibtn" id="bBook">圖鑑</button>
        <button class="ibtn" id="bRank">排行榜</button>
        <button class="ibtn" id="bHelp">說明</button>
      </div>
      <p class="hint" id="rareHint"></p>
      <div class="rec" id="recBox"></div>
      <h3>列車廣播</h3>
      <div class="toasts" id="toasts" aria-live="polite"><div class="empty">收編了什麼貓、吃了什麼，都會顯示在這裡。</div></div>
      <p class="tip">方向鍵、WASD、在畫面上滑動，或按下面的按鈕都可以轉彎。空白鍵暫停。</p>
    </aside>
  </div>
  <div class="pad" id="pad">
    <button class="u" data-d="up" aria-label="上">▲</button>
    <button class="l" data-d="left" aria-label="左">◀</button>
    <button class="d" data-d="down" aria-label="下">▼</button>
    <button class="r" data-d="right" aria-label="右">▶</button>
  </div>
</div>
<!-- 回工具箱放在頁面最下方（各網站一致：上方不放） -->
<footer class="portal-foot"><a href="../"><svg viewBox="0 0 32 32" width="1.15em" height="1.15em" aria-hidden="true" focusable="false" style="vertical-align:-.2em"><path d="M10 11 V8 Q10 5 13 5 H19 Q22 5 22 8 V11" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="11" width="26" height="16" rx="3" fill="#E6325F" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 18 H29" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12.5" y="15.5" width="7" height="5.5" rx="1.5" fill="#FFD60A" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> 回工具箱</a>・<a href="../wish/#new">想要新功能？來許願</a></footer>

<script>
/* =========================================================
   喵喵列車長（許願池 #17）
   玩法像貪吃蛇：帶頭的貓（列車長）一直往前走，沿路收編流浪貓，隊伍越來越長。
   - 健康食物：大家開心；不健康的食物：有貓變胖（健康食物可以讓胖貓瘦回來）
   - 金色貓罐罐：多一次復活
   - 撞牆或撞到同伴：貓咪散開或疊成貓山；還有復活次數就重新排好繼續
   所有圖都是用程式畫的，沒有用圖片和 emoji。
   ========================================================= */
const COLS = 13, ROWS = 15;
const INK = "#3A2A20";

// ---------- 貓咪品種（花色、眼睛、小知識） ----------
// tier：0 普通、1 少見、2 稀有、3 傳說（隊伍夠長才會遇到，見 TIERS）
// 其他外觀：fluffy 長毛、tufts 耳尖長毛、bigEars 大耳朵、shortLegs 短腿、wide 圓臉、eye2 另一隻眼睛的顏色
const BREEDS = [
  {id:"orange",  tier:0, name:"橘貓",     base:"#F6A64A", eye:"#7FB33A", fact:"橘貓大多是公貓，因為決定橘色的基因在 X 染色體上。"},
  {id:"calico",  tier:0, name:"三花貓",   base:"#FFFDF8", eye:"#D9A531", fact:"三花貓有白、橘、黑三種顏色，幾乎都是母貓。"},
  {id:"tuxedo",  tier:0, name:"賓士貓",   base:"#2E2B2B", eye:"#E8C547", fact:"黑白配色像穿著燕尾服，英文叫 tuxedo cat（燕尾服貓）。"},
  {id:"tabby",   tier:0, name:"虎斑貓",   base:"#B39878", eye:"#8BB04A", fact:"虎斑貓的額頭上，常常有一個像英文字母「M」的花紋。"},
  {id:"black",   tier:0, name:"黑貓",     base:"#2B2A2E", eye:"#F2C230", fact:"在日本和英國，有些地方把黑貓當成會帶來好運的貓。"},
  {id:"white",   tier:0, name:"白貓",     base:"#FFFFFF", eye:"#62A8E8", fact:"藍眼睛的白貓，比較容易天生聽力不好，要多一點耐心。"},
  {id:"grey",    tier:0, name:"灰貓",     base:"#9EA7B2", eye:"#7CC08A", fact:"灰色其實是「變淡的黑色」，所以灰貓也常被叫做藍貓。"},
  {id:"orangew", tier:0, name:"橘白貓",   base:"#F6A64A", eye:"#9DBB45", fact:"橘白貓和橘貓一樣大多是公貓，是台灣街頭很常見的花色。"},
  {id:"tortie",  tier:1, name:"玳瑁貓",   base:"#3B2C25", eye:"#E2A53A", fact:"玳瑁貓是黑色和橘色混在一起，跟三花貓一樣幾乎都是母貓。"},
  {id:"cow",     tier:1, name:"乳牛貓",   base:"#FFFFFF", eye:"#C9A640", fact:"白底黑斑像乳牛，每一隻的花紋都不一樣，像身分證一樣。"},
  {id:"siamese", tier:1, name:"暹羅貓",   base:"#F3E7D3", eye:"#4C9BE0", fact:"暹羅貓身上比較冷的地方（耳朵、臉、腳、尾巴）顏色會比較深。"},
  {id:"amshort", tier:1, name:"美國短毛貓", base:"#CDD2D8", eye:"#7DB34E", fact:"銀色底加上黑色的漩渦花紋，身體結實，個性穩定好相處。"},
  {id:"british", tier:1, name:"英國短毛貓", base:"#8E9BAA", eye:"#E39B3A", wide:true, fact:"圓圓的臉、胖胖的臉頰，據說是《愛麗絲夢遊仙境》柴郡貓的原型之一。"},
  {id:"ragdoll", tier:2, name:"布偶貓",   base:"#F6EEDF", eye:"#4C8FE0", fluffy:true, fact:"被抱起來的時候常常全身放鬆，像布娃娃一樣，所以叫布偶貓。"},
  {id:"persian", tier:2, name:"波斯貓",   base:"#FFF6EC", eye:"#D98B2B", fluffy:true, fact:"毛又長又多，要常常梳毛；扁扁的臉比較容易有呼吸和眼睛的問題。"},
  {id:"munchkin",tier:2, name:"曼赤肯貓", base:"#E2B57E", eye:"#8FB84A", shortLegs:true, fact:"腿天生特別短，所以又叫「短腿貓」，不過跑起來一樣很快。"},
  {id:"mainecoon",tier:2,name:"緬因貓",   base:"#9C7650", eye:"#C9A23A", fluffy:true, tufts:true, fact:"體型最大的家貓品種之一，耳朵尖端有像山貓一樣的長毛。"},
  {id:"sphynx",  tier:3, name:"斯芬克斯無毛貓", base:"#F0C6B4", eye:"#7FC08A", bigEars:true, fact:"幾乎沒有毛，摸起來像溫暖的麂皮；怕冷也怕曬，還要常常洗澡。"},
  {id:"oddeye",  tier:3, name:"異色瞳白貓", base:"#FFFFFF", eye:"#5AA8F0", eye2:"#F2C230", fact:"兩隻眼睛顏色不一樣叫「異色瞳」，在日本被叫做「金目銀目」，代表好運。"},
  {id:"malecalico", tier:3, name:"公三花貓", base:"#FFFDF8", eye:"#D9A531", fact:"三花貓幾乎都是母貓，公三花大約幾千隻才有一隻，在日本被當成幸運的象徵。"},
];
// 稀有度：隊伍有幾隻貓（含列車長）才會開始遇到、出現的機率權重、分數、光圈顏色、會不會跑走（毫秒）
const TIERS = [
  {name:"普通", need:1,  weight:60, score:10, glow:null,      leave:0},
  {name:"少見", need:5,  weight:28, score:15, glow:"#6FB8FF", leave:0},
  {name:"稀有", need:10, weight:16, score:25, glow:"#B57CFF", leave:15000},
  {name:"傳說", need:16, weight:7,  score:50, glow:"#FFC23D", leave:12000},
];
const BY = Object.fromEntries(BREEDS.map(b => [b.id, b]));
const STREET_FACTS = [
  "街上耳朵被剪掉一小角的貓，代表已經結紮、有人在照顧，叫做「剪耳貓」。",
  "貓咪不能吃洋蔥、巧克力、葡萄，人吃的炸物和零食太鹹太油，對貓也不好。",
  "想幫助流浪貓，可以先問問附近的動物保護團體，用「領養代替購買」。",
  "貓咪一天大約要睡 12 到 16 個小時，睡飽了才有精神。",
  "貓咪慢慢眨眼睛，是在說「我信任你」，你也可以慢慢眨眼回應牠。",
  "品種貓也可能被棄養而流浪。決定養貓之前，要想清楚能不能照顧牠一輩子。",
];

// ---------- 食物 ----------
const FOODS = {
  fish:    {name:"魚",       good:true,  msg:"吃了新鮮的魚，大家都好開心！"},
  chicken: {name:"水煮雞肉", good:true,  msg:"水煮雞肉，好吃又健康！"},

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let CELL = 32, DPR = 1;
function resize(){
  const st = document.getElementById("stage"), wrapW = document.querySelector(".wrap").clientWidth - 32;
  const wide = innerWidth > 760;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const top = st.getBoundingClientRect().top + scrollY;
  const availW = (wide ? wrapW - 316 : wrapW) - 6;
  const availH = innerHeight - Math.min(top, 40) - 20;
  CELL = wide ? Math.max(24, Math.min(availW / COLS, availH / ROWS, 60)) : availW / COLS;
  const w = CELL * COLS;
  st.style.width = (w + 6) + "px";
  cv.width = Math.round(w * DPR); cv.height = Math.round(CELL * ROWS * DPR);
  cv.style.width = w + "px"; cv.style.height = (CELL * ROWS) + "px";
}

// ---------- 畫貓 ----------
// (x, y) 是格子中心；s 是格子大小。opt: mood（normal/happy/scared/sleep/dizzy）、fat（0～2）、leader、shake、alpha、rot
function drawCat(c, x, y, s, breedId, opt = {}){
  const b = BY[breedId] || BREEDS[0];
  const mood = opt.mood || "normal", fat = opt.fat || 0;
  c.save();
  c.translate(x + (opt.shake ? (Math.random() - .5) * s * .12 : 0), y);
  if(opt.rot) c.rotate(opt.rot);
  if(opt.alpha != null) c.globalAlpha = opt.alpha;
  const grow = 1 + fat * .07 + (opt.puff ? Math.sin(opt.puff / 600 * Math.PI) * .25 : 0);
  if(grow !== 1) c.scale(grow, grow);
  const lw = Math.max(1.2, s * .045);
  c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = "round"; c.lineCap = "round";
  const r = s * .33, hy = -s * .07;            // 頭的半徑、位置
  if(opt.glow){ const gg = c.createRadialGradient(0, s * .05, s * .08, 0, s * .05, s * .62); gg.addColorStop(0, opt.glow); gg.addColorStop(1, "rgba(255,255,255,0)"); c.save(); c.fillStyle = gg; c.beginPath(); c.arc(0, s * .05, s * .62, 0, Math.PI * 2); c.fill(); c.restore(); }
  const bw = s * (.3 + fat * .13), bh = s * (.2 + fat * .06), by = s * (.2 + fat * .02);
  // 尾巴
  c.beginPath(); c.moveTo(bw * .7, by + bh * .3); c.quadraticCurveTo(bw * 1.45, by - bh * .2, bw * 1.15, by - bh * 1.3);
  c.strokeStyle = INK; c.lineWidth = s * .13; c.stroke();
  c.strokeStyle = tailColor(b); c.lineWidth = s * .13 - lw * 2; c.stroke();
  c.lineWidth = lw; c.strokeStyle = INK;
  // 短腿貓的小短腿（畫在身體後面，只露出一點點）
  if(b.shortLegs){ c.fillStyle = b.base; for(const k of [-.6, -.22, .22, .6]){ c.beginPath(); c.ellipse(k * bw, by + bh * 1.05, bw * .17, bh * .38, 0, 0, Math.PI * 2); c.fill(); c.stroke(); } }
  // 身體
  c.beginPath(); c.ellipse(0, by, bw, bh, 0, 0, Math.PI * 2); c.fillStyle = bodyColor(b); c.fill(); c.stroke();
  if(["tuxedo", "cow", "calico", "malecalico", "orangew"].includes(b.id)){ // 白肚子或身上的斑
    c.save(); c.beginPath(); c.ellipse(0, by, bw, bh, 0, 0, Math.PI * 2); c.clip();
    if(b.id === "tuxedo"){ c.fillStyle = "#fff"; c.beginPath(); c.ellipse(0, by + bh * .3, bw * .45, bh * .9, 0, 0, Math.PI * 2); c.fill(); }
    if(b.id === "cow"){ c.fillStyle = "#2B2A2E"; c.beginPath(); c.ellipse(-bw * .5, by - bh * .2, bw * .35, bh * .6, .3, 0, Math.PI * 2); c.fill(); }
    if(b.id === "orangew"){ c.fillStyle = "#fff"; c.beginPath(); c.ellipse(0, by + bh * .3, bw * .5, bh * .9, 0, 0, Math.PI * 2); c.fill(); }
    if(b.id === "calico" || b.id === "malecalico"){ c.fillStyle = "#F09A3E"; c.beginPath(); c.ellipse(bw * .5, by, bw * .35, bh * .7, 0, 0, Math.PI * 2); c.fill(); }
    c.restore(); c.beginPath(); c.ellipse(0, by, bw, bh, 0, 0, Math.PI * 2); c.stroke();
  }
  // 耳朵（害怕時往兩邊壓平）
  const flat = mood === "scared" ? .55 : 0;
  // 長毛貓：頭後面一圈蓬蓬的毛
  if(b.fluffy){
    // 一圈小圓組成的毛：先畫粗的外框，再填色蓋掉裡面的線，只留最外圈的輪廓
    const fur = [...Array(14)].map((_, k) => { const a = k / 14 * Math.PI * 2; return [Math.cos(a) * r * 1.02, hy + r * .1 + Math.sin(a) * r * .92]; });
    c.lineWidth = lw * 2;
    fur.forEach(([fx, fy]) => { c.beginPath(); c.arc(fx, fy, r * .3, 0, Math.PI * 2); c.stroke(); });
    c.fillStyle = b.id === "mainecoon" ? "#C9A57A" : b.id === "ragdoll" ? "#FFFFFF" : b.base;
    fur.forEach(([fx, fy]) => { c.beginPath(); c.arc(fx, fy, r * .3, 0, Math.PI * 2); c.fill(); });
    c.beginPath(); c.ellipse(0, hy + r * .1, r * 1.02, r * .92, 0, 0, Math.PI * 2); c.fill();
    c.lineWidth = lw;
  }
  const es = b.bigEars ? 1.35 : b.id === "persian" ? .75 : 1;
  for(const sd of [-1, 1]){
    c.save(); c.translate(sd * r * .62, hy - r * .62); c.rotate(sd * (.25 + flat + (b.bigEars ? .15 : 0))); c.scale(es, es);
    c.beginPath(); c.moveTo(-r * .34, r * .22); c.lineTo(0, -r * .5); c.lineTo(r * .34, r * .22); c.closePath();
    c.fillStyle = earColor(b, sd); c.fill(); c.stroke();
    if(b.tufts){ c.beginPath(); c.moveTo(0, -r * .5); c.lineTo(-r * .06, -r * .78); c.moveTo(0, -r * .5); c.lineTo(r * .07, -r * .8); c.stroke(); }
    c.beginPath(); c.moveTo(-r * .16, r * .12); c.lineTo(0, -r * .24); c.lineTo(r * .16, r * .12); c.closePath();
    c.fillStyle = "#F7A8B8"; c.fill();
    c.restore();
  }
  // 頭（胖的時候臉頰鼓鼓的）
  const hw = r * (1 + fat * .17 + (b.wide ? .12 : 0)), hh = r * (.92 + fat * .03);
  c.beginPath(); c.ellipse(0, hy, hw, hh, 0, 0, Math.PI * 2); c.fillStyle = b.base; c.fill();
  c.save(); c.clip(); headPattern(c, b, hw, hh, hy); c.restore();
  c.beginPath(); c.ellipse(0, hy, hw, hh, 0, 0, Math.PI * 2); c.stroke();
  // 胖胖的雙下巴
  if(fat){ c.save(); c.lineWidth = lw * .8; c.strokeStyle = "rgba(58,42,32,.55)"; c.beginPath(); c.ellipse(0, hy + hh * .78, hw * (.35 + fat * .1), hh * .14, 0, .15 * Math.PI, .85 * Math.PI); c.stroke(); c.restore(); }
  // 臉
  const ey = hy - r * .05, ex = r * .4;
  const dark = ["tuxedo", "black", "tortie"].includes(b.id);
  const faceInk = dark ? "#FFF6E8" : INK;
  c.strokeStyle = faceInk; c.fillStyle = faceInk;
  if(mood === "happy"){
    for(const sd of [-1, 1]){ c.beginPath(); c.arc(sd * ex, ey + r * .08, r * .16, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
  }else if(mood === "sleep"){
    for(const sd of [-1, 1]){ c.beginPath(); c.arc(sd * ex, ey - r * .02, r * .15, Math.PI * .15, Math.PI * .85); c.stroke(); }
  }else if(mood === "dizzy"){
    for(const sd of [-1, 1]){ const cx2 = sd * ex; c.beginPath(); c.moveTo(cx2 - r * .13, ey - r * .13); c.lineTo(cx2 + r * .13, ey + r * .13); c.moveTo(cx2 + r * .13, ey - r * .13); c.lineTo(cx2 - r * .13, ey + r * .13); c.stroke(); }
  }else if(mood === "scared"){
    for(const sd of [-1, 1]){
      c.beginPath(); c.arc(sd * ex, ey, r * .22, 0, Math.PI * 2); c.fillStyle = "#fff"; c.fill(); c.strokeStyle = INK; c.stroke();
      c.beginPath(); c.arc(sd * ex, ey + r * .02, r * .07, 0, Math.PI * 2); c.fillStyle = INK; c.fill();
    }
  }else{
    for(const sd of [-1, 1]){
      c.beginPath(); c.ellipse(sd * ex, ey, r * .15, r * .19, 0, 0, Math.PI * 2); c.fillStyle = sd > 0 && b.eye2 ? b.eye2 : b.eye; c.fill();
      c.lineWidth = lw * .8; c.strokeStyle = INK; c.stroke();
      c.beginPath(); c.ellipse(sd * ex, ey, r * .06, r * .15, 0, 0, Math.PI * 2); c.fillStyle = "#1E1612"; c.fill();
      c.beginPath(); c.arc(sd * ex + r * .05, ey - r * .07, r * .04, 0, Math.PI * 2); c.fillStyle = "#fff"; c.fill();
    }
    c.lineWidth = lw;
  }
  // 腮紅
  if(mood === "happy" || opt.blush){ c.fillStyle = "rgba(255,120,150,.45)"; for(const sd of [-1, 1]){ c.beginPath(); c.ellipse(sd * r * .62, ey + r * .3, r * .15, r * .09, 0, 0, Math.PI * 2); c.fill(); } }
  // 鼻子、嘴巴
  const ny = hy + r * .24;
  c.beginPath(); c.moveTo(-r * .08, ny - r * .04); c.lineTo(r * .08, ny - r * .04); c.lineTo(0, ny + r * .05); c.closePath(); c.fillStyle = "#F07F98"; c.fill();
  c.strokeStyle = faceInk; c.lineWidth = lw * .85;
  if(mood === "scared"){ c.beginPath(); c.ellipse(0, ny + r * .2, r * .08, r * .1, 0, 0, Math.PI * 2); c.fillStyle = "#7A3340"; c.fill(); }
  else if(mood === "happy"){ c.beginPath(); c.moveTo(-r * .16, ny + r * .1); c.quadraticCurveTo(0, ny + r * .34, r * .16, ny + r * .1); c.closePath(); c.fillStyle = "#C2475E"; c.fill(); }
  else { c.beginPath(); c.moveTo(-r * .18, ny + r * .1); c.quadraticCurveTo(-r * .09, ny + r * .2, 0, ny + r * .07); c.quadraticCurveTo(r * .09, ny + r * .2, r * .18, ny + r * .1); c.stroke(); }
  // 鬍鬚
  c.lineWidth = lw * .6; c.strokeStyle = dark ? "rgba(255,246,232,.8)" : "rgba(58,42,32,.55)";
  for(const sd of [-1, 1]) for(const k of [-1, 1]){ c.beginPath(); c.moveTo(sd * r * .45, ny + r * .08); c.lineTo(sd * r * 1.05, ny + r * .08 + k * r * .12); c.stroke(); }
  c.lineWidth = lw; c.strokeStyle = INK;
  // 害怕的汗
  if(mood === "scared"){ c.beginPath(); c.moveTo(hw * .9, hy - r * .5); c.quadraticCurveTo(hw * 1.18, hy - r * .1, hw * .98, hy); c.quadraticCurveTo(hw * .78, hy - r * .1, hw * .9, hy - r * .5); c.fillStyle = "#8FD0FF"; c.fill(); c.lineWidth = lw * .7; c.stroke(); }
  // 列車長的帽子
  if(opt.leader){
    const ty = hy - r * .78;
    c.lineWidth = lw;
    c.beginPath(); c.ellipse(0, ty + r * .2, r * .78, r * .16, 0, 0, Math.PI * 2); c.fillStyle = "#24407A"; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-r * .55, ty + r * .18); c.lineTo(-r * .62, ty - r * .28); c.quadraticCurveTo(0, ty - r * .5, r * .62, ty - r * .28); c.lineTo(r * .55, ty + r * .18); c.closePath(); c.fillStyle = "#2F57A3"; c.fill(); c.stroke();
    c.fillStyle = "#FFD447"; c.beginPath(); c.arc(0, ty - r * .08, r * .14, 0, Math.PI * 2); c.fill(); c.lineWidth = lw * .7; c.stroke();
  }
  c.restore();
}
function bodyColor(b){ return {siamese:"#EADBC4", ragdoll:"#EFE3CF", mainecoon:"#8E6A47"}[b.id] || b.base; }
function tailColor(b){ return {siamese:"#6B4A3A", ragdoll:"#8A6A55", calico:"#2B2A2E", malecalico:"#2B2A2E", cow:"#2B2A2E", tortie:"#D9822F", orange:"#E08A30", orangew:"#E08A30", tabby:"#8C7258", amshort:"#5B5F66", mainecoon:"#6E5034"}[b.id] || b.base; }
function earColor(b, sd){
  if(b.id === "siamese" || b.id === "ragdoll") return "#6B4A3A";
  if(b.id === "calico" || b.id === "malecalico") return sd < 0 ? "#F09A3E" : "#2B2A2E";
  if(b.id === "cow") return sd < 0 ? "#2B2A2E" : "#FFFFFF";
  if(b.id === "tortie") return sd < 0 ? "#D9822F" : "#3B2C25";
  return b.base;
}
// 頭上的花紋（已經裁切在頭的範圍內）
function headPattern(c, b, hw, hh, hy){
  const r = hh;
  if(["orange", "tabby", "orangew", "mainecoon", "amshort"].includes(b.id)){
    c.strokeStyle = {orange:"#D97A26", orangew:"#D97A26", tabby:"#7A6248", mainecoon:"#5E4329", amshort:"#4F545B"}[b.id]; c.lineWidth = r * .12;
    for(const k of [-1, 0, 1]){ c.beginPath(); c.moveTo(k * r * .25, hy - r); c.lineTo(k * r * .2, hy - r * .55); c.stroke(); }
    for(const sd of [-1, 1]) for(const k of [0, 1]){ c.beginPath(); c.moveTo(sd * hw, hy + r * (.05 + k * .22)); c.lineTo(sd * hw * .72, hy + r * (.1 + k * .22)); c.stroke(); }
    if(b.id === "orangew"){ c.fillStyle = "#fff"; c.beginPath(); c.ellipse(0, hy + r * .62, hw * .8, r * .62, 0, 0, Math.PI * 2); c.fill(); c.beginPath(); c.moveTo(-r * .18, hy + r * .1); c.lineTo(0, hy - r * .55); c.lineTo(r * .18, hy + r * .1); c.fill(); }
    if(b.id === "mainecoon"){ c.fillStyle = "#E8D2B0"; c.beginPath(); c.ellipse(0, hy + r * .5, hw * .5, r * .35, 0, 0, Math.PI * 2); c.fill(); }
  }else if(b.id === "calico" || b.id === "malecalico"){
    c.fillStyle = "#F09A3E"; c.beginPath(); c.ellipse(-hw * .6, hy - r * .55, hw * .55, r * .55, .4, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#2B2A2E"; c.beginPath(); c.ellipse(hw * .65, hy - r * .6, hw * .45, r * .5, -.3, 0, Math.PI * 2); c.fill();
  }else if(b.id === "tuxedo"){
    c.fillStyle = "#fff"; c.beginPath(); c.moveTo(0, hy - r * .35); c.quadraticCurveTo(r * .5, hy + r * .1, r * .55, hy + r); c.lineTo(-r * .55, hy + r); c.quadraticCurveTo(-r * .5, hy + r * .1, 0, hy - r * .35); c.fill();
  }else if(b.id === "siamese" || b.id === "ragdoll"){
    const g = c.createRadialGradient(0, hy + r * .25, r * .05, 0, hy + r * .2, r * .75);
    g.addColorStop(0, "#5A3C30"); g.addColorStop(.6, "rgba(107,74,58,.75)"); g.addColorStop(1, "rgba(107,74,58,0)");
    c.fillStyle = g; c.fillRect(-hw, hy - r, hw * 2, r * 2);
    if(b.id === "ragdoll"){ c.fillStyle = "#fff"; c.beginPath(); c.moveTo(0, hy); c.lineTo(r * .3, hy + r); c.lineTo(-r * .3, hy + r); c.closePath(); c.fill(); }
  }else if(b.id === "tortie"){
    c.fillStyle = "#D9822F";
    [[-.5, -.5, .4], [.45, .1, .3], [-.2, .55, .25], [.6, -.6, .22]].forEach(([px, py, pr]) => { c.beginPath(); c.arc(px * hw, hy + py * r, pr * r, 0, Math.PI * 2); c.fill(); });
  }else if(b.id === "cow"){
    c.fillStyle = "#2B2A2E";
    c.beginPath(); c.ellipse(-hw * .55, hy - r * .55, hw * .5, r * .45, .2, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(hw * .7, hy + r * .35, r * .22, 0, Math.PI * 2); c.fill();
  }else if(b.id === "sphynx"){
    c.strokeStyle = "rgba(170,105,90,.55)"; c.lineWidth = r * .06;
    for(const k of [0, 1, 2]){ c.beginPath(); c.moveTo(-r * .3, hy - r * (.75 - k * .14)); c.quadraticCurveTo(0, hy - r * (.85 - k * .14), r * .3, hy - r * (.75 - k * .14)); c.stroke(); }
  }else if(b.id === "persian"){
    c.fillStyle = "rgba(240,215,185,.6)"; c.beginPath(); c.ellipse(0, hy + r * .35, hw * .55, r * .4, 0, 0, Math.PI * 2); c.fill();
  }else if(b.id === "grey" || b.id === "british"){
    c.fillStyle = "rgba(255,255,255,.35)"; c.beginPath(); c.ellipse(0, hy + r * .45, hw * .5, r * .35, 0, 0, Math.PI * 2); c.fill();
  }
}

// ---------- 畫食物、罐罐、貓窩 ----------
function drawItem(c, x, y, s, kind, t){
  c.save(); c.translate(x, y + Math.sin(t / 300 + x) * s * .03);
  const lw = Math.max(1.2, s * .045); c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = "round"; c.lineCap = "round";
  const r = s * .42;
  const P = (f, st = true) => { c.fill(); if(st) c.stroke(); };
  if(kind === "fish"){
    c.beginPath(); c.ellipse(-r * .1, 0, r * .8, r * .45, 0, 0, Math.PI * 2); c.fillStyle = "#7FB7E6"; P();
    c.beginPath(); c.moveTo(r * .6, 0); c.lineTo(r * 1.05, -r * .4); c.lineTo(r * 1.05, r * .4); c.closePath(); c.fillStyle = "#5D9AD0"; P();
    c.beginPath(); c.arc(-r * .5, -r * .08, r * .1, 0, Math.PI * 2); c.fillStyle = INK; c.fill();
    c.beginPath(); c.arc(-r * .05, 0, r * .25, -1, 1); c.stroke();
  }else if(kind === "chicken" || kind === "fried"){
    const fried = kind === "fried";
    c.save(); c.rotate(-.6);
    c.beginPath(); c.roundRect(r * .2, -r * .12, r * .75, r * .24, r * .1); c.fillStyle = "#FFF7EA"; P();
    c.beginPath(); c.arc(r * .98, -r * .14, r * .14, 0, Math.PI * 2); c.arc(r * .98, r * .14, r * .14, 0, Math.PI * 2); c.fillStyle = "#FFF7EA"; P();
    c.beginPath(); c.ellipse(-r * .2, 0, r * .62, r * .48, 0, 0, Math.PI * 2); c.fillStyle = fried ? "#C9792B" : "#F6DCC4"; P();
    if(fried){ c.fillStyle = "#8F4F17"; for(let i = 0; i < 7; i++){ c.beginPath(); c.arc(-r * .2 + Math.cos(i * 2.3) * r * .38, Math.sin(i * 2.3) * r * .28, r * .06, 0, Math.PI * 2); c.fill(); } }
    else { c.strokeStyle = "rgba(200,140,110,.6)"; c.beginPath(); c.moveTo(-r * .5, -r * .1); c.lineTo(0, -r * .2); c.moveTo(-r * .45, r * .15); c.lineTo(0, r * .05); c.stroke(); }
    c.restore();
  }else if(kind === "grass"){
    c.fillStyle = "#4FAE5E"; c.strokeStyle = INK;
    for(const [dx, h, a] of [[-.35, .9, -.25], [-.12, 1.1, -.08], [.12, 1.05, .1], [.35, .85, .28]]){
      c.save(); c.translate(dx * r, r * .05); c.rotate(a);
      c.beginPath(); c.moveTo(-r * .09, 0); c.quadraticCurveTo(-r * .05, -h * r * .6, 0, -h * r); c.quadraticCurveTo(r * .05, -h * r * .6, r * .09, 0); c.closePath(); c.fill(); c.lineWidth = lw * .7; c.stroke();
      c.restore();
    }
    c.lineWidth = lw;
    c.beginPath(); c.moveTo(-r * .6, 0); c.lineTo(r * .6, 0); c.lineTo(r * .45, r * .75); c.lineTo(-r * .45, r * .75); c.closePath(); c.fillStyle = "#E58B5B"; P();
    c.beginPath(); c.roundRect(-r * .7, -r * .08, r * 1.4, r * .22, r * .06); c.fillStyle = "#D2734A"; P();
  }else if(kind === "fries"){
    c.fillStyle = "#FFD45C";

// ---------- 音效和背景音樂（WebAudio 合成） ----------
let AC = null, master = null, musicGain = null, musicTimer = null, nextNoteTime = 0, noteIdx = 0;
function audio(){
  if(!AC){
    try{
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
      musicGain = AC.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
    }catch(e){ return null; }
  }

}
// 喵：鋸齒波通過帶通濾波，音高先升再降
function meow(kind = "happy"){
  const a = audio(); if(!a) return;
  const t = a.currentTime, scared = kind === "scared";
  const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = "sawtooth";
  const base = scared ? 820 + Math.random() * 120 : 520 + Math.random() * 160;
  const dur = scared ? .32 : .5;
  o.frequency.setValueAtTime(base * .8, t);
  o.frequency.linearRampToValueAtTime(base * (scared ? 1.55 : 1.25), t + dur * .35);
  o.frequency.linearRampToValueAtTime(base * (scared ? 1.2 : .85), t + dur);
  if(scared){ const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 28; lg.gain.value = 40; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur); }
  f.type = "bandpass"; f.Q.value = 3;
  f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(scared ? 2400 : 1800, t + dur * .4); f.frequency.linearRampToValueAtTime(1000, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(scared ? .22 : .2, t + .04); g.gain.linearRampToValueAtTime(.12, t + dur * .7); g.gain.linearRampToValueAtTime(0, t + dur);

function blip(freqs, type = "triangle", len = .09, vol = .14){
  const a = audio(); if(!a) return;
  freqs.forEach((fr, i) => {
    const t = a.currentTime + i * len, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + len * 1.6);

}
const SFX = {
  good: () => blip([660, 880, 1175]),
  bad: () => blip([330, 247], "square", .12, .08),
  can: () => blip([784, 988, 1175, 1568], "triangle", .08, .13),
  crash: () => { blip([220, 165, 110], "square", .1, .1); setTimeout(() => meow("scared"), 60); },

// 背景音樂：輕快的五聲音階小旋律，一直循環
const MIDI = n => 440 * Math.pow(2, (n - 69) / 12);
const MEL = [76,79,81,79, 76,74,72,74, 76,76,79,76, 74,0,72,0, 69,72,74,76, 79,76,74,72, 74,76,74,72, 69,0,0,0,
             72,74,76,79, 81,79,76,79, 84,81,79,76, 79,0,76,0, 74,76,72,74, 76,74,72,69, 72,74,72,0, 72,0,0,0];
const BASS = [48,43,45,40, 41,48,43,43, 48,45,41,43, 41,43,48,48];
const BPM = 112, EIGHTH = 60 / BPM / 2;
function scheduleMusic(){
  if(!AC) return;
  while(nextNoteTime < AC.currentTime + .15){
    const i = noteIdx % MEL.length, n = MEL[i], t = nextNoteTime;
    if(n){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.value = MIDI(n);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + EIGHTH * 1.8);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + EIGHTH * 1.9);
    }
    if(i % 4 === 0){
      const bn = BASS[(i / 4) % BASS.length], o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = MIDI(bn);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.13, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + EIGHTH * 3.6);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + EIGHTH * 3.8);
    }
    if(i % 2 === 1){ // 輕輕的沙鈴
      const len = .04, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate), d = buf.getChannelData(0);
      for(let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
      const s = AC.createBufferSource(), hp = AC.createBiquadFilter(), g = AC.createGain();
      hp.type = "highpass"; hp.frequency.value = 6000; g.gain.value = .05;
      s.buffer = buf; s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t);
    }
    nextNoteTime += EIGHTH; noteIdx++;
  }
}
function setMusic(on, soft){
  if(!audio()) return;
  const target = on && save.music ? (soft ? .25 : .7) : 0;
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setTargetAtTime(target, AC.currentTime, .3);
  if(target && !musicTimer){ nextNoteTime = AC.currentTime + .1; musicTimer = setInterval(scheduleMusic, 50); }
  if(!target && musicTimer){ setTimeout(() => { if(musicGain.gain.value < .01 && musicTimer){ clearInterval(musicTimer); musicTimer = null; } }, 1200); }
}

// ---------- 遊戲狀態 ----------
const DIRS = {up:[0, -1], down:[0, 1], left:[-1, 0], right:[1, 0]};
const OPP = {up:"down", down:"up", left:"right", right:"left"};
let G = null;        // 這一局的資料
let state = "menu";  // menu / ready / play / crash / over / paused
let pausedFrom = null;
function newGame(){
  const leader = save.leader;
  const cx = Math.floor(COLS / 2) - 1, cy = Math.floor(ROWS / 2);
  G = {
    train: [{x:cx, y:cy, px:cx, py:cy, breed:leader, fat:0, happy:0, scared:0}],
    dir:"right", queue:[], score:0, lives:1, eatenGood:0, eatenBad:0,
    stray:null, foods:[], can:null,
    tickMs:speedOf(1), acc:0, t:0, started:false, moveDir:"right", bestLenRun:1, recorded:false,
    sinceRare:0, sinceLegend:0, forceTier:-1,
    canTimer:18000, readyUntil:0, topTier:0, crash:null, collected:{},
    lastScaredMeow:0,
  };
  spawnStray(); spawnFood(); spawnFood();
  updateRareHint();
  state = "ready"; G.readyUntil = 0;
  hideOverlay(); updateHud();
}
const occupied = (x, y) => G.train.some(c => c.x === x && c.y === y) || (G.stray && G.stray.x === x && G.stray.y === y) ||
  G.foods.some(f => f.x === x && f.y === y) || (G.can && G.can.x === x && G.can.y === y);
function freeCell(){
  const h = G.train[0], [dx, dy] = DIRS[G.dir];
  for(let k = 0; k < 300; k++){
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
    if(occupied(x, y)) continue;
    // 不要直接生在列車長正前方 2 格內
    let ahead = false; for(let s = 1; s <= 2; s++) if(h.x + dx * s === x && h.y + dy * s === y) ahead = true;
    if(ahead) continue;
    return {x, y};
  }
  return null;
}
// 隊伍越長，開放的稀有度越多；先抽稀有度，再抽品種（這一局還沒收編過的比較容易出現）
function unlockedTier(){ const n = G.train.length; return TIERS.reduce((m, t, i) => n >= t.need ? i : m, 0); }
function spawnStray(){
  const p = freeCell(); if(!p) return;
  const top = unlockedTier(), n = G.train.length;
  const tw = TIERS.slice(0, top + 1).map((t, i) => i === 3 ? t.weight + (n - t.need) * 1.5 : t.weight);
  let roll = Math.random() * tw.reduce((a, b) => a + b, 0), tier = 0;
  while(roll >= tw[tier]){ roll -= tw[tier]; tier++; }
  if(G.forceTier >= 0){ tier = G.forceTier; G.forceTier = -1; }
  else if(top >= 3 && G.sinceLegend >= 5) tier = 3;
  else if(top >= 2 && G.sinceRare >= 5 && tier < 2) tier = 2;
  G.sinceRare = tier >= 2 ? 0 : G.sinceRare + (top >= 2 ? 1 : 0);
  G.sinceLegend = tier >= 3 ? 0 : G.sinceLegend + (top >= 3 ? 1 : 0);
  const pool = BREEDS.filter(b => b.tier === tier).flatMap(b => G.collected[b.id] ? [b.id] : [b.id, b.id, b.id]);
  const breed = pool[Math.floor(Math.random() * pool.length)];
  G.stray = {...p, breed, tier, born: G.t, until: TIERS[tier].leave ? G.t + TIERS[tier].leave : 0};
  if(tier >= 2) toast(`附近出現了${TIERS[tier].name}的${BY[breed].name}！`, `${TIERS[tier].leave / 1000} 秒內沒收編，牠就會跑走。`, "gold");
}
function spawnFood(){
  const p = freeCell(); if(!p) return;
  const good = Math.random() < .62;
  const list = good ? GOOD_FOODS : BAD_FOODS;
  G.foods.push({...p, kind: list[Math.floor(Math.random() * list.length)]});
}

// ---------- 操作 ----------
function turn(d){
  audio();
  if(state === "menu" || state === "over") return;
  if(state === "paused") return;
  if(state === "ready" && !G.started){
    if(G.train.length > 1 && d === OPP[G.dir]) return;
    // 往那個方向會馬上撞到（牆或同伴）就照原本排好的方向走
    if(G.train.length > 1){ const h = G.train[0], [dx, dy] = DIRS[d], nx = h.x + dx, ny = h.y + dy;
      if(nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || G.train.slice(0, -1).some(c => c.x === nx && c.y === ny)) d = G.dir; }
    G.dir = d; G.moveDir = d; G.started = true; state = "play"; G.acc = 0; setMusic(true); return;
  }
  // 這一格才剛開始走：直接改方向，反應比較快
  if(state === "play" && !G.queue.length && G.acc / G.tickMs < .35 && d !== G.dir && d !== OPP[G.moveDir]){ G.dir = d; return; }
  const last = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
  if(d === last || d === OPP[last]) return;
  if(G.queue.length < 2) G.queue.push(d);
}

let touch0 = null;
const stage = document.getElementById("stage");

// ---------- 每一步 ----------
// 下一格會不會撞到（撞牆、撞到同伴；尾巴這一步會讓開，所以不算）
function blockedAhead(){
  const [dx, dy] = DIRS[G.dir], h = G.train[0], nx = h.x + dx, ny = h.y + dy;
  if(nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return true;
  const willGrow = G.stray && G.stray.x === nx && G.stray.y === ny;
  return (willGrow ? G.train : G.train.slice(0, -1)).some(c => c.x === nx && c.y === ny);
}
// 速度：隊伍越長越快，但慢慢變快，最快每格 0.15 秒
const speedOf = n => Math.max(150, 250 - (n - 1) * 4);
function step(){
  const [dx, dy] = DIRS[G.dir], h = G.train[0];
  const nx = h.x + dx, ny = h.y + dy;
  G.train.forEach(c => { c.px = c.x; c.py = c.y; });
  // 撞牆或撞到同伴（尾巴這一步會讓開，所以不算）
  const hitWall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
  const willGrow = G.stray && G.stray.x === nx && G.stray.y === ny;
  const body = willGrow ? G.train : G.train.slice(0, -1);
  const hitSelf = !hitWall && body.some(c => c.x === nx && c.y === ny);
  if(hitWall || hitSelf){ crash(hitWall ? "wall" : "self", nx, ny); return; }
  // 往前走：每隻貓走到前一隻的位置
  const tail = G.train[G.train.length - 1], tx = tail.x, ty = tail.y;
  for(let i = G.train.length - 1; i > 0; i--){ G.train[i].x = G.train[i - 1].x; G.train[i].y = G.train[i - 1].y; }
  h.x = nx; h.y = ny;
  G.moveDir = G.dir;
  // 下一格要走的方向（玩家先按好的轉彎）
  while(G.queue.length){ const d = G.queue.shift(); if(d !== OPP[G.moveDir]){ G.dir = d; break; } }
  // 收編流浪貓
  if(willGrow){
    const b = BY[G.stray.breed];
    G.train.push({x:tx, y:ty, px:tx, py:ty, breed:b.id, fat:0, happy:1500, scared:0});
    updateRareHint();
    const first = !save.seen[b.id];
    save.seen[b.id] = (save.seen[b.id] || 0) + 1; G.collected[b.id] = (G.collected[b.id] || 0) + 1; persist();
    const T = TIERS[b.tier];
    G.score += T.score;
    toast(`收編了一隻${b.tier ? T.name + "的" : ""}${b.name}！${first ? "（圖鑑新登場）" : ""}`, b.fact, first || b.tier >= 2 ? "gold" : "");
    const now = unlockedTier();
    if(now > G.topTier){ G.topTier = now; G.forceTier = now; toast(`隊伍有 ${G.train.length} 隻了！`, `開始會遇到「${TIERS[now].name}」的貓咪。`, "gold"); }
    meow("happy");
    G.stray = null; spawnStray();
    G.tickMs = speedOf(G.train.length);
    G.bestLenRun = Math.max(G.bestLenRun, G.train.length);
    updateRecordBox();
  }
  // 吃東西
  const fi = G.foods.findIndex(f => f.x === nx && f.y === ny);
  if(fi >= 0){
    const f = G.foods[fi], F = FOODS[f.kind]; G.foods.splice(fi, 1);
    if(F.good){
      G.eatenGood++; G.score += 5; SFX.good();
      G.train.forEach(c => c.happy = 1800);
      const fatOne = G.train.find(c => c.fat > 0);
      if(fatOne){ fatOne.fat--; fatOne.puff = 0; toast(F.msg, `${BY[fatOne.breed].name}吃得健康，瘦回來一點了。`); }
      else toast(F.msg);
    }else{
      G.eatenBad++; G.score += 1; SFX.bad();
      const cand = G.train.filter(c => c.fat < 2);
      const n = Math.min(cand.length, 1 + Math.floor(Math.random() * 2));
      const names = [];
      for(let k = 0; k < n; k++){ const c = cand.splice(Math.floor(Math.random() * cand.length), 1)[0]; c.fat++; c.puff = 600; names.push(BY[c.breed].name); }
      toast(F.msg, names.length ? `${[...new Set(names)].join("、")}變胖了！吃健康的食物可以瘦回來。` : "大家都已經胖嘟嘟了，快吃點健康的吧！", "bad");
    }
    spawnFood();
  }
  // 金色貓罐罐
  if(G.can && G.can.x === nx && G.can.y === ny){
    G.can = null; G.lives = Math.min(5, G.lives + 1); G.score += 15; SFX.can(); G.canTimer = 20000 + Math.random() * 10000;
    toast("吃到金色貓罐罐！復活次數 +1", `現在可以復活 ${G.lives} 次。`, "gold");
  }
  // 前面 2 格有同伴：那隻貓會害怕
  let scaredNow = false;

function crash(kind, nx, ny){
  SFX.crash();
  const h = G.train[0];
  const style = G.train.length >= 3 && Math.random() < .5 ? "pile" : "scatter";
  G.crash = {kind, style, t0:G.t, cx:h.x, cy:h.y,
    parts: G.train.map((c, i) => {
      const ang = Math.random() * Math.PI * 2, sp = 2.5 + Math.random() * 3;
      return {vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp - 2, spin:(Math.random() - .5) * 6, i};
    })};
  // 貓山的位置：從撞到的地方往上疊
  const n = G.train.length; let idx = 0; const pile = [];
  for(let row = 0; idx < n; row++){
    const cnt = Math.max(1, Math.ceil(Math.sqrt(n)) - row);
    for(let k = 0; k < cnt && idx < n; k++, idx++) pile.push({dx:(k - (cnt - 1) / 2) * .78, dy:-row * .62});
  }
  G.crash.pile = pile.reverse();
  state = "crash"; setMusic(false);
  toast(kind === "wall" ? "撞到牆了！" : "撞到同伴了！",
    style === "pile" ? "大家嚇得疊成一座貓山……" : "大家嚇得全部散開了……", "bad");
}
function afterCrash(){
  if(G.lives > 0){
    G.lives--;
    rebuildTrain();
    // 復活後停在原地，等玩家按方向鍵再出發
    state = "ready"; G.started = false; G.revived = true; G.readyUntil = 0; G.crash = null; G.queue = []; G.acc = 0;
    toast("大家重新排好隊了", `剩下 ${G.lives} 次復活。按方向鍵繼續出發！`);
    updateHud();
  }else{
    state = "over"; gameOver();
  }
}
// 復活：把隊伍從左下角開始蛇行排好，列車長在最後一格，面向空的地方
function rebuildTrain(){
  const n = G.train.length, path = [];
  for(let r = 0; path.length < n + 1; r++){
    const y = ROWS - 1 - r; if(y < 0) break;
    const xs = [...Array(COLS).keys()]; if(r % 2) xs.reverse();
    xs.forEach(x => path.push({x, y}));
  }
  const cats = G.train.slice();
  for(let i = 0; i < n; i++){ const p = path[n - 1 - i]; const c = cats[i]; c.x = c.px = p.x; c.y = c.py = p.y; c.scared = 0; }
  const h = path[n - 1], nx = path[n];
  G.dir = G.moveDir = nx.x > h.x ? "right" : nx.x < h.x ? "left" : "up";
  // 清掉被壓到的東西
  const onTrain = (o) => o && G.train.some(c => c.x === o.x && c.y === o.y);
  if(onTrain(G.stray)){ G.stray = null; spawnStray(); }
  G.foods = G.foods.filter(f => !onTrain(f)); while(G.foods.length < 2) spawnFood();
  if(onTrain(G.can)) G.can = null;
}

// ---------- 主迴圈 ----------
let lastTs = 0;
function loop(ts){
  const dt = Math.min(100, ts - (lastTs || ts)); lastTs = ts;
  if(G && state !== "paused" && state !== "menu"){
    G.t += dt;
    G.train.forEach(c => { c.happy = Math.max(0, c.happy - dt); c.scared = Math.max(0, c.scared - dt); if(c.puff) c.puff = Math.max(0, c.puff - dt); });
    if(state === "play"){
      G.acc += dt;
      while(G.acc >= G.tickMs && state === "play"){ G.acc -= G.tickMs; step(); }
      // 稀有的貓過一陣子會跑走
      if(G.stray && G.stray.until && G.t > G.stray.until){ toast(`${BY[G.stray.breed].name}跑走了……`, "隊伍夠長，還會再遇到稀有的貓。", "bad"); G.stray = null; spawnStray(); }
      // 罐罐定時出現
      if(!G.can){ G.canTimer -= dt; if(G.canTimer <= 0){ const p = freeCell(); if(p){ G.can = {...p, until:G.t + 9000}; toast("金色貓罐罐出現了！", "吃到可以多一次復活，9 秒後會消失。", "gold"); } G.canTimer = 22000 + Math.random() * 10000; } }
      else if(G.t > G.can.until){ G.can = null; }
    }else if(state === "ready" && G.started && G.readyUntil && G.t >= G.readyUntil){
      state = "play"; G.acc = 0; G.readyUntil = 0; setMusic(true);
    }else if(state === "crash"){
      if(G.t - G.crash.t0 > 1900) afterCrash();
    }
  }
  draw(ts);
  requestAnimationFrame(loop);
}

// ---------- 畫面 ----------
function drawBoard(){
  const s = CELL;
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
    ctx.fillStyle = (x + y) % 2 ? "#F7E6C8" : "#F2DDBA"; ctx.fillRect(x * s, y * s, s + .5, s + .5);
  }
  // 地上的小腳印
  ctx.fillStyle = "rgba(160,120,80,.12)";
  [[2, 3], [10, 5], [6, 11], [11, 13], [3, 13]].forEach(([x, y]) => { const cx = (x + .5) * s, cy = (y + .5) * s;
    ctx.beginPath(); ctx.ellipse(cx, cy + s * .08, s * .16, s * .13, 0, 0, Math.PI * 2); ctx.fill();
    for(const [dx, dy] of [[-.17, -.12], [-.06, -.2], [.06, -.2], [.17, -.12]]){ ctx.beginPath(); ctx.arc(cx + dx * s, cy + dy * s, s * .05, 0, Math.PI * 2); ctx.fill(); } });
}
function draw(ts){
  const s = CELL;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBoard();
  if(!G){ return; }
  const t = G.t;
  // 物品
  G.foods.forEach(f => drawItem(ctx, (f.x + .5) * s, (f.y + .5) * s, s, f.kind, t));
  if(G.can){ const left = G.can.until - t; if(left > 2500 || Math.floor(t / 150) % 2) drawItem(ctx, (G.can.x + .5) * s, (G.can.y + .5) * s, s, "can", t); }
  if(G.stray){
    const st = G.stray, bob = Math.sin(t / 250) * s * .04, T = TIERS[st.tier || 0];
    const leaving = st.until && st.until - t < 3000;
    if(!leaving || Math.floor(t / 160) % 2) drawCat(ctx, (st.x + .5) * s, (st.y + .5) * s + bob, s * .9, st.breed, {blush:true, glow:T.glow});
    // 小對話框「喵？」
    const bx = (st.x + .5) * s + s * .38, by = (st.y + .5) * s - s * .5;
    ctx.save(); ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * .04);
    ctx.beginPath(); ctx.roundRect(bx - s * .26, by - s * .17, s * .52, s * .3, s * .1); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = `900 ${s * .2}px system-ui,"Noto Sans TC",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = TIER_BG[st.tier || 0] === TIER_BG[0] ? INK : TIER_BG[st.tier]; ctx.fillText(st.tier ? T.name : "喵？", bx, by - s * .02); ctx.restore();
  }
  // 隊伍
  const moving = state === "play" || (state === "paused" && pausedFrom === "play");
  const k = moving ? Math.min(1, G.acc / G.tickMs) : 0;
  const bump = k && blockedAhead();   // 前面是牆或同伴：只往前探一點點，走到那一刻就撞上
  if(state === "crash") drawCrash(t);
  else{
    for(let i = G.train.length - 1; i >= 0; i--){
      const c = G.train[i];
      let tx2, ty2, kk = k;
      if(i === 0){ const [dx, dy] = DIRS[G.dir]; tx2 = c.x + dx; ty2 = c.y + dy; if(bump) kk = k * .45; }
      else { tx2 = G.train[i - 1].x; ty2 = G.train[i - 1].y; }
      const x = (c.x + (tx2 - c.x) * kk + .5) * s, y = (c.y + (ty2 - c.y) * kk + .5) * s;
      const mood = c.scared ? "scared" : c.happy ? "happy" : "normal";
      const hop = state === "play" ? Math.abs(Math.sin((t / 140) + i * .9)) * s * .05 : 0;
      drawCat(ctx, x, y - hop, s * 1.02, c.breed, {mood, fat:c.fat, leader:i === 0, shake:!!c.scared, puff:c.puff});
      if(c.happy > 1200 && i % 2 === 0) heart(ctx, x + s * .3, y - s * .5 - (1800 - c.happy) / 1800 * s * .4, s * .16);
    }
  }
  if(state === "ready"){
    if(!G.started) banner(G.revived ? "按方向鍵或滑一下，繼續出發！" : "按方向鍵或滑一下，出發！", G.revived ? `還可以復活 ${G.lives} 次` : "收編流浪貓，避開牆壁和同伴");
    else if(G.readyUntil) banner(`準備出發 ${Math.ceil((G.readyUntil - t) / 1000)}`, "");
  }
}
function drawCrash(t){
  const s = CELL, C = G.crash, p = Math.min(1, (t - C.t0) / 1200);
  G.train.forEach((c, i) => {
    const part = C.parts[i];
    let x, y, rot = 0;
    if(C.style === "scatter"){
      const tt = (t - C.t0) / 1000;
      x = (c.x + .5 + part.vx * tt * Math.max(0, 1 - tt * .35)) * s;
      y = (c.y + .5 + (part.vy * tt + 3.2 * tt * tt) * Math.max(0, 1 - tt * .35)) * s;
      rot = part.spin * tt;
    }else{
      const target = C.pile[i], e = 1 - Math.pow(1 - p, 3);
      const tx = C.cx + .5 + target.dx, ty = Math.max(1.2, C.cy + .5) + target.dy;
      x = ((c.x + .5) + (tx - c.x - .5) * e) * s;
      y = ((c.y + .5) + (ty - c.y - .5) * e - Math.sin(e * Math.PI) * 1.2) * s;
    }
    drawCat(ctx, x, y, s * 1.02, c.breed, {mood: i === 0 ? "dizzy" : "scared", fat:c.fat, leader:i === 0, rot, shake:true});
  });
}
function banner(title, sub){

  ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, y - bh / 2, bw, bh, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.font = `900 18px system-ui,"Noto Sans TC",sans-serif`; ctx.fillText(title, W / 2, y - (sub ? 11 : 0));
  if(sub){ ctx.fillStyle = "#8A7462"; ctx.font = `700 13px system-ui,"Noto Sans TC",sans-serif`; ctx.fillText(sub, W / 2, y + 14); }

}

    const open = b.tier === 0 || save.seen[b.id];
    const btn = document.createElement("button"); btn.type = "button"; btn.dataset.breed = b.id; btn.disabled = !open;
    btn.title = open ? b.name : "收編過才能當列車長";
    btn.appendChild(miniCanvas(64, (c, px) => { if(open) drawCat(c, px / 2, px * .56, px * .9, b.id, {leader:true}); else { c.globalAlpha = .2; drawCat(c, px / 2, px * .56, px * .9, "black", {mood:"sleep"}); } }));
    btn.appendChild(document.createTextNode(open ? b.name : "？？？"));
    btn.onclick = () => { save.leader = b.id; persist(); markPick(); meow("happy"); };
    pick.appendChild(btn);
  });
  markPick();
}
function markPick(){
  document.querySelectorAll("#pick button").forEach(b => b.classList.toggle("on", b.dataset.breed === save.leader));
  const b = BY[save.leader]; const el = document.getElementById("pickName"); if(el) el.textContent = `${b.name}列車長`;
}
function showBook(back){
  overlayBack = back;
  const n = Object.keys(save.seen).length;
  showOverlay(`<h2>流浪貓圖鑑 ${n} / ${BREEDS.length}</h2>
    <p class="muted">收編過的貓咪會記在這裡。</p>
    <div class="book" id="book"></div>
    <div class="btns"><button class="btn acc" data-act="back">回去</button></div>`);
  const book = document.getElementById("book");
  BREEDS.forEach((b, k) => {
    if(k === 0 || BREEDS[k - 1].tier !== b.tier){
      const h = document.createElement("div"); h.className = "tierh";
      h.innerHTML = `<i style="background:${TIER_BG[b.tier]}">${TIERS[b.tier].name}</i> ${b.tier ? `隊伍 ${TIERS[b.tier].need} 隻以上才會遇到` : "一開始就會遇到"}`;
      book.appendChild(h);
    }
    const got = save.seen[b.id];
    const it = document.createElement("div"); it.className = "it" + (got ? "" : " no");
    it.appendChild(miniCanvas(56, (c, px) => { if(got) drawCat(c, px / 2, px * .55, px * .9, b.id, {mood:"happy", glow:TIERS[b.tier].glow}); else { c.globalAlpha = .25; drawCat(c, px / 2, px * .55, px * .9, "black", {mood:"sleep"}); } }));
    const tx = document.createElement("div");
    tx.innerHTML = got ? `<b>${b.name}</b> <span class="muted" style="font-size:12px">收編 ${got} 次</span><p>${esc(b.fact)}</p>` : `<b>？？？</b><p>還沒收編過。</p>`;
    it.appendChild(tx); book.appendChild(it);
  });
}
function showHelp(back){
  overlayBack = back;
  showOverlay(`<h2>怎麼玩</h2>
    <ol class="help">
      <li>列車長會<b>一直往前走</b>，用方向鍵、WASD、滑動或下面的按鈕轉彎。</li>
      <li>走到<b>流浪貓</b>身上就收編牠，隊伍會變長、速度也會變快。</li>
      <li>隊伍越長，越會遇到稀有的貓：5 隻以上有「少見」、10 隻以上有「稀有」、16 隻以上有「傳說」。稀有和傳說的貓過一陣子就會跑走，要快！</li>
      <li>撞到<b>牆壁</b>或<b>自己的隊伍</b>就會出事。快撞到的貓咪會嚇到發抖、喵喵叫。</li>
      <li>還有<b>復活次數</b>的話，大家會重新排好隊繼續走。</li>
      <li>手累了隨時按<b>暫停</b>（空白鍵），休息一下再繼續。</li>
    </ol>
    <div class="legend" id="legend"></div>
    <h3 class="sh">怎麼算分數</h3>
    <table class="score"><tbody>
      <tr><td>收編普通的貓</td><td>+${TIERS[0].score}</td><td>收編少見的貓</td><td>+${TIERS[1].score}</td></tr>
      <tr><td>收編稀有的貓</td><td>+${TIERS[2].score}</td><td>收編傳說的貓</td><td>+${TIERS[3].score}</td></tr>
      <tr><td>健康食物</td><td>+5</td><td>不健康的食物</td><td>+1</td></tr>
      <tr><td>金色貓罐罐</td><td>+15</td><td>撞到用掉復活</td><td>不扣分</td></tr>
    </tbody></table>
    <p class="muted small">不健康的食物分數少，還會讓貓變胖；吃健康的食物可以瘦回來。</p>
    <div class="btns"><button class="btn acc" data-act="back">知道了</button></div>`);
  const lg = document.getElementById("legend");
  [["fish", "魚、水煮雞肉、貓草：健康，大家開心，胖貓會瘦回來"], ["fries", "薯條、蛋糕、炸雞：不健康，會有貓變胖"], ["can", "金色貓罐罐：復活次數 +1（會消失）"]].forEach(([k, txt]) => {
    const d = document.createElement("div");
    d.appendChild(miniCanvas(34, (c, px) => drawItem(c, px / 2, px / 2, px * .95, k, 0)));
    d.appendChild(document.createTextNode(txt)); lg.appendChild(d);
  });
}
panel.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "lbName"){ e.preventDefault(); panel.querySelector('[data-act="lbsave"]').click(); } e.stopPropagation(); });
panel.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if(!a) return;
  audio();
  const act = a.dataset.act;
  if(act === "start" || act === "again"){ newGame(); }
  else if(act === "menu"){ showMenu(); }
  else if(act === "resume"){ resume(); }
  else if(act === "book"){ showBook(state === "over" ? "over" : "menu"); }
  else if(act === "help"){ showHelp("menu"); }
  else if(act === "rank"){ showRank(state === "over" ? "over" : "menu"); }
  else if(act === "rankscore" || act === "ranklen"){ showRank(overlayBack, act === "ranklen" ? "len" : "score"); }
  else if(act === "lbsave"){
    const v = (document.getElementById("lbName").value || "").trim();
    if(!v || v.length > 12){ document.getElementById("lbName").focus(); return; }
    save.name = v; persist(); if(G) G.uploaded = true; submitScore();
  }
  else if(act === "lbrename"){ e.preventDefault(); save.name = ""; persist(); lbStatus = ""; renderLbBox(); }
  else if(act === "back"){
    if(overlayBack === "over") gameOver();
    else if(overlayBack === "paused"){ showOverlay(`<h2>暫停中</h2><p class="muted">貓咪們在原地等你。</p><div class="btns"><button class="btn acc" data-act="resume">繼續</button><button class="btn" data-act="menu">換列車長／重來</button></div>`); }
    else showMenu();
  }
});
document.getElementById("bPause").onclick = () => { audio(); if(state === "menu" || state === "over") return; togglePause(); };
document.getElementById("bMusic").onclick = () => { save.music = !save.music; persist(); musicLabel(); if(state === "play") setMusic(true); else setMusic(false); };
document.getElementById("bBook").onclick = () => {
  if(state === "play" || state === "ready") togglePause();
  showBook(state === "paused" ? "paused" : state === "over" ? "over" : "menu");
};
document.getElementById("bRank").onclick = () => {
  if(state === "play" || state === "ready") togglePause();
  showRank(state === "paused" ? "paused" : state === "over" ? "over" : "menu");
};
document.getElementById("bHelp").onclick = () => {
  if(state === "play" || state === "ready") togglePause();
  showHelp(state === "paused" ? "paused" : state === "over" ? "over" : "menu");
};

// ---------- 開始 ----------
const logo = document.getElementById("logo").getContext("2d");
logo.clearRect(0, 0, 88, 88); drawCat(logo, 44, 50, 80, "orange", {leader:true, mood:"happy"});
musicLabel(); updateRecordBox();
resize(); addEventListener("resize", () => { resize(); });
showMenu();
requestAnimationFrame(loop);
</script>
</body>

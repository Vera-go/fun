<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安安英文教室</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f0eee8; --text:#1f2328; --muted:#646a73;
  --border:#dedbd2; --accent:#2f6fde; --accent-soft:#e6eefc;
  --again:#d6453d; --hard:#e08a1e; --good:#2f9e5a; --easy:#2f6fde;
  --note-bg:#fff8e6; --note-border:#f0d48a; --ok-bg:#e7f6ec; --bad-bg:#fdeceb;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --surface:#202328; --surface2:#2a2e34; --text:#e8e6e1; --muted:#9aa0a8;
    --border:#363a41; --accent:#6d9cff; --accent-soft:#25324d;
    --again:#f0706a; --hard:#f2a647; --good:#5cc985; --easy:#6d9cff;
    --note-bg:#2e2a1d; --note-border:#6b5a28; --ok-bg:#1d3326; --bad-bg:#3b2220;
    --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --surface:#202328; --surface2:#2a2e34; --text:#e8e6e1; --muted:#9aa0a8;
  --border:#363a41; --accent:#6d9cff; --accent-soft:#25324d;
  --again:#f0706a; --hard:#f2a647; --good:#5cc985; --easy:#6d9cff;
  --note-bg:#2e2a1d; --note-border:#6b5a28; --ok-bg:#1d3326; --bad-bg:#3b2220;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;cursor:pointer}
@media (prefers-color-scheme: dark){.brand svg{filter:drop-shadow(0 0 .7px rgba(255,255,255,.95)) drop-shadow(0 0 .7px rgba(255,255,255,.7))}}
.learner{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
select,input[type=text]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.btn:disabled:hover{border-color:var(--border)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
h1{font-size:22px;margin:24px 0 4px}
h2{font-size:18px;margin:24px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.level h3{margin:0 0 8px;font-size:16px}
.range{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:14px}
.range.ready{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:600}
.range:disabled{cursor:not-allowed;color:var(--muted);opacity:.75}
.range small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin:18px 0 14px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;padding:10px 14px;font-size:15px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.crumb{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumb b{color:var(--text);font-size:17px}
.portal-foot{text-align:center;color:var(--muted);font-size:13px;padding:8px 16px 40px}
.portal-foot a{color:var(--muted)}
/* progress */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.track{flex:1;min-width:120px;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .3s}
.chips{display:flex;gap:6px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--border)}
/* flashcard */
.fc{min-height:300px;cursor:pointer;display:flex;flex-direction:column}
.fc-front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 0}
.word{font-size:44px;font-weight:700;letter-spacing:.5px;line-height:1.2;word-break:break-word}
.hint{font-size:13px;color:var(--muted)}
.fc-back{cursor:default}
.wordline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wordline .word{font-size:30px}
.pos{color:var(--muted);font-size:15px}
.zh{font-size:20px;margin:2px 0 14px}
.ex{border-top:1px dashed var(--border);padding-top:12px}
.ex-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;gap:8px}
.en{font-size:20px;font-weight:500;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.en mark{background:none;color:var(--accent);font-weight:700}
.ex-zh{color:var(--muted);margin:2px 0 10px}
.note{background:var(--note-bg);border:1px solid var(--note-border);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.note .lbl{font-weight:700;font-size:13px;display:block;margin-bottom:2px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate{border:2px solid;border-radius:12px;padding:10px 4px;background:var(--surface);font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.rate small{font-weight:400;font-size:12px;color:var(--muted)}
.rate kbd{font-size:11px;color:var(--muted);font-family:inherit;border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-top:3px}
.rate.again{border-color:var(--again);color:var(--again)}
.rate.hard{border-color:var(--hard);color:var(--hard)}
.rate.good{border-color:var(--good);color:var(--good)}
.rate.easy{border-color:var(--easy);color:var(--easy)}
.rate:hover{filter:brightness(1.1);transform:translateY(-1px)}
.keys{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.done{text-align:center;padding:28px 10px}
.done .big{font-size:40px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stat{border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:72px}
.stat b{display:block;font-size:22px}
/* grammar */
.lesson{margin-bottom:12px;padding:0;overflow:hidden}
.lesson summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary::after{content:"＋";color:var(--muted)}
.lesson[open] summary::after{content:"－"}
.lesson-body{padding:0 18px 18px}
.points{margin:6px 0 14px;padding-left:20px}
.points li{margin:4px 0}
.ptable{border-collapse:collapse;margin:6px 0 14px;font-size:15px;width:100%}
.ptable th,.ptable td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.ptable th{background:var(--surface2)}
.gex{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;background:var(--surface)}
.tbl-wrap{overflow-x:auto}
/* quiz */
.q{font-size:20px;font-weight:500;margin:4px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:17px;display:flex;gap:10px}
.opt .k{color:var(--muted);font-size:13px;min-width:18px;padding-top:3px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--again)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px;font-size:15px}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb-head{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted);margin-top:10px}
.settings label{display:flex;gap:6px;align-items:center}
#voiceInfo{white-space:pre-line}
.vpick{display:flex;gap:6px;align-items:center;max-width:100%}
.vpick label{min-width:0}
.vpick select{max-width:min(260px,52vw)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:20px;max-width:340px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.custom-list .range{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* 翻卡 */
.flip{perspective:1400px;display:grid}
.flip-inner{position:relative;display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.25,1)}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
/* 卡片高度跟著目前那一面：沒翻面時背面不佔高度，翻面後正面不佔高度 */
.flip:not(.is-flipped) .face.back{position:absolute;top:0;left:0;width:100%}
.flip.is-flipped .face.front{position:absolute;top:0;left:0;width:100%;height:100%}
.face.front{min-height:260px}
.flipbar{display:flex;justify-content:center;margin-top:14px}
.flipbar.gone{display:none}
.flipbar .btn{padding:12px 28px;font-size:17px}
.face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;
  background-image:radial-gradient(var(--surface2) 1.5px,transparent 1.5px);background-size:18px 18px;background-color:var(--surface)}
.face.front .word{font-size:52px}
.flip-tag{position:absolute;top:12px;left:14px;right:52px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face.back{position:relative}
.fav-btn{position:absolute;top:6px;right:8px;z-index:2;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.fav-btn.on{color:#f5b301}
.cardnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cardnav select{flex:1 1 160px;min-width:0;max-width:320px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:14px}
.phr{border:0;background:none;padding:0;margin:0;font:inherit;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;text-align:inherit}
.phr:hover{text-decoration-style:solid}
#phraseDlg{max-width:min(460px,calc(100vw - 32px))}
.phr-item+.phr-item{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.phr-head{display:flex;align-items:center;gap:8px;font-size:18px;flex-wrap:wrap}
.phr-ex{margin-top:8px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.phr-ex .en{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;line-height:1.5}
.phr-ex .en span{flex:1;min-width:0}
.phr-ex .ex-zh{font-size:14px}
.peekbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.face.front{position:relative}
.back-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.illus{width:230px;max-width:100%;flex:none;position:relative}
.illus svg,.illus img{width:100%;height:auto;display:block;border-radius:14px}
.emoji-art{font-size:84px;text-align:center;background:var(--surface2);border-radius:14px;line-height:1.4}
.flip.is-flipped .illus{animation:popIn .6s .3s both cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.spark-fx{position:absolute;font-size:18px;opacity:0;pointer-events:none}
.flip.is-flipped .spark-fx{animation:sparkfx 1s .65s both}
.flip.is-flipped .spark-fx:nth-of-type(2){animation-delay:.8s}
.flip.is-flipped .spark-fx:nth-of-type(3){animation-delay:.95s}
@keyframes sparkfx{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(.8) translateY(-14px)}}
.memo{background:linear-gradient(135deg,#fff0f7,#f1ecff);border:1px dashed #d8b4fe;border-radius:10px;padding:8px 12px;font-size:15px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;margin:6px 0 4px;color:#3b2a55}
.memo .lbl{font-weight:700;font-size:13px;display:block;color:#9333ea}
.rates{transition:opacity .3s .3s}
.rates.wait{display:none}
.flip.enter{animation:cardIn .38s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
.flip.out-easy{animation:outEasy .42s ease-in forwards}
.flip.out-good{animation:outGood .4s ease-in forwards}
.flip.out-hard{animation:outHard .48s ease-in forwards}
.flip.out-again{animation:outAgain .5s ease-in forwards}
@keyframes outEasy{to{opacity:0;transform:translateY(-90px) scale(.85) rotate(-4deg)}}
@keyframes outGood{to{opacity:0;transform:translateX(120px) rotate(6deg)}}
@keyframes outHard{to{opacity:0;transform:translateX(70px) translateY(20px) rotate(3deg)}}
@keyframes outAgain{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px);opacity:1}100%{opacity:0;transform:translateX(-120px) rotate(-6deg)}}
.burst{position:fixed;font-size:22px;pointer-events:none;z-index:31;animation:burst .8s ease-out forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .memo{background:#2c2440;color:var(--text)}}
:root[data-theme="dark"] .memo{background:#2c2440;color:var(--text)}
@media (max-width:520px){.illus{width:100%}.face.front .word{font-size:42px}.face.front{min-height:200px}.rates{position:sticky;bottom:env(safe-area-inset-bottom, 0px);background:var(--bg);padding:8px 0;margin-top:8px;z-index:4;box-shadow:0 -6px 12px -8px rgba(0,0,0,.25)}}

/* 自然發音 */
.phrow{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.phhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.phhead .lbl{font-weight:700;font-size:13px;color:var(--muted)}
.phchunks{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
.ph{border:2px solid transparent;border-radius:10px;padding:4px 8px 2px;font-size:26px;font-weight:800;line-height:1.1;display:inline-flex;flex-direction:column;align-items:center;min-width:34px;font-family:"Segoe UI",system-ui,sans-serif}
.ph small{font-size:10px;font-weight:600;margin-top:2px;white-space:nowrap}
.g-cons{background:#eef0f3;color:#374151}
.g-short{background:#fee2e2;color:#b91c1c}
.g-long{background:#dbeafe;color:#1d4ed8}
.g-magic{background:#ede9fe;color:#6d28d9}
.g-silent{background:transparent;color:#9ca3af;border:2px dashed #cbd5e1}
.g-team{background:#ccfbf1;color:#0f766e}
.g-suffix{background:#fef9c3;color:#a16207}
.g-rctl{background:#ffedd5;color:#c2410c}
.g-digraph{background:#dcfce7;color:#15803d}
.g-exc{background:#fce7f3;color:#be185d;border-color:#f9a8d4}
button.ph:hover{border-color:currentColor}
.phsp{width:14px}
.phinfo{display:none;margin-top:8px;background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14px}
.phinfo.on{display:block}
.phsame{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.spell-q{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:52px}
.slot{min-width:44px;height:48px;border-bottom:3px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--muted);padding:0 6px;font-family:"Segoe UI",system-ui,sans-serif}
.slot.ok{border-bottom:none;border-radius:10px;animation:popIn .35s both}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tile{position:relative;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:8px 16px;font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--border);font-family:"Segoe UI",system-ui,sans-serif;transition:transform .1s}
.tile:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.tile .k{position:absolute;top:2px;left:5px;font-size:10px;color:var(--muted);font-weight:400}
.tile.used{opacity:.25;box-shadow:none}
.tile.hint{border-color:#ffd23f;animation:pulse 1.2s infinite}
.tile.shake{animation:screenshake .35s}
.map-bonus{margin-top:26px;text-align:center;position:relative;z-index:1}
.map-bonus .bt{display:inline-block;background:#fff3c4;color:#8a5a00;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700}
.map-node.bonus .ball{border-color:#fbbf24;box-shadow:0 4px 0 #f59e0b}

.ph{transition:transform .15s, box-shadow .15s}
.ph.lit{transform:scale(1.18);box-shadow:0 0 0 3px #ffd23f, 0 4px 12px rgba(255,180,0,.35);z-index:1}
.phbtns{display:flex;gap:6px;flex-wrap:wrap}
a.icon-btn{text-decoration:none;color:inherit}
.credits{margin-top:14px;font-size:13px;color:var(--muted)}
.credits summary{cursor:pointer}
.credits a{color:var(--muted)}

.mp{font-size:22px}
.mp small{font-size:11px}
.mp-pre{background:#dbeafe;color:#1d4ed8}
.mp-root{background:#ffedd5;color:#c2410c}
.mp-suf{background:#dcfce7;color:#15803d}
.mplus{align-self:center;color:var(--muted);font-weight:800;font-size:18px;padding:0 1px}
.mlogic{margin-top:8px;font-size:15px;background:linear-gradient(135deg,#fff0f7,#f1ecff);border:1px dashed #d8b4fe;border-radius:10px;padding:6px 10px;color:#3b2a55}
:root[data-theme="dark"] .mlogic{background:#2c2440;color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mlogic{background:#2c2440;color:var(--text)}}

.sync-badge{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:2px 9px;background:var(--surface);white-space:nowrap}
.sync-badge[hidden]{display:none}
.sync-badge[data-st="synced"]{color:var(--good);border-color:var(--good)}
.sync-badge[data-st="offline"]{color:var(--hard);border-color:var(--hard)}
.sync-badge{cursor:pointer;font:inherit;font-size:12px}
.sync-choice{display:grid;gap:8px;margin:10px 0}
.sync-choice div{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
.sync-choice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#syncDlg{max-width:min(420px,calc(100vw - 32px))}
.sync-box p{margin:6px 0}
.sync-code{font:700 clamp(22px,7vw,30px)/1.2 ui-monospace,Consolas,monospace;letter-spacing:.1em;white-space:nowrap;text-align:center;padding:12px;margin:10px 0;border:2px dashed var(--accent);border-radius:12px;user-select:all}
.sync-err{color:var(--again);font-size:13px}

/* 上課模式 */
.modes{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:14px}
.modes button{border:none;background:none;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.modes button.on{background:var(--accent);color:#fff}
.lessons{display:grid;gap:10px}
.lesson-pick{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.lesson-pick:hover{border-color:var(--accent)}
.lesson-pick .n{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lesson-pick .t{flex:1;font-weight:600}
.lesson-pick .s{font-size:12px;color:var(--muted);font-weight:400;display:block}
.lp{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
.lp.going{border-color:var(--accent)}
.lp .n{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lp.done .n{background:var(--ok-bg);color:var(--good)}
.lp .t{flex:1;min-width:190px;font-weight:600}
.lp .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px;flex-wrap:wrap}
.lp .mini{width:110px;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.lp .mini i{display:block;height:100%;background:var(--accent)}
.lp.done .mini i{background:var(--good)}
.lp .st{color:#f5b301;letter-spacing:1px;font-size:14px}
.lp .st .off{color:var(--border)}
.tagx{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--border)}
.tagx.going{border-color:var(--accent);color:var(--accent)}
.tagx.done{border-color:var(--good);color:var(--good)}
.cls-sum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.teacher-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.teacher{width:92px;height:92px;flex:none}
/* 安安老師（原創角色）：表情切換 */
.tch .e,.tch .m,.tch .fx{display:none}
.tch.mood-normal .e-normal,.tch.mood-normal .m-normal,
.tch.mood-happy .e-happy,.tch.mood-happy .m-happy,
.tch.mood-star .e-star,.tch.mood-star .m-happy,.tch.mood-star .fx-star,
.tch.mood-oops .e-oops,.tch.mood-oops .m-oops,.tch.mood-oops .fx-sweat,
.tch.mood-surprised .e-surprised,.tch.mood-surprised .m-surprised{display:inline}
.tch.talking .m{display:none!important}
.tch.talking .m-talk{display:inline!important}
.tch .mouth{transform-box:fill-box;transform-origin:center}
.tch.talking .mouth{animation:talk .26s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.2)}}
.tch .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.tch .arm{transform-box:fill-box;transform-origin:0% 100%}
.tch.talking .arm{animation:wave 1.1s infinite alternate ease-in-out}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
.tch.mood-happy,.tch.mood-star{animation:hop .5s ease-out}
.tch.mood-oops{animation:wobble .5s}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.tch .fx-star polygon{animation:twinkle .8s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{from{transform:scale(.6)}to{transform:scale(1.15)}}
.tch-sm{width:52px;height:52px;flex:none}
/* 遊戲：狀態列 */
.hud{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
.hud:hover{border-color:var(--accent)}
.hud .lv{background:linear-gradient(135deg,#ff7eb8,#8b5cf6);color:#fff;border-radius:999px;padding:2px 9px;font-weight:800}
.hud .xpbar{width:70px;height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hud .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff7eb8)}
.hud .stk{font-weight:700}
/* 特效 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:29}
.float-xp{position:fixed;right:24px;top:58px;font-weight:800;color:#ff7a00;font-size:18px;text-shadow:0 1px 0 #fff;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.banner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;background:linear-gradient(135deg,#ff7eb8,#8b5cf6);color:#fff;border-radius:20px;padding:16px 28px;box-shadow:0 10px 40px rgba(139,92,246,.45);animation:pop 1.9s ease forwards;max-width:calc(100% - 32px)}
.banner b{display:block;font-size:28px;letter-spacing:1px}
.banner span{font-size:15px;opacity:.95}
.banner.combo{background:linear-gradient(135deg,#ffb347,#ff5f6d)}
.banner.badge{background:linear-gradient(135deg,#34d399,#3b82f6)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.shake{animation:screenshake .35s}
@keyframes screenshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* 闖關地圖 */
.map{background:linear-gradient(180deg,#fff1f8,#eef4ff);border:1px solid var(--border);border-radius:18px;padding:16px 10px 24px;position:relative;overflow:hidden}
.map::before{content:"";position:absolute;left:50%;top:120px;bottom:30px;border-left:4px dotted #d9c3ff;transform:translateX(-50%)}
.map-node{position:relative;display:flex;flex-direction:column;align-items:center;margin:14px auto;width:150px;border:none;background:none;padding:0}
.map-node .ball{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:#fff;border:4px solid #c4b5fd;box-shadow:0 4px 0 #a78bfa;transition:transform .15s}
.map-node:hover .ball{transform:translateY(-3px)}
.map-node .nm{font-weight:700;font-size:14px;margin-top:6px;color:#3b2a55;background:rgba(255,255,255,.85);border-radius:8px;padding:0 6px}
.map-node .sb{font-size:12px;color:#7a6c90}
.map-node .st{font-size:16px;letter-spacing:1px;color:#f5b301}
.map-node .st .off{color:#d8d2e3}
.map-node .ball{position:relative}
.map-node .going-tag{position:absolute;top:-6px;right:-14px;background:#ff7eb8;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;white-space:nowrap;box-shadow:0 2px 0 #ec4899}
.map-node .pg{width:90px;height:6px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin-top:3px}
.map-node .pg i{display:block;height:100%;background:#a78bfa}
.map-node.done .pg i{background:#10b981}
.map-node .pt{font-size:11px;color:#6b5d82;margin-top:1px}
.map-sum{position:relative;z-index:1;background:rgba(255,255,255,.88);border:1px solid #eadff5;border-radius:14px;padding:10px 14px;margin:0 6px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#3b2a55}
.map-sum .xpwide{flex:1;min-width:120px;margin:0}
:root[data-theme="dark"] .map-sum{background:rgba(32,35,40,.9);color:var(--text);border-color:var(--border)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map-sum{background:rgba(32,35,40,.9);color:var(--text);border-color:var(--border)}}
.map-node.done .ball{border-color:#34d399;box-shadow:0 4px 0 #10b981}
.map-node.cur .ball{border-color:#ff7eb8;box-shadow:0 4px 0 #ec4899;animation:pulse 1.4s infinite}
.map-node.locked .ball{background:#ece8f2;border-color:#d4cee0;box-shadow:0 4px 0 #c3bcd2;filter:grayscale(1);font-size:26px}
.map-node.boss .ball{width:92px;height:92px;font-size:42px;border-color:#8b5cf6}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #ec4899,0 0 0 0 rgba(255,126,184,.6)}50%{box-shadow:0 4px 0 #ec4899,0 0 0 12px rgba(255,126,184,0)}}
:root[data-theme="dark"] .map{background:linear-gradient(180deg,#2a2033,#1e2636)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map{background:linear-gradient(180deg,#2a2033,#1e2636)}}
/* 頭目戰 */
.arena{background:linear-gradient(180deg,#2b1b4a,#3d2466);border-radius:18px;padding:14px;color:#fff;position:relative;overflow:hidden}
.arena .muted{color:#cbbfe6}
.hpbar{height:14px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5f6d,#ffc371);transition:width .4s}
.boss-stage{display:flex;justify-content:center;position:relative;height:150px}
.boss{width:170px;height:150px}
.boss.normal{animation:bob 2s infinite ease-in-out}
.boss.hurt{animation:hurt .45s}
.boss.dead{filter:grayscale(.8);opacity:.6;transform:rotate(-10deg) translateY(10px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hurt{0%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-6deg)}50%{transform:translateX(10px) rotate(5deg)}100%{transform:translateX(0)}}
.dmg{position:absolute;top:10px;left:50%;font-size:30px;font-weight:900;color:#ffd75e;text-shadow:0 2px 0 #b45309;animation:dmgup 1s ease-out forwards}
.dmg.crit{color:#ff6b9a;font-size:36px}
@keyframes dmgup{from{opacity:1;transform:translate(-50%,0) scale(1.3)}to{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.player-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.hearts{font-size:20px;letter-spacing:2px}
.btimer{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.btimer i{display:block;height:100%;background:#7dd3fc;width:100%}
.arena .card{color:var(--text)}
.boss-line{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 10px;font-size:14px}
.combo-chip{background:linear-gradient(135deg,#ffb347,#ff5f6d);border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px}
/* 成就頁 */
.lvcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvbig{font-size:34px;font-weight:900;background:linear-gradient(135deg,#ff7eb8,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.xpwide{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0}
.xpwide i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff7eb8)}
.task{display:flex;align-items:center;gap:10px;margin:8px 0}
.task .bar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.task .bar i{display:block;height:100%;background:var(--good)}
.task .ck{width:24px;text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bdg{border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center;background:var(--surface)}
.bdg .ic{font-size:30px}
.bdg .bn{font-weight:700;font-size:13px}
.bdg .bd{font-size:11px;color:var(--muted)}
.bdg.off .ic{filter:grayscale(1) brightness(.4);opacity:.35}
.bdg.off .bn{color:var(--muted)}
.greet{display:flex;gap:12px;align-items:center}
.daily-mini{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.daily-mini span{border:1px solid var(--border);border-radius:99px;padding:2px 10px;background:var(--surface)}
.daily-mini span.ok{border-color:var(--good);color:var(--good)}
.bubble{position:relative;flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:17px;box-shadow:var(--shadow);min-height:84px}
.bubble::before{content:"";position:absolute;left:-8px;top:24px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.bubble .who{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
.bubble .eng{color:var(--accent);font-weight:600}
.board{background:#23453a;color:#f4f1e6;border-radius:14px;padding:16px 18px;border:6px solid #8a6a43;min-height:150px;font-size:19px;box-shadow:var(--shadow)}
.board .line{margin:6px 0;font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5}
.board mark{background:none;color:#ffd75e;font-weight:700;border-bottom:2px solid #ffd75e}
.board .bad{color:#ff9d94;text-decoration:line-through}
.board .chant{background:rgba(255,215,94,.14);border:2px dashed #ffd75e;border-radius:10px;padding:10px 12px;font-size:20px;font-weight:700;color:#ffe9a8;margin:4px 0 8px}
.board .bq{font-size:22px;font-weight:600}
.board .say-en{border:1px solid rgba(255,255,255,.35);background:transparent;color:#f4f1e6;border-radius:99px;font-size:12px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.chantlist{margin-top:12px;border-top:1px dashed rgba(255,255,255,.3);padding-top:8px;font-size:14px;color:#d8e6dd}
.chantlist b{color:#ffd75e}
.cls-opts{display:grid;gap:8px;margin-top:12px}
.cls-ctrl{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--accent)}
.dot.past{background:var(--good)}
@media (max-width:520px){
  .teacher{width:64px;height:64px}
  .tabs{flex-wrap:wrap;overflow:visible;gap:2px 4px}
  .tab{padding:7px 10px;font-size:14px;border-radius:8px 8px 0 0}
  .hud .xpbar,.hud .ttl{display:none}
  .map-node.l,.map-node.r{transform:none}
  .bubble{font-size:16px}
  .board{font-size:17px;padding:12px}
  .board .bq{font-size:19px}
  .word{font-size:36px}
  .en{font-size:18px}
  .rates{gap:6px}
  .rate{padding:8px 2px;font-size:14px}
  .keys{display:none}
}

/* 金幣、盲盒、商店 */
.hud .coin{font-weight:700}
.boxbtn{position:relative;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:17px;line-height:1.4}
.boxbtn:hover{border-color:var(--accent)}
.boxbtn .bdot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff4d6d;border:2px solid var(--bg)}
.coins-big{margin-left:auto;font-weight:800;font-size:18px;color:var(--text)}
.draw-card,.draw-stage{text-align:center}
.giftbox{font-size:88px;line-height:1;display:inline-block;margin:12px 0 6px}
.giftbox.idle{animation:bob 2.2s ease-in-out infinite}
.giftbox.shake{animation:boxshake .16s infinite}
.giftbox.gold{filter:drop-shadow(0 0 16px #ffd23f)}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes boxshake{0%{transform:rotate(-9deg) scale(1.05)}50%{transform:rotate(9deg) scale(1.12)}100%{transform:rotate(-9deg) scale(1.05)}}
.draw-btns{display:flex;flex-direction:column;gap:8px;align-items:center;margin:8px 0 10px}
.draw-btns .btn{width:min(380px,100%)}
.btn.gold{background:linear-gradient(135deg,#ffd23f,#ff9f1c);border-color:#f0a500;color:#3b2a00;font-weight:700}
.reveal{display:inline-flex;flex-direction:column;align-items:center;gap:6px;max-width:100%;background:var(--surface);border:3px solid var(--rc);border-radius:18px;padding:16px 22px;animation:popIn .5s ease-out}
.reveal.r-SR,.reveal.r-SSR{box-shadow:0 0 30px var(--rc)}
.rlabel{color:#fff;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px}
.rname{font-size:21px;font-weight:800}
.newtag{color:#ff4d6d;font-weight:900;font-size:18px}
.dupnote{color:var(--muted);font-weight:700}
.tch-big{width:150px;height:150px}
.tch-mid{width:78px;height:78px}
.odds table{width:100%;border-collapse:collapse;font-size:14px}
.odds th,.odds td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.odds td:nth-child(2),.odds td:nth-child(3){font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--border);background:var(--surface);border-radius:14px;padding:8px 6px;font-size:13px;min-width:0;text-align:center}
button.ctile:hover{border-color:var(--accent)}
.ctile.on{border-color:var(--accent);background:var(--accent-soft)}
.ctile.locked{color:var(--muted);border-style:dashed}
.rtag{font-size:12px;font-weight:700;color:var(--muted)}
.qmark{width:78px;height:78px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--muted)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.shop-item{display:flex;gap:10px;align-items:center;margin:0}
.shop-ic{font-size:32px}
.chance-row{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opt.gone{opacity:.3;text-decoration:line-through}
.arena .tools .btn{background:rgba(255,255,255,.1);color:#f4f1e6;border-color:rgba(255,255,255,.3)}
.greet-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
</style>

<script>
/* =========================================================
   自然發音：規則、65 個單字的拼字拆解、4 堂發音課
   拆解格式："字母塊:規則 字母塊:規則 ……"，_ 代表空格
   ========================================================= */
// [分組, 標籤, 說明, 代表字]
const RULES = {
  c:["cons","","子音字母唸它的基本音，例如 b、d、m、n、t。",""],
  blend:["cons","子音連音","兩個子音連在一起，兩個音都要唸出來，例如 bl、gr、st、fr。","black"],
  double:["cons","雙子音","兩個一樣的子音字母只唸一個音，例如 ll、pp、ss。","apple"],
  soft_c:["cons","c 唸 /s/","c 後面接 e、i、y 時，唸 /s/。","nice"],
  soft_g:["cons","g 唸 /dʒ/","g 後面接 e 時，常唸 /dʒ/。","orange"],
  s_z:["cons","s 唸 /z/","s 夾在兩個母音中間時，常唸 /z/。","eraser"],
  short_a:["short","短 a","母音被子音夾在中間時唸短音。短 a /æ/ 嘴巴張大，介於「欸」和「啊」之間。","cat"],
  short_e:["short","短 e","短 e /ɛ/ 像中文的「欸」。","pen"],
  short_i:["short","短 i","短 i /ɪ/ 是短短、輕輕的「一」。","big"],
  short_o:["short","短 o","短 o /ɑ/ 嘴巴張大，像「啊」。","dog"],
  short_u:["short","短 u","短 u /ʌ/ 是短而輕的「ㄜ」。","umbrella"],
  schwa:["short","弱音","不重讀的母音會變得又輕又短 /ə/，像輕輕的「ㄜ」。","hello"],
  long_a:["long","長 a","母音在音節最後面時，常唸字母本身的名字，a 唸「A」/eɪ/。","baby"],
  long_e:["long","長 e","e 唸字母本身的名字「E」/iː/。","eraser"],
  long_i:["long","長 i","i 唸字母本身的名字「I」/aɪ/。","driver"],
  long_o:["long","長 o","o 唸字母本身的名字「O」/oʊ/。","old"],
  long_u:["long","長 u","u 唸長長的「嗚」/uː/。","ruler"],
  y_i:["long","y 唸 /i/","兩個音節以上的字，字尾的 y 常唸「一」/i/。","happy"],
  a_e:["magic","a_e","魔法 e：字尾的 e 不發音，讓前面的 a 唸自己的名字「A」。","name"],
  i_e:["magic","i_e","魔法 e：讓前面的 i 唸自己的名字「I」。","fine"],
  o_e:["magic","o_e","魔法 e：讓前面的 o 唸自己的名字「O」。","notebook"],
  u_e:["magic","u_e","魔法 e：讓前面的 u 唸自己的名字「U」。","cute"],
  silent_e:["silent","魔法 e","字尾的 e 不發音，但會讓前面的母音唸長音。","name"],
  silent:["silent","不發音","這個字母不發音。","nurse"],
  ee:["team","ee","兩個 e 手牽手，唸長長的「一」/iː/。","meet"],
  ea:["team","ea","ea 常唸長長的「一」/iː/，跟 ee 一樣。","teacher"],
  oo_l:["team","長 oo","oo 唸長長的「嗚」/uː/。","school"],
  oo_s:["team","短 oo","oo 也可以唸短短的「ㄨ」/ʊ/，像 book、cook。","book"],
  ue:["team","ue","ue 唸長長的「嗚」/uː/。","blue"],
  ew:["team","ew","ew 唸「嗚」/uː/。","new"],
  oy:["team","oy","oy 唸 /ɔɪ/，像「歐一」連在一起。","boy"],
  ow_o:["team","ow 長 o","ow 在字尾常唸長 o /oʊ/。","yellow"],
  air:["rctl","air","air 唸 /ɛr/，像「欸兒」。","chair"],
  ere:["rctl","ere","ere 唸 /ɪr/，像「一兒」。","here"],
  ar:["rctl","ar","霸道的 r：ar 唸 /ɑr/，像「啊兒」。","farmer"],
  or:["rctl","or","霸道的 r：or 唸 /ɔr/，像「歐兒」。","short"],
  er:["rctl","er","霸道的 r：er 唸捲舌的 /ɚ/。","teacher"],
  ir:["rctl","ir","ir 和 er、ur 唸法一樣 /ɚ/，拼字要特別記。","girl"],
  ur:["rctl","ur","ur 和 er、ir 唸法一樣 /ɚ/，拼字要特別記。","nurse"],
  schwa_r:["rctl","弱讀 er","不重讀的 or 也會唸成 /ɚ/。","doctor"],
  all:["rctl","all","all 家族唸 /ɔl/：tall、small、ball。","tall"],
  le:["rctl","le","字尾的 le 唸 /əl/。","apple"],
  ch:["digraph","ch","兩個字母唸一個音 /tʃ/，像「去」的嘴型。","chair"],
  sh:["digraph","sh","sh 唸 /ʃ/，像要別人安靜的「噓」。","short"],
  th:["digraph","th 無聲","舌頭輕輕咬住，送氣不出聲 /θ/。","thank"],
  th_v:["digraph","th 有聲","舌頭輕輕咬住，喉嚨要震動 /ð/。","father"],
  ck:["digraph","ck","ck 唸 /k/，常跟在短母音後面。","black"],
  ng:["digraph","ng","鼻子發出的聲音 /ŋ/，像「嗯」的尾音。","morning"],
  nk:["digraph","nk","n 唸鼻音，再接 /k/。","thank"],
  wh:["digraph","wh","wh 通常唸 /w/。","white"],
  ch_k:["exc","ch 唸 /k/","ch 在 school 裡唸 /k/，是例外。","school"],
  a_ah:["exc","a 唸 /ɑ/","a 在 father 裡唸 /ɑ/，像「啊」。","father"],
  o_uh:["exc","o 唸 /ʌ/","o 在 mother、brother 裡唸短 u /ʌ/。","mother"],
  i_ee:["exc","i 唸 /iː/","i 在 police 裡唸長 e /iː/，是例外。","police officer"],
  // ---- 國一後面幾個單元用到的規則（2026/10 新增） ----
  ai:["team","ai","ai 兩個母音手牽手，唸字母名 A /eɪ/。","rain"],
  ay:["team","ay","ay 常在字尾，唸字母名 A /eɪ/。","play"],
  oa:["team","oa","oa 唸字母名 O /oʊ/。","boat"],
  ow_ou:["team","ow 唸 /aʊ/","ow 在 cow、down 裡唸 /aʊ/，像被嚇到的「啊嗚」。","down"],
  ou:["team","ou","ou 常唸 /aʊ/，像「啊嗚」。","house"],
  oi:["team","oi","oi 唸 /ɔɪ/，和 oy 一樣，oi 常在字中間。","coin"],
  ie:["team","ie","ie 在字尾常唸字母名 I /aɪ/。","pie"],
  igh:["team","igh","igh 唸字母名 I /aɪ/，gh 不發音。","night"],
  aw:["team","aw / au","aw、au 唸 /ɔ/，嘴巴張圓。","draw"],
  y_ai:["long","y 唸 /aɪ/","y 在短字的字尾，常唸字母名 I /aɪ/。","my"],
  ear:["rctl","ear","ear 常唸 /ɪr/，像「一爾」。","ear"],
  are:["rctl","are","are 在字尾常唸 /ɛr/，像「欸爾」。","care"],
  ore:["rctl","ore","ore 唸 /ɔr/，和 or 一樣。","more"],
  ph:["digraph","ph","ph 唸 /f/。","phone"],
  kn:["silent","kn","kn 開頭的 k 不發音，只唸 /n/。","know"],
  wr:["silent","wr","wr 開頭的 w 不發音，只唸 /r/。","write"],
  tch:["digraph","tch","tch 唸 /tʃ/，跟 ch 一樣，常跟在短母音後面。","watch"],
  qu:["cons","qu","q 後面一定跟著 u，qu 一起唸 /kw/。","quiet"],
  x_ks:["cons","x","x 在字尾唸 /ks/。","box"],
  es_iz:["cons","-es 唸 /ɪz/","字尾是 s、x、ch、sh 的字，加 -es 後唸 /ɪz/。","watches"],
  ed_t:["cons","-ed 唸 /t/","前面是無聲的音（p、k、f、s、sh、ch），-ed 唸 /t/。","walked"],
  ed_d:["cons","-ed 唸 /d/","前面是有聲的音，-ed 唸 /d/。","played"],
  ed_id:["cons","-ed 唸 /ɪd/","前面是 t 或 d，-ed 唸 /ɪd/，多一個音節。","wanted"],
  tion:["suffix","tion","字尾 tion 唸 /ʃən/，像「遜」。","station"],
  ful:["suffix","ful","字尾 ful 唸 /fəl/，表示「充滿……的」。","beautiful"],
  exc:["exc","例外","不照一般規則唸，要特別記。",""],
  space:["space","","",""]
};
function phChunks(w){
  const spec = PH[w.w]; if(!spec) return null;
  return spec.split(" ").map(t => { const i = t.lastIndexOf(":"); return [t.slice(0, i) === "_" ? " " : t.slice(0, i), t.slice(i + 1)]; });
}
function phonicsRow(w){
  const ch = phChunks(w); if(!ch) return "";
  return `<div class="phrow">
    <div class="phhead"><span class="lbl">🔤 拼字拆解（點字母塊聽講解）</span>
      <div class="phbtns"><button class="icon-btn" data-narrate="${esc(w.w)}">🎧 聽老師拆解</button><button class="icon-btn" data-slow="${esc(w.w)}">🐢 慢慢唸</button>
      <a class="icon-btn" href="https://phonicademy.com/phonemes" target="_blank" rel="noopener" title="外部網站：Phonicademy">🔗 標準發音</a></div></div>
    <div class="phchunks">${ch.map(([t, tag], k) => tag === "space" ? `<span class="phsp"></span>`
      : `<button class="ph g-${RULES[tag][0]}" data-ph="${tag}" data-w="${esc(w.w)}" data-k="${k}">${esc(t)}<small>${esc(RULES[tag][1]) || "&nbsp;"}</small></button>`).join("")}</div>
    <div class="phinfo" id="phInfo"></div></div>`;
}
function showPh(tag, word, k){
  const box = $("#phInfo"); if(!box) return;
  const r = RULES[tag]; const R = getRange(view.range);
  const same = R.words.filter(w => w.w !== word && (PH[w.w] || "").split(" ").some(t => t.endsWith(":" + tag))).slice(0, 8);
  box.innerHTML = `<div><b>${esc(r[1] || "子音")}</b>：${esc(r[2])}</div>
    ${tag === "exc" && EXC_NOTE[word] ? `<div style="margin-top:4px">⚠️ ${esc(EXC_NOTE[word])}</div>` : ""}
    ${same.length ? `<div class="phsame">同一條規則的字：${same.map(w => `<button class="icon-btn" data-say="en" data-text="${esc(w.w)}">${esc(w.w)}</button>`).join("")}</div>` : ""}`;
  if(AUD[tag]) box.innerHTML += `<div class="muted" style="font-size:12px;margin-top:6px">🎙 母音錄音（${esc(VOWEL_SRC[AUD[tag]][1])}）：Wikimedia Commons，CC BY-SA 3.0</div>`;
  box.innerHTML += `<div style="margin-top:6px"><a class="icon-btn" href="https://phonicademy.com/phonemes" target="_blank" rel="noopener">🔗 到 Phonicademy 聽標準發音</a></div>`;
  box.classList.add("on");
  if(k != null && !isNaN(k)) narrateChunk(word, k);
  else if(r[3]) sayEn(r[3] === word ? word : r[3]);
}
// 子字串標亮（自然發音課黑板用）：依序找出每個片段，不重疊
function markSub(text, hl){
  const ranges = [];
  (hl || []).forEach(h => {
    let from = 0, at;
    while((at = text.indexOf(h, from)) !== -1){
      if(!ranges.some(([a, b]) => at < b && at + h.length > a)){ ranges.push([at, at + h.length]); break; }
      from = at + 1;
    }
  });
  ranges.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  ranges.forEach(([a, b]) => { out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; pos = b; });
  return out + esc(text.slice(pos));
}

/* ---------- 拼字挑戰 ---------- */
const CONFUSE = {ee:"ea",ea:"ee",oo:"u",ck:"k",c:"k",k:"c",er:"ir",ir:"er",ur:"er",or:"ar",ar:"or",ll:"l",pp:"p",gg:"g",ss:"s",rr:"r",ff:"f",
  a:"e",e:"a",i:"e",o:"u",u:"o",y:"ie",sh:"ch",ch:"sh",th:"t",ow:"o",all:"al",ew:"oo",ue:"oo",air:"are",ere:"eer",le:"el",ng:"n",nk:"ng",oy:"oi",wh:"w",ie:"ee",l:"ll",s:"ss"};
function spellParts(w){
  if(w.parts) return w.parts.map(p => [p.t, null, p.m, p.kind]);
  const ch = phChunks(w);
  let parts = ch ? ch.filter(c => c[1] !== "space") : null;
  if(!parts || parts.length < 3) parts = [...w.w.replace(/\s+/g, "")].map(t => [t, null]);
  return parts;
}
function newSpellWord(sp, R){
  const w = R.words[sp.list[sp.i]];
  const parts = spellParts(w);
  const texts = parts.map(p => p[0]);
  const lower = texts.map(t => t.toLowerCase());
  const pool = R.morph
    ? shuffle(R.words.flatMap(x => x.parts || []).filter(q => !lower.includes(q.t.toLowerCase()) && parts.some(pp => pp[3] === q.kind)).map(q => q.t))
    : shuffle(lower.map(t => CONFUSE[t]).filter(t => t && !lower.includes(t)));
  const extra = [...new Set(pool)].slice(0, 2);
  while(extra.length < 2){ const L = "abdefgilmnoprstu"[Math.random() * 16 | 0]; if(!lower.includes(L) && !extra.includes(L)) extra.push(L); }
  sp.parts = parts;
  sp.tiles = shuffle(texts.map((t, k) => ({t, used:false, k})).concat(extra.map(t => ({t, used:false, k:-1}))));
  sp.built = 0; sp.missed = false; sp.solved = false; sp.hintAt = -1;
  sp.msg = R.morph ? "看中文和插圖，照順序點積木，把單字拼出來！" : "聽一聽，再照順序點字母塊，把單字拼出來！"; sp.mood = "normal";
}
function startSpell(){
  const R = getRange(view.range);
  const n = Math.min(10, R.words.length);
  view.spell = {list: shuffle(R.words.map((_, i) => i)).slice(0, n), i:0, firstOk:0, total:n, done:false};
  newSpellWord(view.spell, R);
}
function renderSpell(R){
  if(!view.spell) startSpell();
  const sp = view.spell, pane = $("#pane");
  if(sp.done){
    const n = sp.stars;
    pane.innerHTML = `<div class="card done"><div class="big">${R.spellIcon || "🔤"}</div><h2 style="margin:6px 0">${R.spellTitle || "拼字挑戰"}完成！</h2>
      <div style="font-size:28px;color:#f5b301">${starText(n)}</div>
      <div class="stats"><div class="stat"><b>${sp.firstOk}/${sp.total}</b>一次就拼對</div></div>
      <div class="teacher-row" style="justify-content:center">${teacherSvg(n === 3 ? "star" : "happy", "", "tch-sm")}<div class="bubble" style="flex:0 1 420px;text-align:left"><span class="who">${esc(tName())}</span>${n === 3 ? (R.morph ? "全部一次拼對，字根字首你已經很熟了！" : "全部一次拼對，自然發音你已經很熟了！") : (R.morph ? "拼錯的字，回單字卡看看「字根拆解」，再來挑戰一次！" : "拼錯的字，回單字卡看看「拼字拆解」，再來挑戰一次！")}</div></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="spellRestart">再玩一輪</button><button class="btn" data-tab="map">回闖關地圖</button></div></div>`;
    return;
  }
  const w = R.words[sp.list[sp.i]];
  const grpOf = p => p[3] ? "mp mp-" + p[3] : "g-" + (p[1] ? RULES[p[1]][0] : "cons");
  pane.innerHTML = `<div class="card spell">
    <div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">第 ${sp.i + 1} / ${sp.total} 個字</span>${combo >= 2 ? `<span class="combo-chip" style="color:#fff">${combo} 連擊</span>` : ""}</div>
    <div class="teacher-row" style="margin-top:6px">${teacherSvg(sp.mood, "", "tch-sm")}<div class="bubble"><span class="who">${esc(tName())}</span>${esc(sp.msg)}</div></div>
    <div class="spell-q"><div class="illus" style="width:150px">${wordArt(w)}</div>
      <div><div class="zh" style="margin:0">${esc(w.zh)} <span class="pos">${esc(w.pos)}</span></div>
        <div class="row" style="margin-top:8px"><button class="btn small" id="spellListen">🔊 再聽一次</button><button class="btn small" data-slow="${esc(w.w)}">🐢 慢慢唸</button>${sp.solved ? "" : `<button class="btn small" id="spellHint">💡 提示</button>`}${!sp.solved && sp.hintAt >= 0 && sp.parts[sp.built] && (sp.parts[sp.built][1] || sp.parts[sp.built][2]) ? `<button class="btn small" id="spellRule">🎧 聽規則</button>` : ""}</div></div></div>
    <div class="slots">${sp.parts.map((p, k) => k < sp.built ? `<span class="slot ok ph ${grpOf(p)}">${esc(p[0])}</span>` : `<span class="slot">${"＿".repeat(Math.min(3, p[0].length))}</span>`).join("")}</div>
    ${sp.solved ? `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="spellNext">${sp.i + 1 < sp.total ? "下一個字 →" : "看結果"}</button></div>`
      : `<div class="tiles">${sp.tiles.map((t, k) => `<button class="tile ${t.used ? "used" : ""} ${sp.hintAt === k ? "hint" : ""}" data-tile="${k}" ${t.used ? "disabled" : ""}><span class="k">${k + 1}</span>${esc(t.t)}</button>`).join("")}</div>`}
  </div>
  <div class="keys">鍵盤：數字鍵選字母塊・空白鍵 再聽一次・Enter 下一個字</div>`;
  if(!sp.spoke){ sp.spoke = true; setTimeout(() => { if(view.spell === sp && view.tab === "spell") sayEn(w.w); }, 250); }
}
function spellPick(k){
  const sp = view.spell; if(!sp || sp.solved || sp.done) return;
  const R = getRange(view.range);
  const tile = sp.tiles[k]; if(!tile || tile.used) return;
  const want = sp.parts[sp.built];
  if(tile.t === want[0]){
    tile.used = true; sp.built++; sp.hintAt = -1;
    if(sp.built === sp.parts.length){
      sp.solved = true;
      const w = R.words[sp.list[sp.i]];
      if(!sp.missed){ onCorrect(); sp.firstOk++; gainXP(10, true); sp.mood = combo >= 3 ? "star" : "happy"; sp.msg = combo >= 3 ? `${combo} 連擊！${w.w} 拼得又快又準！` : `答對了！${w.w} 拼得一字不差！`; }
      else { sfx("correct"); sp.mood = "happy"; sp.msg = `拼出來了！${w.w}，下次一次就拼對吧！`; }
      sayEn(w.w);
      renderStudy();
      const cur = sp.i;
      setTimeout(() => { if(view.spell === sp && sp.i === cur && view.tab === "spell" && sp.solved) spellNext(); }, 1800);
      return;
    }
    sfx("flip"); renderStudy();
  }else{
    if(!sp.missed){ sp.missed = true; onWrong(); } else sfx("wrong");
    const tag = want[1];
    sp.mood = "oops";
    sp.msg = want[2] ? `第 ${sp.built + 1} 塊應該是「${want[0]}」（${KIND_NAME[want[3]]}）：意思是「${want[2]}」。` : `第 ${sp.built + 1} 塊應該是「${want[0]}」` + (tag && RULES[tag][1] ? `（${RULES[tag][1]}）：${RULES[tag][2]}` : "。") + (tag === "exc" && EXC_NOTE[R.words[sp.list[sp.i]].w] ? " " + EXC_NOTE[R.words[sp.list[sp.i]].w] : "");
    sp.hintAt = sp.tiles.findIndex(t => !t.used && t.t === want[0]);
    renderStudy();
    const el = document.querySelector(`[data-tile="${k}"]`); if(el){ el.classList.add("shake"); }
  }
}
function spellHint(){
  const sp = view.spell; if(!sp || sp.solved) return;
  const want = sp.parts[sp.built];
  sp.missed = true;
  sp.hintAt = sp.tiles.findIndex(t => !t.used && t.t === want[0]);
  const tag = want[1];
  sp.mood = "surprised";
  sp.msg = want[2] ? `提示：下一塊是發亮的那一個，它是${KIND_NAME[want[3]]}，意思是「${want[2]}」。` : `提示：下一塊是發亮的那一個` + (tag && RULES[tag][1] ? `，規則是「${RULES[tag][1]}」：${RULES[tag][2]}` : "。");
  renderStudy();
}
function spellNext(){
  const sp = view.spell; if(!sp || !sp.solved) return;
  const R = getRange(view.range);
  if(sp.i + 1 >= sp.total){
    const ratio = sp.firstOk / sp.total;
    sp.stars = ratio >= .9 ? 3 : ratio >= .7 ? 2 : 1;
    sp.done = true;
    const xp = gainXP(60); setStars(view.range, "spell", sp.stars);
    renderStudy(); celebrate((R.spellTitle || "拼字挑戰") + " 完成！", sp.stars, xp);
    return;
  }
  sp.i++; sp.spoke = false; newSpellWord(sp, R); renderStudy();
}

const CN_NUM = ["一","二","三","四","五","六","七","八","九","十","十一","十二"];
const spellOut = t => [...t].join("、");
const noIpa = t => String(t).replace(/\/[^/]+\//g, "").replace(/唸\s*([。，])/g, "$1").replace(/，\s*。/g, "。").replace(/\s+/g, " ");
// 把一段講稿拆成語音片段：中文、英文、母音錄音
function narrParts(text, tag, hl){
  const out = [];
  String(text).split(/(\[A\]|\{[^}]+\})/).forEach(p => {
    if(!p) return;
    if(p === "[A]"){ if(AUD[tag]) out.push({k:"aud", v:AUD[tag], hl}); return; }
    if(p.startsWith("{")) out.push({k:"en", v:p.slice(1, -1), hl});
    else if(p.replace(/[，。！？、\s]/g, "")) out.push({k:"zh", v:p, hl});
  });
  return out;
}
function chunkScript(word, ch, k, n){
  const [t, tag] = ch[k];
  const head = n != null ? `第${CN_NUM[n] || n + 1}塊，${spellOut(t)}，` : `${spellOut(t)}，`;
  const body = tag === "c" ? (t === "c" ? "c 在這裡唸 k 的音" : t === "y" ? "y 在開頭是子音，像 {yes} 的開頭" : t.length === 1 ? `唸 ${t} 的基本音` : "唸它的基本音") : (SPOKEN[tag] || RULES[tag][2]);
  let parts = narrParts(head + body + "。", tag, k);
  if(tag === "exc" && EXC_NOTE[word]) parts = parts.concat(narrParts(noIpa(EXC_NOTE[word]), "exc", k));
  return parts;
}
function wordScript(w){
  const ch = phChunks(w); if(!ch) return [];
  const idx = ch.map((c, k) => c[1] === "space" ? -1 : k).filter(k => k >= 0);
  let parts = narrParts(`我們來拆 {${w.w}}，它有 ${idx.length} 塊。`, "", "all");
  idx.forEach((k, n) => { parts = parts.concat(chunkScript(w.w, ch, k, n)); });
  parts.push({k:"zh", v:"合起來，慢慢唸：", hl:"all"}, {k:"en", v:w.w, hl:"all", rate:.45}, {k:"zh", v:"正常速度：", hl:"all"}, {k:"en", v:w.w, hl:"all"});
  return parts;
}

let narrToken = 0;
const narrAudio = new Audio();
function narrStop(){
  narrToken++;
  try{ narrAudio.pause(); }catch(e){}
  document.querySelectorAll(".ph.lit").forEach(el => el.classList.remove("lit"));
  document.querySelectorAll("[data-narrate]").forEach(b => b.textContent = "🎧 聽老師拆解");
}
/* 單獨唸一個英文單字時，Edge 的語音常把結尾子音截掉（attend 聽起來像 "atte"）。
   對策：補句點讓它當成完整句子唸，並在後面接一段無聲的語音，讓最後的音完整播出。 */
function isShortEn(text, lang){
  return lang.startsWith("en") && text.trim().split(/\s+/).length <= 3 && !/[.!?]$/.test(text.trim());
}
function padUtterance(lang){
  const u = new SpeechSynthesisUtterance("and then");
  u.lang = lang; u.volume = 0; u.rate = 1.4;
  applyVoice(u, lang);
  return u;
}
function sayOne(text, lang, rate){
  return new Promise(res => {
    if(!("speechSynthesis" in window)) return res();
    const short = isShortEn(text, lang);
    const u = new SpeechSynthesisUtterance(short ? text.trim() + "." : text); u.lang = lang;
    applyVoice(u, lang);
    u.rate = rate || (lang.startsWith("en") ? getSpeed().en : getSpeed().zh);
    // 線上語音出錯就改用本機語音再唸一次
    let retried = false;
    const fail = e => { if(retried) return; if(voiceFailed(e, u)){ retried = true; speechSynthesis.cancel(); res(sayOne(text, lang, rate)); } else res(); };
    watchStart(u, () => fail({error:"no-start"}))();
    if(short){
      u.onerror = fail; speechSynthesis.speak(u);
      const pad = padUtterance(lang); pad.onend = () => { if(!retried) res(); }; pad.onerror = () => { if(!retried) res(); }; speechSynthesis.speak(pad);
    }else{ u.onend = res; u.onerror = fail; speechSynthesis.speak(u); }
  });
}
function playVowel(ipa){
  return new Promise(res => {
    const src = VOWEL_AUDIO[ipa]; if(!src) return res();
    narrAudio.src = src; narrAudio.onended = res; narrAudio.onerror = res;
    narrAudio.play().catch(res);
  });
}
async function narrate(parts, btn){
  stopSpeak();
  const my = ++narrToken;
  if(btn) btn.textContent = "⏹ 停止";
  const lit = hl => {
    document.querySelectorAll(".ph.lit").forEach(el => el.classList.remove("lit"));
    if(hl === "all") document.querySelectorAll(".phchunks .ph").forEach(el => el.classList.add("lit"));
    else if(hl !== undefined && hl !== null){ const el = document.querySelector(`.phchunks .ph[data-k="${hl}"]`); if(el) el.classList.add("lit"); }
  };
  for(const p of parts){
    if(my !== narrToken) return;
    lit(p.hl);
    if(p.k === "pause"){ await new Promise(r => setTimeout(r, p.ms)); continue; }
    if(p.k === "aud") await playVowel(p.v);
    else await sayOne(p.v, p.lang || (p.k === "en" ? "en-US" : "zh-TW"), p.rate);
  }
  if(my === narrToken) narrStop();
}
function narrateChunk(word, k){
  const w = getRange(view.range).words.find(x => x.w === word); if(!w) return;
  const ch = phChunks(w); if(!ch || !ch[k]) return;
  narrate(chunkScript(word, ch, k, null));
}

/* =========================================================
   單元載入：每個單元是 units/<id>.js，選到才載入
   單元檔呼叫 registerUnit(id, 內容)；共用的插圖、提示等放進下面的登記表
   ========================================================= */
const BUILTIN = {};
const PH = {}, EXC_NOTE = {}, VOWEL_AUDIO = {}, ILLUS = {}, ILLUS2 = {}, MEMO = {}, PHRASES = {};
const unitWaiters = {};
function convertWord([w, pos, zh, ex, parts, logic, art, tip]){
  let draw = ILLUS[w] ? () => ILLUS[w]() : null;
  if(art){
    if(art.startsWith("@")){ const key = art.slice(1); draw = () => ILLUS2[key](); }
    else { const [emo, label] = art.split("|"); draw = () => conceptCard(w, emo, label); }
  }
  return {w, pos, zh, ex, memo: tip || (parts ? "" : (MEMO[w] || "")), draw, parts: parts ? parseParts(parts) : null, logic: logic || ""};
}
function registerUnit(id, def){
  def.words = def.words.map(convertWord);
  // 每個單元都加上一堂詞性辨識課（國中用基礎版，其他用進階版）
  const basic = id.startsWith("j");
  def.posLessons = [{id:"pos", title: basic ? "詞性辨識：名詞、動詞、形容詞、副詞" : "詞性辨識：看字尾、看位置"}];
  def.classes = Object.assign({}, def.classes, {pos: basic ? POS_CLASS_BASIC : POS_CLASS_ADV});
  BUILTIN[id] = def;
  (unitWaiters[id] || []).forEach(f => f.ok(def));
  delete unitWaiters[id];
}
function loadUnit(id){
  if(BUILTIN[id]) return Promise.resolve(BUILTIN[id]);
  return new Promise((ok, fail) => {
    (unitWaiters[id] = unitWaiters[id] || []).push({ok, fail});
    if(document.querySelector(`script[data-unit="${id}"]`)) return;
    const sc = document.createElement("script");
    sc.src = "units/" + id + ".js"; sc.dataset.unit = id;
    sc.onerror = () => { sc.remove(); (unitWaiters[id] || []).forEach(f => f.fail(new Error("unit"))); delete unitWaiters[id]; };
    document.head.appendChild(sc);
  });
}

/* 語音選擇：每位學習者可自選英文、中文語音；自動選擇時避開會自動判斷語言的 Multilingual 語音 */
function voicePrefs(){ S.voicePref = S.voicePref || {}; return S.voicePref[S.current] || (S.voicePref[S.current] = {}); }
/* 推薦語音：選單只列這些（依好聽程度排序），Multilingual 會自己判斷語言、容易唸錯，一律不列 */
const VOICE_REC = {
  en: [
    [/\bAria\b.*Online/i, "Aria（美式・女聲）"], [/\bJenny\b.*Online/i, "Jenny（美式・女聲）"],
    [/\bGuy\b.*Online/i, "Guy（美式・男聲）"], [/\bChristopher\b.*Online/i, "Christopher（美式・男聲）"],
    [/\bSonia\b.*Online/i, "Sonia（英式・女聲）"], [/\bRyan\b.*Online/i, "Ryan（英式・男聲）"],
    [/^Google US English/i, "Google（美式）"], [/^Google UK English Female/i, "Google（英式・女聲）"],
    [/^Samantha/i, "Samantha（美式・女聲）"], [/^Daniel/i, "Daniel（英式・男聲）"],
    [/\bZira\b/i, "Zira（美式・女聲）"], [/\bDavid\b/i, "David（美式・男聲）"], [/\bMark\b/i, "Mark（美式・男聲）"], [/\bHazel\b/i, "Hazel（英式・女聲）"]],
  zh: [
    [/HsiaoChen.*Online/i, "曉臻 HsiaoChen（女聲）"], [/HsiaoYu.*Online/i, "曉雨 HsiaoYu（女聲）"], [/YunJhe.*Online/i, "雲哲 YunJhe（男聲）"],
    [/^Google 國語/i, "Google 國語（臺灣）"], [/Mei-?Jia/i, "美佳 Mei-Jia（女聲）"],
    [/Hanhan/i, "Hanhan（女聲）"], [/Yating/i, "Yating（女聲）"], [/Zhiwei/i, "Zhiwei（男聲）"]]
};
const isOnlineVoice = v => !!v && (v.localService === false || /online/i.test(v.name));
function recVoices(base){
  const okLang = base === "en" ? /^en[-_](us|gb)$/i : /^zh[-_]tw$/i;
  const pool = voices.filter(v => !/multilingual/i.test(v.name) && okLang.test(v.lang));
  const out = [];
  VOICE_REC[base].forEach(([re, label]) => { const v = pool.find(x => re.test(x.name) && !out.some(o => o.v === x)); if(v) out.push({v, label}); });
  // 手機等沒有上面這些語音的裝置：列出該語言前 6 個
  if(!out.length) pool.slice(0, 6).forEach(v => out.push({v, label: v.name.replace(/^Microsoft /, "").replace(/ - .*$/, "")}));
  return out;
}
/* 離線備援：線上語音沒網路時不會出聲，改用裝在本機的語音。
   判斷離線後 5 分鐘內都用本機語音；瀏覽器回報網路恢復就立刻換回。
   這台裝置沒有該語言的本機語音時不切換（切了也沒聲音）。 */
let voiceDownAt = 0;
const offlineNow = () => navigator.onLine === false || (voiceDownAt && Date.now() - voiceDownAt < 5 * 60 * 1000);
const hasLocalVoice = base => voices.some(v => !isOnlineVoice(v) && !/multilingual/i.test(v.name) && v.lang.toLowerCase().startsWith(base));
const voiceUsable = v => !isOnlineVoice(v) || !offlineNow() || !hasLocalVoice(v.lang.slice(0, 2).toLowerCase());
function voiceFailed(e, u){
  if(!e || e.error === "interrupted" || e.error === "canceled" || !isOnlineVoice(u.voice)) return false;
  if(!hasLocalVoice(u.voice.lang.slice(0, 2).toLowerCase())) return false;
  if(!offlineNow()) toast("目前離線，已改用本機語音");
  voiceDownAt = Date.now();
  return true;
}
window.addEventListener("online", () => { voiceDownAt = 0; });
/* 斷網時 Edge 的線上語音常常不出聲也不報錯（電腦仍以為有網路）：
   排進去後 6 秒都沒開始唸，就當作失敗。回傳的函式用來「開始計時」。 */
function watchStart(u, onStall){
  if(!isOnlineVoice(u.voice)) return () => {};
  let t = null;
  const clear = () => clearTimeout(t);
  ["start", "end", "error"].forEach(ev => u.addEventListener(ev, clear));
  const arm = () => { clear(); t = setTimeout(() => speechSynthesis.paused ? arm() : onStall(), 6000); };
  return arm;
}
function pickVoice(lang){
  const chosenBase = lang.split("-")[0];
  // 英文（美式）和中文：從推薦清單選；學習者選過且還在清單裡就用他選的，否則用清單第一個
  if(lang === "en-US" || chosenBase === "zh"){
    const list = recVoices(chosenBase).map(x => x.v).filter(voiceUsable);
    const chosen = voicePrefs()[chosenBase];
    const cv = chosen && list.find(x => x.name === chosen);
    if(cv || list.length) return cv || list[0];
  }
  const pref = v => (/multilingual/i.test(v.name) ? 10 : 0) + (/natural|online|google|neural/i.test(v.name) ? 0 : 1);
  const exact = voices.filter(v => voiceUsable(v) && v.lang.replace("_","-").toLowerCase() === lang.toLowerCase()).sort((a,b)=>pref(a)-pref(b));
  if(exact.length) return exact[0];
  const base = lang.split("-")[0];
  let cand = voices.filter(v => voiceUsable(v) && v.lang.toLowerCase().startsWith(base));
  if(base === "zh"){ const tw = cand.filter(v => /tw|hant|taiwan/i.test(v.lang + v.name)); if(tw.length) cand = tw; }
  return cand.sort((a,b)=>pref(a)-pref(b))[0] || null;
}
/* 老師講中文時：男老師改用男聲，並套用每位老師的音調 */
function applyVoice(u, lang){
  let v = pickVoice(lang);
  if(lang.startsWith("zh") && S && S.current){
    const T = curTeacher();
    if(T.gender === "m"){ const m = recVoices("zh").filter(x => /男聲/.test(x.label)).map(x => x.v).filter(voiceUsable)[0]; if(m) v = m; else u.pitch = .7; }
    if(T.pitch !== 1) u.pitch = T.pitch;
  }
  if(v) u.voice = v;
}
// 每次播放都有一個編號；被中斷的舊播放不會觸發 onDone
let speakToken = 0;
function speakQueue(items, hooks = {}){
  if(typeof narrStop === "function") narrStop();
  const my = ++speakToken;
  if(!("speechSynthesis" in window)){ toast("這個瀏覽器不支援語音播放"); return; }
  speechSynthesis.cancel();
  items = items.filter(([t]) => t && t.trim());
  if(!items.length){ hooks.onDone && hooks.onDone(); return; }
  const needPad = isShortEn(items[items.length - 1][0], items[items.length - 1][1]);
  let prev = null;
  items.forEach(([text, lang, rate], i) => {
    const u = new SpeechSynthesisUtterance(isShortEn(text, lang) ? text.trim() + "." : text);
    u.lang = lang;
    applyVoice(u, lang);
    u.rate = rate || (lang.startsWith("en") ? getSpeed().en : getSpeed().zh);
    if(i === 0) u.onstart = () => { if(my === speakToken && hooks.onStart) hooks.onStart(); };
    const end = () => { if(my === speakToken && hooks.onDone) hooks.onDone(); };
    const last = i === items.length - 1;
    if(last && !needPad) u.onend = end;
    // 線上語音出錯：從這一句起改用本機語音重唸
    u.onerror = e => { if(my !== speakToken) return; if(voiceFailed(e, u)) return speakQueue(items.slice(i), hooks); if(last && !needPad) end(); };
    // 第一句從現在開始計時；後面的句子等前一句唸完才開始計時
    const arm = watchStart(u, () => { if(my === speakToken && voiceFailed({error:"no-start"}, u)) speakQueue(items.slice(i), hooks); });
    if(prev) prev.addEventListener("end", arm); else arm();
    prev = u;
    speechSynthesis.speak(u);
    if(last && needPad){ const pad = padUtterance(lang); pad.onend = end; pad.onerror = end; speechSynthesis.speak(pad); }
  });
}

// 把老師的台詞拆成中文、英文片段；中文再依句號切短，避免瀏覽器唸太長的句子被截斷
function scriptToSpeech(text){
  const out = [];
  String(text).split(/(\{[^}]+\}|<<[^>]+>>)/).forEach(part => {
    if(!part) return;
    if(part.startsWith("<<")){ out.push([[...part.slice(2, -2)].join("、"), "zh-TW"]); return; }
    if(part.startsWith("{")) out.push([part.slice(1,-1), "en-US"]);
    else part.split(/(?<=[。！？])/).forEach(s => { if(s.replace(/[，。！？、\s]/g,"")) out.push([s, "zh-TW"]); });
  });
  return out;
}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200); }
function highlight(sentence, word){
  const safe = esc(sentence);
  let stem = word.toLowerCase();
  if(stem.length > 3 && stem.endsWith("y")) stem = stem.slice(0,-1);
  for(let cut = 0; cut <= Math.min(4, stem.length - 4); cut++){
    const st = cut ? stem.slice(0, -cut) : stem;
    const re = new RegExp("\\b(" + st.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "[a-z']*)", "i");
    if(re.test(safe)) return safe.replace(re, "<mark>$1</mark>");
  }
  return safe;
}

function voiceSelect(base, label, sample){

  const cur = pickVoice(base === "en" ? "en-US" : "zh-TW");

function updateVoiceInfo(){
  const el = $("#voiceInfo"); if(!el) return;

function progressLabel(id){
  const p = (S.progress[S.current] || {})[id];

/* ---------- 學習頁 ---------- */
/* 記住每位學習者上次看的單元和分頁，下次打開直接回到那裡 */
function rememberPlace(range, tab){
  S.lastPlace = S.lastPlace || {};
  const cur = S.lastPlace[S.current];
  if(cur && cur.range === range && cur.tab === tab) return;
  S.lastPlace[S.current] = {range, tab};
  save();
}
function resumeLast(){
  const lp = (S.lastPlace || {})[S.current];
  const ready = LEVELS.some(l => l.ranges.some(([id, , ok]) => ok && id === (lp && lp.range)));
  if(lp && (ready || S.custom[lp.range])) return openRange(lp.range, lp.tab);
  view = {screen:"home", range:null, tab:"map", flipped:false, quizAnswered:null, spokeFor:null};
  render();
}
function renderStudy(){
  const R = getRange(view.range);
  if(!R){ view.screen = "home"; return render(); }
  if(view.tab !== "boss") clearBossTimer();
  const tabs = [["map","🗺️ 闖關地圖"],["vocab","單字卡"]];
  if(!R.noSpell) tabs.push(["spell", (R.spellIcon || "🔤") + " " + (R.spellTitle || "拼字挑戰")]);
  if(R.words.some(w => POS_NAME[w.pos])) tabs.push(["posq", "🔎 詞性挑戰"]);

  if(R.quiz.length) tabs.push(["quiz", R.quizName || "文法測驗"]);

  if(view.tab !== "boss" && !tabs.some(t => t[0] === view.tab)) view.tab = "map";
  rememberPlace(view.range, view.tab === "boss" ? "map" : view.tab);
  app.innerHTML = `
    <div class="crumb"><button class="btn small" id="backHome">← 選範圍</button><b>${esc(R.name)}</b>${unitFavBtn(view.range)}</div>
    <div class="muted" style="font-size:13px;margin-top:4px">${esc(R.sub)}</div>

    <div id="pane"></div>`;
  if(view.tab === "map") renderMap(R);
  else if(view.tab === "boss") renderBoss(R);
  else if(view.tab === "vocab") renderVocab(R);
  else if(view.tab === "spell") renderSpell(R);
  else if(view.tab === "listen") renderListen(R);
  else if(view.tab === "posq") renderPosq(R);
  else if(view.tab === "grammar") renderGrammar(R);
  else renderQuiz(R);
}

/* ---------- 單字卡（SRS 間隔重複） ---------- */
function vocabState(R){
  const p = prog(view.range);
  if(!p.vocab || p.vocab.total !== R.words.length){
    p.vocab = {queue: R.words.map((_,i)=>i), total: R.words.length, stats:{again:0,hard:0,good:0,easy:0}, exIdx: (p.vocab && p.vocab.exIdx) || {}, seen:{}};
    save();
  }
  return p.vocab;
}
/* 學過的單字：依最後一次評分的順序（舊進度沒有紀錄時，用單元裡的順序） */
function seenList(v){ return (v.hist && v.hist.length) ? v.hist : Object.keys(v.seen || {}).map(Number).filter(id => v.seen[id]).sort((x, y) => x - y); }
function lastEx(R, v, id){ const n = Math.max(1, R.words[id].ex.length); return v && v.exIdx && v.exIdx[id] != null ? ((v.exIdx[id] - 1) % n + n) % n : 0; }   // 上次看到的那一個例句
function cardHtml(R, rangeId, id, k, o = {}){
  const w = R.words[id];
  const exs = w.ex.length ? w.ex : [["","",""]];
  k = k % exs.length;
  const [en, zh, note] = exs[k];
  return `<div class="flip ${view.flipped ? "is-flipped" : ""} ${view.enter ? "enter" : ""}" id="flip">
      <div class="flip-inner">
        <div class="face front card" id="card">
          <span class="flip-tag">${o.tag || ""}</span>${favBtn(rangeId, w.w)}
          <div class="word">${esc(w.w)}</div>
          <div>${spk("en", w.w, "發音")}</div>
          <div class="hint">想想看它的意思，再按空白鍵或點卡片翻面</div>
        </div>
        <div class="face back card">${favBtn(rangeId, w.w)}
          <div class="back-top">
            <div class="illus">${wordArt(w)}<span class="spark-fx" style="left:-6px;top:4px">✨</span><span class="spark-fx" style="right:-6px;top:34%">⭐</span><span class="spark-fx" style="left:44%;bottom:-10px">✨</span></div>
            <div style="flex:1;min-width:190px">
              <div class="wordline"><span class="word">${esc(w.w)}</span><span class="pos">${esc(w.pos)}</span>${spk("en", w.w, "")}</div>
              <div class="zh" style="margin-bottom:6px">${esc(w.zh)}</div>
              ${w.memo ? `<div class="memo"><div><span class="lbl">${R.memoLabel || "💡 記憶小提示"}</span>${memoHtml(w.memo)}</div>${spk("zh", w.memo, "")}</div>` : ""}
            </div>
          </div>
          ${R.morph ? morphRow(w) : phonicsRow(w)}
          ${en ? `<div class="ex" style="margin-top:12px">
            <div class="ex-head"><span>例句 ${k+1} / ${exs.length}${o.exExtra || ""}</span></div>
            <div class="en"><span>${highlight(en, w.w)}</span>${spk("en", en, "")}</div>
            <div class="ex-zh">${esc(zh)}</div>
            ${note ? `<div class="note"><div><span class="lbl">文法說明</span>${esc(note)}</div>${spk("zh", note, "說明")}</div>` : ""}
          </div>` : ""}
        </div>
      </div>
    </div>
    <div class="flipbar ${view.flipped ? "gone" : ""}" id="flipbar"><button class="btn primary" id="flipBtn">👆 翻面看答案</button></div>`;
}
function vocabNav(R, v){
  const L = seenList(v); if(!L.length && !favCount(view.range)) return "";
  const p = view.peek;
  if(!L.length) return `<div class="cardnav">${unitFavBtn(view.range, true)}</div>`;
  return `<div class="cardnav">
    <button class="btn small" id="vPrev" ${p === 0 ? "disabled" : ""}>◀ 上一張</button>
    <select id="vJump" aria-label="跳到學過的單字"><option value="">📚 學過的單字（${L.length}）</option>${L.map((id, i) => `<option value="${i}" ${p === i ? "selected" : ""}>${esc(R.words[id].w)}　${esc(R.words[id].zh)}</option>`).join("")}</select>
    ${p != null ? `<button class="btn small" id="vNext">${p >= L.length - 1 ? "回到目前進度 ▶" : "下一張 ▶"}</button>` : ""}
    ${unitFavBtn(view.range, true)}
  </div>`;
}
/* 翻閱學過的單字：只看不評分，不會改變複習順序；i = null 回到目前進度 */
function vocabPeek(i){
  const L = seenList(vocabState(getRange(view.range)));
  stopSpeak(); view.flipped = false; view.spokeFor = null; view.enter = true;
  view.peek = (i == null || i < 0 || i >= L.length) ? null : i;
  renderStudy();
}
function vocabPrev(){ const L = seenList(vocabState(getRange(view.range))); if(!L.length) return; vocabPeek(view.peek == null ? L.length - 1 : Math.max(0, view.peek - 1)); }
function vocabNext(){ if(view.peek != null) vocabPeek(view.peek + 1); }
function speakFront(key, word){ if(!view.flipped && S.settings.autoSpeak && view.spokeFor !== key){ view.spokeFor = key; sayEn(word); } }
function renderVocab(R){
  const v = vocabState(R);
  const pane = $("#pane");
  const L = seenList(v);
  if(view.peek != null && !(view.peek < L.length)) view.peek = null;
  const doneCount = v.total - v.queue.length;
  const header = `<div class="prog"><span>剩 ${v.queue.length} / ${v.total}</span>
    <div class="track"><div class="fill" style="width:${v.total ? doneCount / v.total * 100 : 0}%"></div></div>
    <div class="chips"><span class="chip" style="color:var(--again)">Again ${v.stats.again}</span><span class="chip" style="color:var(--hard)">Hard ${v.stats.hard}</span><span class="chip" style="color:var(--good)">Good ${v.stats.good}</span><span class="chip" style="color:var(--easy)">Easy ${v.stats.easy}</span></div></div>`;
  if(view.peek != null){
    const id = L[view.peek];
    pane.innerHTML = header + vocabNav(R, v) + cardHtml(R, view.range, id, lastEx(R, v, id), {tag: `👀 學過的第 ${view.peek + 1} / ${L.length} 個`})
      + `<div class="peekbar">翻閱學過的單字，不會影響複習進度 <button class="btn small primary" id="vBack">回到目前進度 ▶</button></div>
      <div class="keys">鍵盤：空白鍵 翻面・← 上一張・→ 下一張</div>`;
    view.enter = false;
    speakFront("p" + id, R.words[id].w);
    return;
  }
  if(v.queue.length === 0){
    pane.innerHTML = header + vocabNav(R, v) + `<div class="card done"><div class="big">🎉</div><h2 style="margin:6px 0">這個範圍的單字都記住了！</h2>
      <div class="stats">${["again","hard","good","easy"].map(k => `<div class="stat"><b style="color:var(--${k})">${v.stats[k]}</b>${k[0].toUpperCase()+k.slice(1)}</div>`).join("")}</div>
      <div style="font-size:28px;color:#f5b301">${starText(starsOf(view.range, "vocab"))}</div>
      <p class="muted">Again 按得越少，星星越多。考前可以再從頭複習一輪，例句會換成你還沒看過的那一句。</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-tab="map">回闖關地圖</button>
        <button class="btn" id="vocabRestart">重新複習一輪</button>
        ${R.quiz.length ? `<button class="btn" data-tab="quiz">去做文法測驗</button>` : ""}
      </div></div>`;
    return;
  }
  const id = v.queue[0];
  const seen = v.seen[id] || 0;
  pane.innerHTML = header + vocabNav(R, v) + cardHtml(R, view.range, id, v.exIdx[id] || 0, {tag: seen ? `第 ${seen + 1} 次見面` : "新卡片", exExtra: seen ? `（第 ${seen+1} 次看到這個字，換一個例句）` : ""}) + `
    <div class="rates ${view.flipped ? "" : "wait"}" id="rates">
      <button class="rate again" data-rate="again">Again<small>完全不會</small><kbd>1</kbd></button>
      <button class="rate hard" data-rate="hard">Hard<small>有點難</small><kbd>2</kbd></button>
      <button class="rate good" data-rate="good">Good<small>想得起來</small><kbd>3</kbd></button>
      <button class="rate easy" data-rate="easy">Easy<small>已經記住</small><kbd>4</kbd></button>
    </div>
    <div class="keys">鍵盤：空白鍵 翻面・1 Again・2 Hard・3 Good・4 Easy${L.length ? "・← 上一張" : ""}</div>`;
  view.enter = false;
  speakFront("f" + id, R.words[id].w);
}

/* ---------- 重點裡的片語：點了跳出例句 ---------- */
let phraseRe = null, phraseN = 0;
function memoHtml(t){
  const keys = Object.keys(PHRASES);
  if(!keys.length) return esc(t);
  if(keys.length !== phraseN){   // 載入新單元後重建
    phraseN = keys.length;
    phraseRe = new RegExp(keys.sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  }
  let out = "", last = 0;
  t.replace(phraseRe, (m, i) => {
    if(/[A-Za-z]/.test(t[i - 1] || "") || /[A-Za-z]/.test(t[i + m.length] || "")) return m;   // 只比對完整的字
    out += esc(t.slice(last, i)) + `<button class="phr" data-phr="${esc(m)}">${esc(m)}</button>`;
    last = i + m.length; return m;
  });
  return out + esc(t.slice(last));
}
function openPhrase(key){
  const list = PHRASES[key]; if(!list) return;
  stopSpeak();
  const d = $("#phraseDlg");
  d.innerHTML = `<div class="phr-box">${list.map(([p, zh, en, enZh]) => `<div class="phr-item">
      <div class="phr-head"><b>${esc(p)}</b>${spk("en", p.replace(/\s*\+.*$/, ""), "")}</div>
      <div class="muted">${esc(zh)}</div>
      <div class="phr-ex"><div class="en"><span>${esc(en)}</span>${spk("en", en, "")}</div><div class="ex-zh">${esc(enZh)}</div></div>
    </div>`).join("")}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-phrclose="1">知道了</button></div></div>`;
  d.showModal();
}

/* ---------- 珍藏：每位學習者各自一份 [[單元 id, 單字], ...] ---------- */
function favs(){ S.fav = S.fav || {}; return S.fav[S.current] || (S.fav[S.current] = []); }
function isFav(r, w){ return favs().some(f => f[0] === r && f[1] === w); }
function favBtn(r, w){
  if(!r) return "";
  const on = isFav(r, w);
  return `<button class="fav-btn ${on ? "on" : ""}" data-favr="${esc(r)}" data-favw="${esc(w)}" title="${on ? "取消珍藏" : "加入珍藏"}" aria-pressed="${on}">${on ? "❤️" : "🤍"}</button>`;
}
function toggleFav(r, w){
  const L = favs(), i = L.findIndex(f => f[0] === r && f[1] === w), on = i < 0;
  if(on) L.push([r, w]); else L.splice(i, 1);
  save();
  document.querySelectorAll(".fav-btn").forEach(b => {
    if(b.dataset.favr !== r || b.dataset.favw !== w) return;
    b.classList.toggle("on", on); b.textContent = on ? "❤️" : "🤍";
    b.title = on ? "取消珍藏" : "加入珍藏"; b.setAttribute("aria-pressed", on);
  });
  toast(on ? "已加入珍藏 ❤️" : "已移出珍藏");
}
/* 單元裡的「本單元珍藏」入口：進入只含這個單元的珍藏頁 */
function favCount(r){ return favs().filter(f => f[0] === r).length; }
function unitFavBtn(r, inline){
  if(!r) return "";
  const n = favCount(r);
  return `<button class="btn small" data-favunit="${esc(r)}" style="${inline ? "" : "margin-left:auto"}">❤️ 本單元珍藏${n ? `（${n}）` : ""}</button>`;
}
async function openFav(unit){
  stopSpeak();
  const from = unit ? (view.tab === "boss" ? "map" : view.tab) : null;   // 從單元進來的，返回時回到原本的分頁

function burstStars(el){
  const r = el.getBoundingClientRect();
  for(let i = 0; i < 8; i++){
    const b = document.createElement("span"); b.className = "burst"; b.textContent = i % 2 ? "✨" : "⭐";
    const a = Math.PI * 2 * i / 8;
    b.style.left = (r.left + r.width / 2) + "px"; b.style.top = (r.top + Math.min(r.height / 2, 160)) + "px";
    b.style.setProperty("--dx", Math.round(Math.cos(a) * 110) + "px"); b.style.setProperty("--dy", Math.round(Math.sin(a) * 90) + "px");
    $("#fx").appendChild(b); setTimeout(() => b.remove(), 850);

function rate(kind){
  const R = getRange(view.range); const v = vocabState(R);
  if(!v.queue.length) return;
  const id = v.queue.shift();
  v.stats[kind]++;
  // 每次評分後換下一個例句，下次出現時從不同角度說明
  const n = Math.max(1, R.words[id].ex.length);
  v.exIdx[id] = ((v.exIdx[id] || 0) + 1) % n;
  v.seen[id] = (v.seen[id] || 0) + 1;
  v.hist = seenList(v).filter(x => x !== id); v.hist.push(id);
  if(kind === "again") v.queue.splice(Math.min(1, v.queue.length), 0, id);       // 下一張之後馬上再出現
  else if(kind === "hard") v.queue.splice(Math.ceil(v.queue.length / 2), 0, id);  // 排到中間
  else if(kind === "good") v.queue.push(id);                                       // 排到最後
  // easy：從這一輪移除
  save();
  gainXP({again:2, hard:3, good:4, easy:5}[kind]); addDaily("cards");

}

}

    save();
  }
  return p.quiz;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuiz(R){
  const q = quizState(R);

  const finished = R.quiz.length - q.queue.length;
  const header = `<div class="prog"><span>剩 ${q.queue.length} 題</span><div class="track"><div class="fill" style="width:${finished/q.total*100}%"></div></div>

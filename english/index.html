      <p class="muted">${pct>=80 ? "很棒！段考前再做一次確認就好。" : "答錯比較多的文法，建議回到「文法教室」再讀一次。"}</p>
      <div style="font-size:28px;color:#f5b301">${starText(starsOf(view.range, "quiz"))}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" data-tab="map">回闖關地圖</button><button class="btn" id="quizRestart">重新測驗</button><button class="btn" data-tab="grammar">回文法教室</button></div></div>`;
    return;
  }
  const qi = q.queue[0];
  const [text, opts, ans, exp, gid] = R.quiz[qi];
  const a = view.quizAnswered;
  const g = R.grammar.find(x => x.id === gid);
  pane.innerHTML = header + `<div class="card">
    <div class="muted" style="font-size:13px">${g ? esc(g.title) : ""}${q.tried[qi] ? "・再試一次" : ""}</div>
    <div class="q">${esc(text)}</div>
    <div class="opts">${opts.map((o,i) => {
      const gone = a === null && view.qHelp && view.qHelp.qi === qi && view.qHelp.removed.includes(i);
      let cls = gone ? "gone" : ""; if(a !== null){ if(i === ans) cls = "right"; else if(i === a) cls = "wrong"; }
      return `<button class="opt ${cls}" data-ans="${i}" ${a!==null || gone?"disabled":""}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>
    ${a === null ? quizToolsHtml(R, qi) : ""}
    ${a !== null ? `<div class="fb ${a===ans?"ok":"bad"}" style="display:flex;gap:10px;align-items:flex-start">${teacherSvg(a === ans ? (combo >= 3 ? "star" : "happy") : "oops", "", "tch-sm")}<div style="flex:1">
      <div class="fb-head"><span>${a===ans ? (combo >= 3 ? `✓ ${combo} 連擊！太神啦！` : "✓ 答對了！") : "✗ 正確答案是：" + esc(opts[ans])}</span>${spk("zh", exp, "聽解析")}</div>
      <div>${esc(exp)}</div></div></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px">${a!==ans && g ? `<button class="btn" data-lessonjump="${gid}">看這個文法</button>` : ""}<button class="btn primary" id="nextQ">下一題 →</button></div>` : ""}
  </div>
  <div class="keys">鍵盤：1–4 選答案・Enter 或空白鍵 下一題</div>`;
}
function answer(i){
  const R = getRange(view.range); const q = quizState(R);
  if(view.quizAnswered !== null || !q.queue.length) return;
  const qi = q.queue[0]; const ans = R.quiz[qi][2];
  const h = view.qHelp && view.qHelp.qi === qi ? view.qHelp : null;
  if(h && h.removed.includes(i)) return;
  view.quizAnswered = i;
  if(i === ans){ onCorrect(); gainXP(q.tried[qi] || (h && h.sos) ? 5 : 10, true); if(!q.tried[qi]) q.firstRight++; }
  else { onWrong(); q.wrong++; if(S.settings.autoSpeak) sayZh(R.quiz[qi][3]); }
  q.tried[qi] = true;
  save(); renderStudy();
}
function nextQ(){
  const R = getRange(view.range); const q = quizState(R);
  if(view.quizAnswered === null) return;
  const qi = q.queue.shift();
  if(view.quizAnswered !== R.quiz[qi][2]) q.queue.push(qi);   // 答錯：排到最後再考一次
  view.quizAnswered = null; view.qHelp = null; stopSpeak(); save(); renderStudy();
  if(!q.queue.length) finishQuiz(q);
}

/* =========================================================
   CSV 匯入
   欄位：word,pos,zh,ex1,ex1_zh,ex1_note,ex2,ex2_zh,ex2_note,ex3,ex3_zh,ex3_note
   ========================================================= */
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function decode(buf){
  try{ return new TextDecoder("utf-8", {fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder("big5").decode(buf); }catch(e2){ return new TextDecoder().decode(buf); } }
}
async function importCSV(file){
  const text = decode(await file.arrayBuffer()).replace(/^﻿/, "");
  const rows = parseCSV(text);
  if(rows.length < 2){ toast("檔案裡沒有資料"); return; }
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  if(col("word") < 0 || col("zh") < 0){ toast("找不到 word 和 zh 欄位，請參考範例 CSV 的格式"); return; }
  const words = rows.slice(1).map(r => {
    const g = n => (col(n) >= 0 ? (r[col(n)] || "").trim() : "");
    const ex = [1,2,3].map(k => [g("ex"+k), g("ex"+k+"_zh"), g("ex"+k+"_note")]).filter(e => e[0]);
    return {w:g("word"), pos:g("pos"), zh:g("zh"), ex, img:g("img"), memo:g("memo")};
  }).filter(w => w.w);
  if(!words.length){ toast("沒有讀到任何單字"); return; }
  const id = "custom-" + Date.now();
  S.custom[id] = {name: file.name.replace(/\.csv$/i, ""), words};
  save(); toast(`已匯入 ${words.length} 個單字`); render();
}
async function downloadSample(){
  const head = "word,pos,zh,ex1,ex1_zh,ex1_note,ex2,ex2_zh,ex2_note,ex3,ex3_zh,ex3_note,img,memo";

  $("#sampleText").value = head + "\n" + lines.join("\n");

}

let combo = 0;   // 連擊只在這次打開時計算

function G(){
  S.game = S.game || {};
  const g = S.game[S.current] || (S.game[S.current] = {});
  Object.assign(g, Object.assign({xp:0, streak:{days:0, last:null}, daily:{date:null}, badges:{}, stars:{}, bestCombo:0, coins:0, box:{}, equip:{}, items:{}}, g));

}
const pad = n => String(n).padStart(2, "0");
const dayStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dayStr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); };
const needXp = L => 50 * L * (L - 1);              // Lv.2 要 100、Lv.3 要 300、Lv.4 要 600……
function levelOf(xp){ let L = 1; while(xp >= needXp(L + 1)) L++; return L; }
function titleOf(L){ let t = TITLES[0][1]; TITLES.forEach(([n, name]) => { if(L >= n) t = name; }); return t; }
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayStr(d); };
function streakNow(){
  const g = G(), s = g.streak;
  if(s.last === today() || s.last === yesterday()) return s.days;
  return (s.last === daysAgo(2) && (g.items.shield || 0) > 0) ? s.days : 0;   // 只漏一天、有保護卡：還算連續
}
function dailyNow(){ const g = G(); if(g.daily.date !== today()) g.daily = {date:today(), cards:0, lessons:0, right:0, claimed:false}; return g.daily; }

function touchDay(){
  const g = G(); dailyNow();
  if(g.streak.last !== today()){
    const shielded = g.streak.last === daysAgo(2) && (g.items.shield || 0) > 0;
    if(shielded){ g.items.shield--; setTimeout(() => banner("🛡️ 連勝保護卡生效", "昨天沒來，連續天數保住了！"), 600); }
    g.streak.days = (g.streak.last === yesterday() || shielded) ? g.streak.days + 1 : 1;
    g.streak.last = today();
    if(g.streak.days >= 3) award("streak3");
    if(g.streak.days >= 7) award("streak7");
  }
}
const callName = (suffix = "，") => (S.current && S.current !== "我") ? S.current + suffix : "";
const comboMult = () => combo >= 10 ? 3 : combo >= 5 ? 2 : combo >= 3 ? 1.5 : 1;
function gainXP(n, useCombo){
  const g = G(); touchDay();
  const amt = Math.round(n * (useCombo ? comboMult() : 1));
  const before = levelOf(g.xp);
  g.xp += amt;
  const coin = Math.max(1, Math.round(amt / COIN_PER_XP));
  g.coins = (g.coins || 0) + coin;
  award("first_step");
  floatXP(`+${amt} XP　+${coin} 🪙`);
  const after = levelOf(g.xp);
  if(after > before){
    banner("LEVEL UP!", `Lv.${after}・${titleOf(after)}`); sfx("level"); confetti(140);
    if(after >= 5) award("level5");
    if(after >= 10) award("level10");
  }
  save(); updateHUD();
  return amt;
}
function onCorrect(){
  const g = G();
  combo++;
  if(combo > g.bestCombo) g.bestCombo = combo;
  sfx("correct");
  if(combo === 3 || combo === 5 || combo === 10 || (combo > 10 && combo % 5 === 0)){
    banner(`${combo} 連擊！`, `經驗值 ×${comboMult()}`, "combo"); sfx("combo");
  }
  if(combo >= 5) award("combo5");
  if(combo >= 10) award("combo10");

}
function onWrong(){ combo = 0; sfx("wrong"); }
function addDaily(k){

  }

function award(id){

/* ---------- 音效（即時產生，不需要音檔） ---------- */
let actx = null;
function tone(f, start, dur, type = "sine", vol = .12){
  const t0 = actx.currentTime + start;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(gn).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function sfx(kind){
  if(S.settings.sfx === false) return;
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === "suspended") actx.resume(); }catch(e){ return; }
  const up = Math.min(combo, 12) * 25;
  if(kind === "correct"){ tone(660 + up, 0, .12, "triangle"); tone(880 + up, .09, .18, "triangle"); }
  else if(kind === "wrong"){ tone(220, 0, .18, "square", .06); tone(160, .14, .25, "square", .06); }
  else if(kind === "combo"){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .07, .16, "triangle", .1)); }
  else if(kind === "level"){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .1, .3, "triangle", .1)); }
  else if(kind === "badge"){ [1319, 1568, 2093].forEach((f, i) => tone(f, i * .08, .25, "sine", .08)); }
  else if(kind === "hit"){ tone(180, 0, .12, "sawtooth", .1); tone(90, .05, .2, "square", .08); }
  else if(kind === "flip"){
    const t0 = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(320, t0); o.frequency.exponentialRampToValueAtTime(950, t0 + .14);
    gn.gain.setValueAtTime(.06, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + .2);
    o.connect(gn).connect(actx.destination); o.start(t0); o.stop(t0 + .22);
  }
  else if(kind === "lose"){ [392, 330, 262].forEach((f, i) => tone(f, i * .18, .3, "triangle", .1)); }
}

function confetti(n = 120){
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#ff7eb8","#8b5cf6","#ffd23f","#34d399","#60a5fa","#ff8a4c"];
  const ps = Array.from({length:n}, () => ({x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: colors[Math.random() * colors.length | 0], a: Math.random() * 6, va: (Math.random() - .5) * .4}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if(t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

function stageProgress(R, s){

  if(s.id === "vocab"){

  }

function openStage(id){

let bossTimer = null;

}
function bossPool(R){
  const qs = (R.quiz || []).map(([q, opts, ans, exp]) => ({q, opts, ans, exp}));
  const W = R.words, vq = [];
  if(W.length >= 4){
    shuffle(W.map((_, i) => i)).slice(0, Math.min(12, W.length)).forEach((wi, k) => {
      const w = W[wi];
      const others = shuffle(W.map((_, i) => i).filter(i => i !== wi && W[i].zh !== w.zh && W[i].w !== w.w)).slice(0, 3);
      if(others.length < 3) return;
      if(k % 2 === 0){ const opts = shuffle([w.w, ...others.map(i => W[i].w)]); vq.push({q:`「${w.zh}」的英文是？`, opts, ans:opts.indexOf(w.w), exp:`${w.w}（${w.pos}）＝${w.zh}`}); }
      else{ const opts = shuffle([w.zh, ...others.map(i => W[i].zh)]); vq.push({q:`${w.w} 的意思是？`, opts, ans:opts.indexOf(w.zh), exp:`${w.w}（${w.pos}）＝${w.zh}`}); }
    });
  }
  return shuffle(qs.concat(vq));
}
function startBoss(){
  const R = getRange(view.range);
  const pool = bossPool(R);
  if(pool.length < 4){ toast("題目不夠，至少需要 4 個單字才能挑戰魔王"); return; }
  stopSpeak();
  view.tab = "boss";
  const g = G(), extra = (g.items.heart || 0) > 0 ? 1 : 0;
  if(extra){ g.items.heart--; save(); }
  view.boss = {hp:100, hearts:5 + extra, max:5 + extra, pool, idx:0, picked:null, result:null, lost:0, state:"normal", mood:"normal", removed:[], frozen:false, line:extra ? "使用了愛心 +1！段考魔王出現了，答對就能攻擊它！" : "段考魔王出現了！答對就能攻擊它，連擊越多傷害越高！", fx:null};
  renderStudy(); startBossTimer();
}
function clearBossTimer(){ if(bossTimer){ clearInterval(bossTimer); bossTimer = null; } }
function startBossTimer(){
  clearBossTimer();
  const b = view.boss; b.deadline = Date.now() + BOSS_TIME * 1000;
  bossTimer = setInterval(() => {
    if(view.tab !== "boss" || view.boss !== b || b.picked !== null || b.result){ clearBossTimer(); return; }
    const left = (b.deadline - Date.now()) / 1000;
    const bar = $("#btimer"); if(bar){ bar.style.width = Math.max(0, left / BOSS_TIME * 100) + "%"; bar.style.background = left < 5 ? "#ff6b6b" : "#7dd3fc"; }
    const sec = $("#bsec"); if(sec) sec.textContent = Math.max(0, Math.ceil(left));

  }, 100);
}
function bossAnswer(k){
  const b = view.boss; if(!b || b.picked !== null || b.result) return;
  if(k >= 0 && b.removed && b.removed.includes(k)) return;
  clearBossTimer();
  const q = b.pool[b.idx % b.pool.length];
  b.picked = k;
  if(k === q.ans){
    onCorrect();
    const dmg = Math.round(10 * (combo >= 5 ? 2 : combo >= 3 ? 1.5 : 1));
    b.hp = Math.max(0, b.hp - dmg);
    b.fx = {dmg, crit: combo >= 3};
    b.state = b.hp === 0 ? "dead" : "hurt";
    b.mood = combo >= 3 ? "star" : "happy";
    b.line = b.hp === 0 ? "魔王倒下了！你太強了！" : combo >= 3 ? `${combo} 連擊！暴擊傷害 ${dmg}！` : "打中了！繼續保持！";
    sfx("hit"); gainXP(10, true);
    renderStudy();
    setTimeout(() => { if(view.boss === b && view.tab === "boss") bossNext(); }, b.hp === 0 ? 1300 : 1000);
  }else{
    onWrong();
    b.hearts--; b.lost++; b.fx = null; b.state = "normal"; b.mood = "oops";
    b.line = k === -1 ? "時間到了！魔王反擊！" : "被魔王反擊了！看一下解析再繼續。";
    shakeScreen(); renderStudy();
  }
}
function bossNext(){
  const b = view.boss; if(!b || b.picked === null) return;
  if(b.hp === 0) return finishBoss(true);
  if(b.hearts <= 0) return finishBoss(false);
  b.idx++; b.picked = null; b.state = "normal"; b.mood = "normal"; b.fx = null; b.line = "下一題！"; b.removed = []; b.frozen = false; b.deadline = null;

  renderStudy(); startBossTimer();
}

const DAILY_CHANCE = {hint:3, sos:1, freeze:1};

function lookOf(it){
  if(it.slot === "teacher") return {teacher:it.val};
  return {teacher:"anan", [it.slot]:it.val};
}
const ownedItem = id => !!G().box.owned[id];
function chances(){ const g = G(); if(!g.chance || g.chance.date !== today()) g.chance = Object.assign({date:today()}, DAILY_CHANCE); return g.chance; }
const hintLeft = () => chances().hint + (G().items.hint || 0);
function spendHint(){
  const c = chances(), g = G();
  if(c.hint > 0) c.hint--; else if(g.items.hint > 0) g.items.hint--; else return false;
  save(); return true;
}
function freeDrawNeed(){ const d = dailyNow(); return Math.max(0, 5 - Math.max(d.cards || 0, d.right || 0)); }
const freeDrawReady = () => G().box.freeDate !== today() && freeDrawNeed() === 0;
function goldReady(){ const g = G(); return g.streak.last === today() && g.streak.days > 0 && g.streak.days % 7 === 0 && g.box.goldDate !== today(); }
const boxReady = () => freeDrawReady() || goldReady();

function rollRarity(rate){
  let x = Math.random() * 100;
  for(const k of ["SSR", "SR", "R", "N"]){ if(x < rate[k]) return k; x -= rate[k]; }
  return "R";
}
function drawBox(kind){
  const g = G(), b = g.box;
  if(view.draw) return;
  if(kind === "free"){ if(!freeDrawReady()) return; b.freeDate = today(); }
  else if(kind === "gold"){ if(!goldReady()) return; b.goldDate = today(); }
  else{ if(g.coins < DRAW_COST){ toast(`金幣不夠，還差 ${DRAW_COST - g.coins} 🪙`); return; } g.coins -= DRAW_COST; }
  let r = rollRarity(kind === "gold" ? GOLD_RATE : BOX_RATE);
  if(b.pity >= PITY - 1 && (r === "N" || r === "R")) r = Math.random() < 1 / 6 ? "SSR" : "SR";   // 保底
  b.pity = (r === "SR" || r === "SSR") ? 0 : b.pity + 1;
  b.draws = (b.draws || 0) + 1;
  const pool = BOX_ITEMS.filter(x => x.r === r);
  const it = pool[Math.floor(Math.random() * pool.length)];
  const dup = !!b.owned[it.id];
  if(dup) g.coins += RARITY[r].refund; else b.owned[it.id] = today();
  save(); updateHUD();
  const d = view.draw = {item:it, dup, phase:"shake", gold:kind === "gold"};
  sfx("combo"); renderBox();
  setTimeout(() => {
    if(view.draw !== d) return;
    d.phase = "open"; renderBox();
    if(r === "SR" || r === "SSR"){ confetti(180); sfx("level"); } else sfx("badge");
  }, 1300);
}
function equipItem(slot, val){
  const e = G().equip;
  e[slot] = val || null;
  if(slot !== "teacher") e.teacher = "anan";      // 換安安的髮色、造型、配件時，順便換回安安老師
  save(); updateHUD();
  if(slot === "teacher"){ const T = curTeacher(); toast(`${T.name}來幫你上課了！`); sayZh(T.greet); }
  else toast("已換上");
  renderBox();
}
function buyItem(id){
  const it = SHOP.find(x => x.id === id), g = G(); if(!it) return;
  if((g.items[id] || 0) + it.qty > it.max){ toast("已經存到上限了，先用掉再買"); return; }
  if(g.coins < it.price){ toast(`金幣不夠，還差 ${it.price - g.coins} 🪙`); return; }
  g.coins -= it.price; g.items[id] = (g.items[id] || 0) + it.qty;
  save(); updateHUD(); sfx("badge"); toast(`買到了：${it.name}`); renderBox();
}
function openBoxScreen(tab){
  stopSpeak();
  view = {screen:"box", range:null, tab:"map", flipped:false, quizAnswered:null, spokeFor:null, boxTab:tab || "draw"};
  window.scrollTo(0, 0); render();
}

function renderBox(){
  const g = G(), tab = view.boxTab || "draw";
  const tabs = [["draw", "🎁 盲盒"], ["shop", "🛒 商店"], ["closet", "👗 我的收藏"]];
  const body = tab === "shop" ? boxShopHtml(g) : tab === "closet" ? boxClosetHtml(g) : boxDrawHtml(g);
  app.innerHTML = `
    <div class="crumb"><button class="btn small" id="backHome">← 回首頁</button><b>盲盒・商店</b><span class="coins-big">🪙 ${g.coins}</span></div>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${tab === k ? "on" : ""}" data-boxtab="${k}">${n}${k === "draw" && boxReady() ? " 🔴" : ""}</button>`).join("")}</div>
    ${body}`;
}
function boxDrawHtml(g){
  const b = g.box, d = view.draw;
  if(d && d.phase === "shake")
    return `<div class="card draw-stage"><div class="giftbox shake ${d.gold ? "gold" : ""}">🎁</div><div class="muted">盲盒打開中⋯⋯</div></div>`;
  if(d){
    const it = d.item, R = RARITY[it.r], slotOk = it.slot === "teacher" ? true : true;
    const isOn = it.slot === "teacher" ? curLook().teacher === it.val : curLook().teacher === "anan" && g.equip[it.slot] === it.val;
    return `<div class="card draw-stage">
      <div class="reveal r-${it.r}" style="--rc:${R.color}">
        <span class="rlabel" style="background:${R.color}">${R.name}・${SLOT_NAME[it.slot]}</span>
        ${teacherSvg("star", "", "tch-big", lookOf(it))}
        <div class="rname">${esc(it.name)}</div>
        <div class="muted" style="font-size:13px">${esc(it.desc)}</div>
        ${d.dup ? `<div class="dupnote">已經有了，換成 ${R.refund} 🪙</div>` : `<div class="newtag">NEW！</div>`}
      </div>
      <div class="row" style="justify-content:center;margin-top:14px">
        ${slotOk && !isOn ? `<button class="btn primary" data-equip="${it.slot}:${it.val}">馬上換上</button>` : ""}
        <button class="btn" id="drawDone">繼續</button></div></div>`;
  }
  const need = freeDrawNeed(), usedFree = b.freeDate === today();
  const rows = ["N", "R", "SR", "SSR"].map(k => `<tr><td><b style="color:${RARITY[k].color}">${RARITY[k].name}</b></td><td>${BOX_RATE[k]}%</td><td>${GOLD_RATE[k]}%</td><td>${BOX_ITEMS.filter(x => x.r === k).map(x => esc(x.name)).join("、")}</td></tr>`).join("");
  return `<div class="card draw-card">
      <div class="giftbox idle">🎁</div>
      <div class="draw-btns">
        <button class="btn primary" data-draw="free" ${freeDrawReady() ? "" : "disabled"}>🎁 每日免費抽${usedFree ? "（今天抽過了，明天再來）" : need ? `（再複習 ${need} 張單字卡，或再答對 ${need} 題）` : ""}</button>
        ${goldReady() ? `<button class="btn gold" data-draw="gold">🌟 連續 ${g.streak.days} 天大禮：金色盲盒</button>` : ""}
        <button class="btn" data-draw="coin" ${g.coins >= DRAW_COST ? "" : "disabled"}>🪙 ${DRAW_COST} 金幣抽一次${g.coins >= DRAW_COST ? "" : `（還差 ${DRAW_COST - g.coins}）`}</button>
      </div>
      <div class="muted" style="font-size:13px">再抽 ${PITY - b.pity} 次內，一定會抽到「超稀有」以上・每連續學習 7 天送一顆金色盲盒</div>
    </div>
    <h2>機率公開</h2>
    <div class="card odds"><div class="tscroll"><table><tr><th>稀有度</th><th>一般盲盒</th><th>金色盲盒</th><th>可能抽到</th></tr>${rows}</table></div>
      <p class="muted" style="font-size:13px;margin:8px 0 0">金幣只能靠學習取得，每得到 ${COIN_PER_XP} 點經驗值就有 1 枚金幣。抽到已經有的東西，會自動換成金幣（普通 10、稀有 30、超稀有 80、傳說 150）。</p></div>`;
}
function boxShopHtml(g){
  const c = chances();
  return `<div class="card">
      <b>今天的免費機會</b>（每天重新補滿，沒用完不會累積）
      <div class="chance-row"><span>💡 提示 ${c.hint}/${DAILY_CHANCE.hint}</span><span>🆘 求救老師 ${c.sos}/${DAILY_CHANCE.sos}</span><span>⏸️ 魔王戰暫停時間 ${c.freeze}/${DAILY_CHANCE.freeze}</span></div>
      <div class="muted" style="font-size:13px">在「Part 5 練習」、「文法測驗」和魔王戰的題目下方使用。</div></div>
    <h2>用金幣兌換</h2>
    <div class="shop-grid">${SHOP.map(it => { const have = g.items[it.id] || 0; return `<div class="card shop-item">
      <div class="shop-ic">${it.icon}</div><div style="flex:1;min-width:0"><b>${esc(it.name)}</b><div class="muted" style="font-size:13px">${esc(it.desc)}</div><div style="font-size:13px">目前有 ${have} 個</div></div>
      <button class="btn small primary" data-buy="${it.id}" ${g.coins >= it.price && have + it.qty <= it.max ? "" : "disabled"}>🪙 ${it.price}</button></div>`; }).join("")}</div>
    <p class="muted" style="font-size:13px">想要新老師和造型，就到「🎁 盲盒」抽抽看！</p>`;
}
function boxClosetHtml(g){
  const lk = curLook();
  const tile = (slot, val, name, rarity, owned) => {
    if(!owned) return `<div class="ctile locked"><div class="qmark">？</div><div>${esc(name ? "？？？" : "")}</div><div class="rtag" style="color:${RARITY[rarity].color}">${RARITY[rarity].name}</div></div>`;
    const look = slot === "teacher" ? {teacher:val || "anan"} : Object.assign({}, lk, {teacher:"anan", [slot]:val || null});
    const on = slot === "teacher" ? lk.teacher === (val || "anan") : lk.teacher === "anan" && (lk[slot] || null) === (val || null);
    return `<button class="ctile ${on ? "on" : ""}" data-equip="${slot}:${val || ""}">${teacherSvg("happy", "", "tch-mid", look)}<div>${esc(name)}</div>${rarity ? `<div class="rtag" style="color:${RARITY[rarity].color}">${RARITY[rarity].name}</div>` : `<div class="rtag">基本款</div>`}${on ? `<div class="rtag">使用中</div>` : ""}</button>`;
  };
  const sec = (slot, title, base) => `<h2>${title}</h2><div class="ctiles">${tile(slot, base[0], base[1], null, true)}${BOX_ITEMS.filter(x => x.slot === slot).map(x => tile(slot, x.val, x.name, x.r, ownedItem(x.id))).join("")}</div>`;
  const have = BOX_ITEMS.filter(x => ownedItem(x.id)).length;
  return `<div class="card"><b>收集進度：${have} / ${BOX_ITEMS.length}</b><div class="xpwide"><i style="width:${have / BOX_ITEMS.length * 100}%"></i></div>
      <div class="muted" style="font-size:13px">點一下就能換上。髮色、造型、配件是安安老師專屬的，選了會自動換回安安老師。</div></div>
    ${sec("teacher", "老師", ["anan", "安安老師"])}
    ${sec("outfit", "安安的造型", [null, "制服"])}
    ${sec("hair", "安安的髮色", [null, "粉紅色"])}
    ${sec("acc", "安安的配件", [null, "不戴配件"])}`;
}

/* ---------- 測驗與魔王戰的提示、求救、暫停 ---------- */
function quizHelp(qi){ if(!view.qHelp || view.qHelp.qi !== qi) view.qHelp = {qi, removed:[], sos:false}; return view.qHelp; }
function quizHint(){
  const R = getRange(view.range), q = quizState(R); if(view.quizAnswered !== null || !q.queue.length) return;
  const qi = q.queue[0], [, opts, ans] = R.quiz[qi], h = quizHelp(qi);
  const left = opts.map((_, i) => i).filter(i => i !== ans && !h.removed.includes(i));
  if(left.length <= 1){ toast("只剩兩個選項了，自己選選看！"); return; }
  if(!spendHint()){ toast("今天的提示用完了，可以到商店用金幣買提示卡"); return; }
  h.removed.push(left[Math.floor(Math.random() * left.length)]);
  renderStudy();
}
function quizSos(){
  const R = getRange(view.range), q = quizState(R); if(view.quizAnswered !== null || !q.queue.length) return;
  const qi = q.queue[0], h = quizHelp(qi), c = chances();
  if(h.sos) return;
  if(c.sos <= 0){ toast("今天的求救機會用完了，明天再來"); return; }
  c.sos--; h.sos = true; save(); renderStudy();
  const [, , , exp, gid] = R.quiz[qi], gr = R.grammar.find(x => x.id === gid);
  sayZh((gr ? `這題考的是${gr.title}。` : "") + exp);
}
function quizToolsHtml(R, qi){
  const h = view.qHelp && view.qHelp.qi === qi ? view.qHelp : {removed:[], sos:false}, c = chances();
  const [, opts, , exp, gid] = R.quiz[qi], gr = R.grammar.find(x => x.id === gid);
  return `<div class="tools"><button class="btn small" id="qHint" ${hintLeft() && opts.length - h.removed.length > 2 ? "" : "disabled"}>💡 提示（剩 ${hintLeft()}）</button>
    <button class="btn small" id="qSos" ${c.sos && !h.sos ? "" : "disabled"}>🆘 求救${esc(tName())}（今天剩 ${c.sos}）</button></div>
    ${h.sos ? `<div class="teacher-row" style="margin-top:10px">${teacherSvg("normal", "", "tch-sm")}<div class="bubble"><span class="who">${esc(tName())}</span>${gr ? `這題考的是「${esc(gr.title)}」。` : ""}${esc(exp)}</div></div>` : ""}`;
}
function bossHint(){
  const b = view.boss; if(!b || b.picked !== null || b.result) return;
  const q = b.pool[b.idx % b.pool.length];
  const left = q.opts.map((_, i) => i).filter(i => i !== q.ans && !b.removed.includes(i));
  if(left.length <= 1){ toast("只剩兩個選項了！"); return; }
  if(!spendHint()){ toast("今天的提示用完了，可以到商店用金幣買提示卡"); return; }
  b.removed.push(left[Math.floor(Math.random() * left.length)]);
  renderStudy();
}
function bossFreeze(){
  const b = view.boss; if(!b || b.picked !== null || b.result || b.frozen) return;
  const c = chances(); if(c.freeze <= 0){ toast("今天的暫停時間用完了"); return; }
  c.freeze--; b.frozen = true; clearBossTimer(); save();
  b.line = "時間暫停了！慢慢想，不用急。"; renderStudy();
}

   單字插圖（原創 Q 版 SVG）與記憶小提示
   畫布 160 x 120；人物以腳底為基準點
   ========================================================= */
const SK = "#ffe0c8", INK = "#2d2323", MOUTH = "#c0485f";
const grp = (x, y, s, inner, rot = 0) => `<g transform="translate(${x} ${y}) scale(${s})${rot ? ` rotate(${rot})` : ""}">${inner}</g>`;
const star = (x, y, r, fill = "#ffd23f") => `<polygon points="${starPts(x, y, r)}" fill="${fill}"/>`;
const heart = (x, y, s = 1, fill = "#ff6b9a") => grp(x, y, s, `<path d="M0 6 C-12 -2 -10 -12 -4 -12 C-1 -12 0 -9 0 -8 C0 -9 1 -12 4 -12 C10 -12 12 -2 0 6 Z" fill="${fill}"/>`);
const spark = (x, y, s = 1, fill = "#ffd23f") => grp(x, y, s, `<path d="M0 -8 Q1 -1 8 0 Q1 1 0 8 Q-1 1 -8 0 Q-1 -1 0 -8 Z" fill="${fill}"/>`);
const txt = (x, y, t, size = 14, fill = INK, weight = 800) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" fill="${fill}" font-family="Segoe UI, sans-serif">${t}</text>`;
const bubble = (x, y, t, w = 54) => `<g><rect x="${x - w / 2}" y="${y - 14}" width="${w}" height="26" rx="12" fill="#fff" stroke="#e5d6ea" stroke-width="1.5"/><path d="M${x - 10} ${y + 11} L${x - 16} ${y + 20} L${x - 3} ${y + 11} Z" fill="#fff" stroke="#e5d6ea" stroke-width="1.5"/><rect x="${x - 12}" y="${y + 8}" width="11" height="4" fill="#fff"/>${txt(x, y + 4, t, 12)}</g>`;
const ground = (fill = "#cdeac0") => `<path d="M0 104 Q80 96 160 104 L160 120 L0 120 Z" fill="${fill}"/>`;
const ring = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff6c9" stroke="#ffd23f" stroke-width="2.5" stroke-dasharray="5 4"/>`;
const svgWrap = (bg, inner) => `<svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="120" rx="14" fill="${bg}"/>${inner}</svg>`;

function conceptCard(word, emoji, label){
  const hue = [...word].reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 360;
  return `<svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="120" rx="14" fill="hsl(${hue} 80% 94%)"/><circle cx="80" cy="50" r="34" fill="hsl(${hue} 75% 86%)"/><text x="80" y="64" text-anchor="middle" font-size="40" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">${emoji}</text><rect x="36" y="92" width="88" height="21" rx="10.5" fill="#fff" opacity=".92"/><text x="80" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="hsl(${hue} 45% 32%)" font-family="Microsoft JhengHei, PingFang TC, sans-serif">${esc(label)}</text></svg>`;
}
function parseParts(spec){
  return spec.split("|").map(s => {
    const i = s.indexOf("="); let t = s.slice(0, i); const m = s.slice(i + 1);
    const kind = t.endsWith("-") ? "pre" : t.startsWith("-") ? "suf" : "root";
    t = t.replace(/^-|-$/g, "");
    return {t, m, kind};
  });
}


/* =========================================================

   ========================================================= */
const KIND_NAME = {pre:"字首", root:"字根", suf:"字尾"};
function morphRow(w){
  if(!w.parts) return "";
  return `<div class="phrow">
    <div class="phhead"><span class="lbl">🧩 字根拆解（點積木聽講解）</span>
      <div class="phbtns"><button class="icon-btn" data-narrate="${esc(w.w)}">🎧 聽老師拆解</button><button class="icon-btn" data-slow="${esc(w.w)}">🐢 慢慢唸</button></div></div>
    <div class="phchunks">${w.parts.map((p, k) => `<button class="ph mp mp-${p.kind}" data-mp="${k}" data-w="${esc(w.w)}" data-k="${k}">${esc(p.t)}<small>${esc(p.m)}</small></button>`).join(`<span class="mplus">+</span>`)}</div>
    ${w.logic ? `<div class="mlogic">💡 ${esc(w.logic)}</div>` : ""}
    <div class="phinfo" id="phInfo"></div></div>`;
}
function morphPartText(p){
  if(p.kind === "suf" && /字尾$/.test(p.m)) return `是${p.m}`;
  return `是${KIND_NAME[p.kind]}，意思是「${p.m}」`;
}
function morphPartScript(w, k, n){
  const p = w.parts[k];
  return [
    {k:"zh", v: n != null ? `第${CN_NUM[n] || n + 1}塊，` : "", hl:k},
    {k:"en", v:p.t, hl:k},
    {k:"zh", v:`，${morphPartText(p)}。`, hl:k}
  ].filter(x => x.v);
}
function morphScript(w){
  if(!w.parts) return [];
  let parts = [{k:"zh", v:"我們來拆", hl:"all"}, {k:"en", v:w.w, hl:"all"}, {k:"zh", v:`，它由 ${w.parts.length} 塊積木組成。`, hl:"all"}];
  w.parts.forEach((p, k) => { parts = parts.concat(morphPartScript(w, k, k)); });
  if(w.logic) parts.push({k:"zh", v:`合起來：${w.logic.replace(/→/g, "，所以")}。`, hl:"all"});
  parts.push({k:"zh", v:"慢慢唸：", hl:"all"}, {k:"en", v:w.w, hl:"all", rate:.5}, {k:"zh", v:"正常速度：", hl:"all"}, {k:"en", v:w.w, hl:"all"});
  return parts;
}
function showMorph(word, k){
  const box = $("#phInfo"); if(!box) return;
  const R = getRange(view.range);
  const w = R.words.find(x => x.w === word); if(!w || !w.parts) return;
  const p = w.parts[k];
  const same = R.words.filter(x => x.w !== word && x.parts && x.parts.some(q => q.t === p.t && q.kind === p.kind)).slice(0, 8);
  box.innerHTML = `<div><b>${esc(p.t)}</b>（${KIND_NAME[p.kind]}）：${esc(p.m)}</div>
    ${same.length ? `<div class="phsame">用到同一塊積木的字：${same.map(x => `<button class="icon-btn" data-say="en" data-text="${esc(x.w)}">${esc(x.w)}</button>`).join("")}</div>` : `<div class="muted" style="font-size:13px;margin-top:4px">這次的單字裡沒有其他字用到這塊積木。</div>`}`;
  box.classList.add("on");
  narrate(morphPartScript(w, k, null));
}

const ACCENTS = [["en-US","🇺🇸 美式"],["en-GB","🇬🇧 英式"],["en-AU","🇦🇺 澳式"],["en-CA","🇨🇦 加拿大式"]];
function availAccents(){
  const have = ACCENTS.filter(([l]) => voices.some(v => v.lang.replace("_", "-").toLowerCase() === l.toLowerCase()));
  return have.length ? have : [["en-US","🇺🇸 美式"]];
}
function newListenItem(L, R){
  L.order = shuffle([0, 1, 2]);           // 畫面上的位置 → 原始選項
  L.ans = L.order.indexOf(0);             // 題庫中第一個選項是正解
  const acc = availAccents();
  const a1 = acc[Math.random() * acc.length | 0];
  let a2 = acc[Math.random() * acc.length | 0];
  if(acc.length > 1) while(a2 === a1) a2 = acc[Math.random() * acc.length | 0];
  L.acc = [a1, a2]; L.picked = null; L.played = false; L.mood = "normal";
  L.msg = "仔細聽問句和三個回應，選出最恰當的回答。正式考試的題本上不會印出文字。";
}
function startListen(){
  const R = getRange(view.range);
  const n = Math.min(12, R.listen.length);
  view.listen = {list: shuffle(R.listen.map((_, i) => i)).slice(0, n), i:0, firstOk:0, total:n, done:false};
  newListenItem(view.listen, R);
}
function listenScript(L, R){
  const item = R.listen[L.list[L.i]];
  const parts = [{k:"en", v:item[0], lang:L.acc[0][0]}, {k:"pause", ms:800}];
  L.order.forEach((oi, k) => parts.push({k:"en", v:"ABC"[k] + ".", lang:L.acc[1][0]}, {k:"en", v:item[1][oi], lang:L.acc[1][0]}, {k:"pause", ms:450}));

}
function playListen(){
  const L = view.listen; if(!L || L.done) return;

}

  }

  pane.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">第 ${L.i + 1} / ${L.total} 題・Part 2 應答問題</span>${combo >= 2 ? `<span class="combo-chip" style="color:#fff">${combo} 連擊</span>` : ""}</div>

function listenAnswer(k){
  const L = view.listen; if(!L || L.picked !== null || L.done) return;
  stopSpeak();
  L.picked = k;
  if(k === L.ans){ onCorrect(); L.firstOk++; gainXP(10, true); L.mood = combo >= 3 ? "star" : "happy"; L.msg = combo >= 3 ? `${combo} 連擊！耳朵很靈！` : "答對了！"; }
  else { onWrong(); L.mood = "oops"; L.msg = "沒關係，看一下陷阱在哪裡，下次就不會被騙了。"; }
  renderStudy();
}
function listenNext(){
  const L = view.listen; if(!L || L.picked === null) return;
  const R = getRange(view.range);
  stopSpeak();
  if(L.i + 1 >= L.total){
    const r = L.firstOk / L.total;
    L.stars = r >= .9 ? 3 : r >= .7 ? 2 : 1; L.done = true;
    const p = prog(view.range); p.listenRounds = (p.listenRounds || 0) + 1; save();

    renderStudy(); celebrate("聽力練習 完成！", L.stars, xp);
    return;
  }
  L.i++; newListenItem(L, R); renderStudy();
  setTimeout(() => { if(view.listen === L && view.tab === "listen" && L.picked === null) playListen(); }, 350);
}

/* ---------- 詞性挑戰 ---------- */
const POS_KEYS = [["n.","名詞"],["v.","動詞"],["adj.","形容詞"],["adv.","副詞"]];
const POS_NAME = {"n.":"名詞","v.":"動詞","adj.":"形容詞","adv.":"副詞"};
const POS_SUFFIX = [
  [/(tion|sion|ment|ness|ity|ance|ence|ship|dom)$/i, "n."],
  [/(ee|ist|ant)$/i, "n."],
  [/(ize|ify)$/i, "v."],
  [/(ful|less|ous|ive|able|ible|ic)$/i, "adj."],
  [/ly$/i, "adv."]
];
const POS_MEANING = {"n.":"它表示人、事、物的名稱","v.":"它表示一個動作","adj.":"它用來形容名詞的樣子或性質","adv.":"它用來修飾動詞、形容詞或整個句子"};
function posSuffixClue(word, pos){
  for(const [re, p] of POS_SUFFIX){
    const m = word.match(re);
    if(!m) continue;
    const suf = m[0].toLowerCase();
    if(p === pos) return `字尾 -${suf} 常是${POS_NAME[p]}`;
    return `雖然字尾 -${suf} 常是${POS_NAME[p]}，但 ${word} 是${POS_NAME[pos]}（例外，要特別記）`;
  }
  return "";
}
const POS_DET = ["a","an","the","my","your","his","her","our","their","its","this","that","these","those","every","each"];
const POS_BE = ["am","is","are","was","were","be","been","being"];
const POS_MODAL = ["will","would","can","could","must","should","may","might","to","please","let's"];
function posPositionClue(sentence, word, pos){
  const toks = sentence.replace(/[^A-Za-z' ]/g, " ").split(/\s+/).filter(Boolean);
  const i = toks.findIndex(t => t.toLowerCase() === word.toLowerCase());
  if(i <= 0) return "";
  const prev = toks[i - 1].toLowerCase();
  if(pos === "n." && POS_DET.includes(prev)) return `前面是 ${toks[i - 1]}，後面接名詞`;
  if(pos === "n." && (/(ful|less|ous|ive|able|ible|al|ic)$/.test(prev) || (getRange(view.range).words.find(x => x.w.toLowerCase() === prev) || {}).pos === "adj.")) return `前面是形容詞 ${toks[i - 1]}，後面接名詞`;
  if(pos === "adj." && POS_BE.includes(prev)) return `前面是 be 動詞 ${toks[i - 1]}，後面常接形容詞`;
  if(pos === "adj." && i + 1 < toks.length && /^(very|so|too)$/.test(prev)) return `前面有 ${toks[i - 1]}，後面常接形容詞`;
  if(pos === "v." && POS_MODAL.includes(prev)) return `前面是 ${toks[i - 1]}，後面接原形動詞`;
  if(pos === "adj." && i + 1 < toks.length) return `它放在名詞 ${toks[i + 1]} 前面，用來形容它`;
  return "";
}
function startPosq(){
  const R = getRange(view.range);
  const pool = R.words.filter(w => POS_NAME[w.pos]);
  const picked = shuffle(pool.slice()).slice(0, Math.min(10, pool.length));
  const list = picked.map((w, k) => {
    if(k % 2 === 1){
      const ex = shuffle(w.ex.slice()).find(e => new RegExp("\\b" + w.w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(e[0]));
      if(ex) return {w, type:"sent", sent:ex[0], zh:ex[1]};
    }
    return {w, type:"word"};
  });
  view.posq = {list, i:0, firstOk:0, total:list.length, picked:null, done:false, mood:"normal", msg:"看字尾、看位置，判斷這個字是什麼詞性！"};
}
function renderPosq(R){
  if(!view.posq) startPosq();
  const P = view.posq, pane = $("#pane");
  if(!P.total){ pane.innerHTML = `<div class="card empty">這個範圍沒有可以出題的單字。</div>`; return; }
  if(P.done){
    pane.innerHTML = `<div class="card done"><div class="big">🔎</div><h2 style="margin:6px 0">詞性挑戰完成！</h2>
      <div style="font-size:28px;color:#f5b301">${starText(P.stars)}</div>
      <div class="stats"><div class="stat"><b>${P.firstOk}/${P.total}</b>答對</div></div>
      <div class="teacher-row" style="justify-content:center">${teacherSvg(P.stars === 3 ? "star" : "happy", "", "tch-sm")}<div class="bubble" style="flex:0 1 420px;text-align:left"><span class="who">${esc(tName())}</span>${P.stars === 3 ? "詞性判斷很穩！遇到沒背過的字，也用同樣的方法猜猜看。" : "沒關係！先看字尾猜方向，再看位置確認，多練幾回合就會越來越快。"}</div></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="posRestart">再玩一回合</button><button class="btn" data-tab="map">回闖關地圖</button></div></div>`;
    return;
  }
  const q = P.list[P.i], w = q.w, answered = P.picked !== null;
  const ok = answered && POS_KEYS[P.picked][0] === w.pos;
  const clues = [];
  if(answered){
    if(q.type === "sent"){ const pc = posPositionClue(q.sent, w.w, w.pos); if(pc) clues.push("📍 " + pc); }
    const sc = posSuffixClue(w.w, w.pos); if(sc) clues.push("🔚 " + sc);
    clues.push("💡 " + w.w + " 的意思是「" + w.zh + "」，" + POS_MEANING[w.pos]);
  }
  pane.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">第 ${P.i + 1} / ${P.total} 題</span>${combo >= 2 ? `<span class="combo-chip" style="color:#fff">${combo} 連擊</span>` : ""}</div>
    <div class="teacher-row" style="margin-top:6px">${teacherSvg(P.mood, "", "tch-sm")}<div class="bubble"><span class="who">${esc(tName())}</span>${esc(P.msg)}</div></div>
    ${q.type === "word"
      ? `<div style="text-align:center;margin:10px 0 14px"><div class="word">${esc(w.w)}</div><div class="muted">這個字的詞性是？</div></div>`
      : `<div class="q" style="margin:10px 0 4px">${highlight(q.sent, w.w)}</div><div class="muted" style="margin-bottom:12px">句子中標示的字是什麼詞性？${answered ? "　（" + esc(q.zh) + "）" : ""}</div>`}
    <div class="opts" style="grid-template-columns:repeat(2,1fr)">${POS_KEYS.map(([k, name], i) => {
      let cls = ""; if(answered){ if(k === w.pos) cls = "right"; else if(i === P.picked) cls = "wrong"; }
      return `<button class="opt ${cls}" data-pos="${i}" ${answered ? "disabled" : ""}><span class="k">${i + 1}</span><span>${name} <span class="muted">${k}</span></span></button>`;
    }).join("")}</div>
    ${answered ? `<div class="fb ${ok ? "ok" : "bad"}"><div class="fb-head"><span>${ok ? "✓ 答對了！" : "✗ 正確答案是：" + POS_NAME[w.pos]}</span>${spk("en", q.type === "sent" ? q.sent : w.w, "")}</div>${clues.map(c => `<div>${esc(c)}</div>`).join("")}</div>
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="posNext">${P.i + 1 < P.total ? "下一題 →" : "看結果"}</button></div>` : ""}
  </div>
  <div class="keys">鍵盤：1–4 作答・Enter 下一題</div>`;
}
function posAnswer(k){
  const P = view.posq; if(!P || P.picked !== null || P.done) return;
  const w = P.list[P.i].w;
  P.picked = k;
  if(POS_KEYS[k][0] === w.pos){ onCorrect(); P.firstOk++; gainXP(8, true); P.mood = combo >= 3 ? "star" : "happy"; P.msg = combo >= 3 ? `${combo} 連擊！判斷得又快又準！` : "答對了！看看判斷的線索，下次更快。"; }
  else { onWrong(); P.mood = "oops"; P.msg = "看一下下面的線索：先看字尾，再看位置。"; }
  renderStudy();
}
function posNext(){
  const P = view.posq; if(!P || P.picked === null) return;
  if(P.i + 1 >= P.total){
    const r = P.firstOk / P.total;
    P.stars = r >= .9 ? 3 : r >= .7 ? 2 : 1; P.done = true;
    const xp = gainXP(50); setStars(view.range, "posq", P.stars);
    renderStudy(); celebrate("詞性挑戰 完成！", P.stars, xp);
    return;
  }
  P.i++; P.picked = null; P.mood = "normal"; P.msg = "下一題！先看字尾，再看位置。"; renderStudy();
}


function bonusHtml(R){
  const nodes = [];
  if(!R.noSpell) nodes.push(["spell", R.spellIcon || "🔤", R.spellTitle || "拼字挑戰", R.spellSub || "自然發音拼拼看"]);
  nodes.push(["posq", "🔎", "詞性挑戰", "名詞、動詞、形容詞、副詞"]);
  return `<div class="map-bonus"><span class="bt">⭐ 加分關（不影響解鎖，隨時都能玩）</span>
    <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:4px">${nodes.map(([id, ic, nm, sb]) => `<button class="map-node bonus ${starsOf(view.range, id) ? "done" : ""}" data-stage="${id}" style="margin:10px 0"><span class="ball">${ic}</span><span class="nm">${nm}</span><span class="sb">${sb}</span><span class="st">${starText(starsOf(view.range, id))}</span></button>`).join("")}</div></div>`;
}

  if(e.target.dataset && e.target.dataset.speed){ setSpeed(e.target.dataset.speed, +e.target.value); if(view.cls) classReplay(); else if(e.target.dataset.speed === "en") sayEn("Hello! Nice to meet you."); else sayZh("同學好，這是老師說話的速度。"); }
  if(e.target.id === "setClsVoice"){ S.settings.classVoice = e.target.checked; save(); if(!e.target.checked) stopSpeak(); else classReplay(); }
  if(e.target.id === "setClsAuto"){ S.settings.classAuto = e.target.checked; save(); }
  if(e.target.id === "csvFile"){ const f = e.target.files[0]; e.target.value = ""; if(f) importCSV(f).catch(() => toast("讀取檔案失敗")); }
  if(e.target.id === "learnerSel"){
    const v = e.target.value;
    if(v === "__add"){ e.target.value = S.current; $("#addName").value = ""; $("#addDlg").showModal(); return; }
    S.current = v; combo = 0; save(); resumeLast(); toast(`已切換到「${v}」`);
  }
});
$("#renameDlg").addEventListener("close", () => {
  if($("#renameDlg").returnValue !== "ok") return;
  const from = S.current, to = $("#renameInput").value.trim();
  if(!to || to === from) return;
  if(S.learners.includes(to)){ toast("已經有這個名字了"); return; }
  S.learners = S.learners.map(n => n === from ? to : n);
  for(const box of [S.progress, S.game, S.speed, S.voicePref, S.fav]){
    if(box && Object.prototype.hasOwnProperty.call(box, from)){ box[to] = box[from]; delete box[from]; }
  }
  S.current = to; save(); render(); toast(`已改名為「${to}」`);
});
$("#addDlg").addEventListener("close", () => {
  if($("#addDlg").returnValue !== "ok") return;
  const n = $("#addName").value.trim();
  if(!n) return;
  if(S.learners.includes(n)){ toast("已經有這個名字了"); return; }
  S.learners.push(n); S.current = n; save(); view.screen = "home"; render(); toast(`歡迎，${n}！`);
});
document.addEventListener("keydown", e => {
  if((e.target.matches && e.target.matches("input,select,textarea")) || document.querySelector("dialog[open]")) return;
  if(view.screen === "fav"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); favGo(view.favI - 1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); favGo(view.favI + 1); }
    return;
  }
  if(view.screen !== "study") return;
  if(view.tab === "vocab"){
    if(e.key === "ArrowLeft"){ e.preventDefault(); return vocabPrev(); }
    if(e.key === "ArrowRight" && view.peek != null){ e.preventDefault(); return vocabNext(); }
    if(!curCard()) return;
    if(e.code === "Space"){ e.preventDefault(); flipCard(); return; }
    if(view.flipped && view.peek == null && ["1","2","3","4"].includes(e.key)){ rateAnim(["again","hard","good","easy"][+e.key-1]); }
  }else if(view.tab === "posq" && view.posq && !view.posq.done){
    if(view.posq.picked === null && ["1","2","3","4"].includes(e.key)) posAnswer(+e.key - 1);
    else if(view.posq.picked !== null && e.key === "Enter"){ e.preventDefault(); posNext(); }
  }else if(view.tab === "listen" && view.listen && !view.listen.done){
    const L = view.listen, key = e.key.toLowerCase();
    if(L.picked === null && ["1","2","3","a","b","c"].includes(key)) listenAnswer("123".includes(key) ? +key - 1 : "abc".indexOf(key));
    else if(e.code === "Space"){ e.preventDefault(); playListen(); }
    else if(e.key === "Enter" && L.picked !== null){ e.preventDefault(); listenNext(); }
  }else if(view.tab === "spell" && view.spell && !view.spell.done){
    const sp = view.spell;
    if(/^[1-9]$/.test(e.key)) spellPick(+e.key - 1);
    else if(e.code === "Space"){ e.preventDefault(); sayEn(getRange(view.range).words[sp.list[sp.i]].w); }
    else if(e.key === "Enter"){ e.preventDefault(); spellNext(); }
  }else if(view.tab === "boss" && view.boss){
    if(view.boss.picked === null && ["1","2","3","4"].includes(e.key)) bossAnswer(+e.key-1);
    else if(view.boss.picked !== null && e.key === "Enter" && $("#bossNext")){ e.preventDefault(); bossNext(); }
  }else if(view.tab === "grammar" && view.cls){
    if(e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); classGo(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); classGo(-1); }
    else if(e.code === "Space"){ e.preventDefault(); classPause(); }
    else if(["1","2","3","4"].includes(e.key)) classAnswer(+e.key-1);
  }else if(view.tab === "quiz"){
    if(view.quizAnswered === null && ["1","2","3","4"].includes(e.key)) answer(+e.key-1);
    else if(view.quizAnswered !== null && (e.key === "Enter" || e.code === "Space")){ e.preventDefault(); nextQ(); }
  }
});

resumeLast();
initCloud();
</script>

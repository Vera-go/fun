<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>換裝小舞台</title>
<meta name="description" content="自由搭配髮型、妝容、衣服和配件，挑戰主題穿搭，讓貓咪評審幫你打分數。">
<meta property="og:title" content="換裝小舞台｜穿搭挑戰">
<meta property="og:description" content="自由搭配髮型、妝容、衣服和配件，挑戰主題穿搭，讓貓咪評審幫你打分數。">
<meta name="theme-color" content="#FFF1F5">
<style>
:root{--bg:#FFF1F5;--ink:#3A2A20;--muted:#8A7480;--card:#fff;--line:#3A2A20;--acc:#E8679A;--acc2:#7E5BC2;--soft:#FFE3EE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 0}
header{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px}
header .sub{font-size:13px;color:var(--muted);font-weight:700}
.game{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.game{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:12px}
.stagecard{position:sticky;top:10px}
@media(max-width:820px){.stagecard{position:static}}
.stagebar{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:4px 12px;font-weight:900;font-size:14px}
.chip.theme{background:#EDE4FF;color:#4B2E8F}
.chip small{font-weight:700;color:var(--muted)}
.stage{border:2.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;line-height:0}
.stage svg{width:100%;height:auto;display:block}
@media(max-width:820px){.stage{max-width:340px;margin:0 auto}}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.btn{border:2.5px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-weight:900;font-size:14px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.btn.vio{background:var(--acc2);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;box-shadow:2px 2px 0 var(--line)}
.btn[hidden]{display:none}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink)}
.cats button.on{background:var(--acc);color:#fff}
.grp{margin-bottom:14px}
.grp h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.grp h3 small{color:var(--muted);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.it{position:relative;border:2.5px solid #EAD7DF;background:#FFF8FA;border-radius:14px;padding:4px 4px 3px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.it svg{width:100%;height:auto;aspect-ratio:1;display:block;border-radius:10px;background:#fff}
.it.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);background:#FFE9F1}
.it.lock{cursor:not-allowed;color:#B9A7AF}
.it.lock svg{filter:grayscale(1) opacity(.35)}
.it .lk{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 6px;font-size:11px;white-space:nowrap}
.it .wk{position:absolute;top:4px;right:4px;background:#FFB84D;color:#5A3300;border:2px solid var(--line);border-radius:99px;padding:0 6px;font-size:11px;font-weight:900}
.it .none{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#fff;color:#C7B3BC;font-size:30px;font-weight:900}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}
.sw .lb{font-size:12.5px;font-weight:800;color:var(--muted);min-width:34px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc)}
.sw button.no{background:#fff}
.sw button.no::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;background:#E05050;transform:rotate(-45deg)}
.sw .pt{width:auto;height:auto;border-radius:99px;padding:3px 10px;font:inherit;font-size:12.5px;font-weight:800;background:#fff;color:var(--ink)}
.sw .pt.on{background:var(--acc);color:#fff;box-shadow:none}
.tog{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(58,42,32,.4);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:20;overflow:auto}
.ov[hidden]{display:none}
.panel{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:16px;width:100%;max-width:640px;margin:auto}
.panel h2{margin:0 0 6px;font-size:21px;text-align:center}
.panel p{margin:6px 0;line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:13px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.th{border:2.5px solid var(--line);border-radius:14px;padding:0;background:#fff;cursor:pointer;font:inherit;color:var(--ink);text-align:left;overflow:hidden;display:flex;flex-direction:column}
.th svg{width:100%;height:auto;display:block;border-bottom:2px solid var(--line)}
.th .tx{padding:8px 10px}
.th b{font-size:15px}
.th .st{color:#F2B01E;letter-spacing:1px;font-size:14px}
.th .st i{font-style:normal;color:#E3D6DC}
.th .rw{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.judges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.jd{background:#FFF8FA;border:2px solid #EAD7DF;border-radius:14px;padding:8px;text-align:center;font-size:13px;line-height:1.5}
.jd svg{width:64px;height:64px}
.jd b{display:block;font-size:13px}
.score{text-align:center}
.score .big{font-size:46px;font-weight:900;line-height:1.1}
.score .stars{font-size:30px;color:#F2B01E;letter-spacing:3px}
.score .stars i{font-style:normal;color:#E3D6DC}
.detail{list-style:none;padding:0;margin:8px 0;font-size:14px}
.detail li{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px dashed #EAD7DF}
.detail li b{white-space:nowrap}
.detail .pl{color:#27A06A}.detail .mi{color:#D9414E}
.unlock{background:#FFF6CC;border:2px solid #E8C547;border-radius:14px;padding:8px 12px;font-weight:800;text-align:center;margin-top:8px}
@media(max-width:520px){.judges{grid-template-columns:1fr}.jd{display:flex;align-items:center;gap:8px;text-align:left}.jd svg{flex:none;width:48px;height:48px}}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.wd{border:2.5px solid #EAD7DF;border-radius:14px;overflow:hidden;background:#fff}
.wd svg{width:100%;height:auto;display:block}
.wd .tx{padding:6px;font-size:12px;text-align:center}
.wd .tx b{display:block;font-size:13px}
.wd .row{display:flex;gap:4px;justify-content:center;margin-top:4px}
/* 穿搭牆 */
.wtabs{display:flex;gap:4px;background:#F6E3EB;border-radius:99px;padding:4px;margin:8px 0 10px;flex-wrap:wrap}
.wtabs button{flex:1;border:0;background:transparent;border-radius:99px;padding:6px 8px;font:inherit;font-weight:900;color:var(--muted);cursor:pointer;white-space:nowrap}
.wtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wp{border:2.5px solid #EAD7DF;border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.wp.mine{border-color:var(--acc)}
.wp svg.look{width:100%;height:auto;display:block}
.wp .tx{padding:6px 8px;font-size:12.5px;line-height:1.45;flex:1}
.wp .tx b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp .tg{display:inline-block;background:#EDE4FF;color:#4B2E8F;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:800}
.wp .row{display:flex;gap:4px;align-items:center;padding:0 6px 6px}
.likeb{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:99px;background:#fff;padding:3px 9px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:var(--ink)}
.likeb.on{background:#FFE3EE;border-color:var(--acc);color:#C2386F}
.likeb svg{width:15px;height:15px}
.likeb:disabled{opacity:.6;cursor:default}
.linkb{border:0;background:none;padding:2px 4px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;margin-left:auto}
.postbox{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.postbox svg{width:100%;height:auto;border:2px solid #EAD7DF;border-radius:12px}
.postbox label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}
.postbox input{display:block;width:100%;margin-top:3px;font:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink)}
@media(max-width:520px){.postbox{grid-template-columns:110px 1fr}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip.contest{border:0;cursor:pointer;background:#FFE7B8;color:#8A5300;font:inherit;font-weight:900;font-size:13px}
.mini{position:fixed;right:10px;bottom:12px;width:92px;border:3px solid var(--line);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--line);overflow:hidden;z-index:15;cursor:pointer;line-height:0}
.mini svg{width:100%;height:auto}
.mini[hidden]{display:none}
.contestbar{background:#FFF3D6;border:2px solid #F2C14E;border-radius:14px;padding:8px 12px;margin-bottom:10px;font-size:14px;line-height:1.6;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contestbar b{font-size:16px}
.rank{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;background:#fff}
.rank.r1{background:#FFD447}.rank.r2{background:#D9DEE6}.rank.r3{background:#E8B07A}
.wp{position:relative}
.hallwk{grid-column:1/-1;font-weight:900;font-size:15px;margin:6px 0 0;padding-top:6px;border-top:2px dashed #EAD7DF}
.hallwk:first-child{border-top:0;padding-top:0}
.chk{display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px;margin:4px 0 8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:800;box-shadow:3px 3px 0 var(--line);z-index:30}
.portal-foot{text-align:center;color:#8A7480;font:13px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:8px 16px 36px}.portal-foot a{display:inline-block;padding:12px 4px;color:#8A7480;text-decoration:none}.portal-foot svg{display:inline-block}.portal-foot a:hover,.portal-foot a:focus-visible{text-decoration:underline;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path d="M24 6 L24 12" stroke="#3A2A20" stroke-width="2.6" stroke-linecap="round"/><path d="M24 12 Q30 12 30 7" fill="none" stroke="#3A2A20" stroke-width="2.6" stroke-linecap="round"/><path d="M24 14 L6 30 Q4 33 8 33 L40 33 Q44 33 42 30 Z" fill="#fff" stroke="#3A2A20" stroke-width="2.6" stroke-linejoin="round"/><path d="M14 33 L12 42 L36 42 L34 33" fill="#F7A8C4" stroke="#3A2A20" stroke-width="2.6" stroke-linejoin="round"/><circle cx="24" cy="38" r="2.2" fill="#E8679A"/></svg>
    <div><h1>換裝小舞台</h1><div class="sub">自由搭配，或挑戰主題穿搭，讓貓咪評審打分數</div></div>
  </header>
  <div class="game">
    <div class="card stagecard">
      <div class="stagebar" id="stageBar"></div>
      <div class="stage" id="stage"></div>
      <div class="tools">
        <button class="btn acc" id="bScore" hidden>送出評分</button>
        <button class="btn vio" id="bTheme">主題挑戰</button>
        <button class="btn" id="bRandom">隨機搭配</button>
        <button class="btn" id="bSave">存進衣櫥</button>
        <button class="btn" id="bWardrobe">我的衣櫥</button>
        <button class="btn" id="bDownload">下載圖片</button>
        <button class="btn acc" id="bWall">穿搭牆</button>
        <button class="btn" id="bShare">分享連結</button>
        <button class="btn" id="bUndo" title="Ctrl + Z">復原</button>
        <button class="btn" id="bReset">重新開始</button>
      </div>
    </div>
    <div class="card">
      <div class="cats" id="cats"></div>
      <div id="groups"></div>
    </div>
  </div>
</div>
<!-- 手機上往下選衣服時，右下角的小預覽（點了回到舞台） -->
<div class="mini" id="mini" hidden title="回到舞台"></div>
<div class="ov" id="ov" hidden><div class="panel" id="panel"></div></div>

</html>

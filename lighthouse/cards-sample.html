<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>抽牌小鎮｜小樣本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#0b1526; --night2:#1c3049; --ink:#1a1a2e; --paper:#fff8e7; --acc:#f2a53c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--night1),var(--night2));color:#fbf3e4;font-family:"Noto Sans TC",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:18px 16px 36px;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.4;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.08em}
.sub{font-size:13px;opacity:.7;margin:0 0 14px;text-align:center}
.stage{perspective:1000px;width:min(300px,82vw);aspect-ratio:3/4.1;position:relative;margin:6px 0 16px}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);
  box-shadow:0 10px 0 rgba(0,0,0,.35)}
.back{background:repeating-conic-gradient(#2b1a4a 0 12deg,#4a2a7a 12deg 24deg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.back .q{font-size:84px;transform-origin:center;font-weight:900;color:var(--acc);text-shadow:4px 4px 0 var(--ink);animation:bob 1.6s ease-in-out infinite}
.back .hint{font-size:14px;font-weight:700;background:var(--ink);color:#fbf3e4;padding:4px 12px;border-radius:99px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(10deg)}}
.clk{animation:rev 6s linear infinite}
@keyframes rev{to{transform:rotate(-360deg)}}
.front{transform:rotateY(180deg);padding:12px 12px 14px;display:flex;flex-direction:column;color:var(--ink)}
.front .rar{position:absolute;top:10px;right:12px;font-size:12px;font-weight:900;background:var(--ink);color:#ffe27a;padding:2px 10px;border-radius:99px;letter-spacing:.1em}
.front .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.front .art svg{width:100%;height:100%}
.front .name{font-size:23px;font-weight:900;text-align:center;margin:0}
.front .trait{font-size:12.5px;font-weight:700;text-align:center;margin:2px 0 8px;opacity:.75}
.front .say{background:rgba(255,255,255,.65);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:14px;font-weight:700;text-align:center;line-height:1.5}
.front.rare{color:#fff8e7}
.front.rare .name{text-shadow:3px 3px 0 var(--ink)}
.front.rare .trait{opacity:.95}
.front.rare .say{color:var(--ink)}
.front.rare{box-shadow:0 0 0 3px #ffe27a,0 0 30px 6px rgba(255,226,122,.7),0 10px 0 rgba(0,0,0,.35)}
.front.rare::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 66%);background-size:250% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.btn{font:inherit;font-weight:900;font-size:16px;background:var(--acc);color:#36220a;border:3px solid var(--ink);border-radius:14px;padding:10px 24px;
  box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[hidden]{display:none}
.dex{font-size:13px;opacity:.75;margin-top:14px}
.dex b{color:var(--acc)}
.leave{position:fixed;right:12px;bottom:12px;font-size:12px;color:#fbf3e4;opacity:.65;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:99px}
.spark{position:absolute;width:10px;height:10px;border-radius:2px;pointer-events:none;animation:pop 900ms ease-out forwards}
@keyframes pop{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.blink{animation:blink 3.4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.zz{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}
.ants{transform-origin:100px 118px;transform-box:view-box}
.fluff .ants{animation:fluff .18s linear 7}
.fluff .wifi{animation:flick .18s steps(2) 7}
.fluff .wob{animation:puff 1.3s ease-out 1}
@keyframes fluff{0%{transform:rotate(-6deg) scale(1.04)}50%{transform:rotate(6deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.04)}}
@keyframes flick{50%{opacity:0}}
@keyframes puff{0%,100%{transform:scale(1)}20%{transform:scale(1.12,.9)}}
.awakeE,.oops{display:none}
.woke .awakeE,.woke .oops{display:inline}
.woke .sleepE,.woke .zz{display:none}
.woke .wob{animation:jolt .55s ease-out 1}
.rock{transform-box:fill-box;transform-origin:50% 100%}
.woke .rock{animation:rockhop .5s ease-out 1}
@keyframes rockhop{0%{transform:translateY(0)}30%{transform:translateY(-18px) rotate(14deg)}60%{transform:translateY(0) rotate(-8deg)}80%{transform:translateY(-5px)}100%{transform:none}}
.woke .oops{animation:pulse .18s ease-in-out 5}
@keyframes pulse{50%{transform:scale(1.25)}}
.oops{transform-box:fill-box;transform-origin:center}
@keyframes jolt{0%{transform:translateY(0)}20%{transform:translateY(-30px) rotate(-8deg) scale(1.12,1.18)}50%{transform:translateY(0) rotate(5deg) scale(1.08,.92)}70%{transform:translateY(-8px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<h1>抽牌小鎮</h1>
<p class="sub">小樣本・這次，你抽到的是⋯⋯</p>

<div class="stage"><div class="card" id="card" role="button" tabindex="0" aria-label="翻牌">
  <div class="face back"><div class="q">?</div><div class="hint">掉進兔子洞，翻牌</div></div>
  <div class="face front" id="front"></div>
</div></div>

<button class="btn" id="again" hidden>再抽一張</button>
<div class="dex" id="dex"></div>
<a class="leave" href="./">先離開，回 Lighthouse</a>

<script>
const $ = s => document.querySelector(s);
const INK = "#1a1a2e";
const o = `stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;

/* 角色：全部是手繪塗鴉風 SVG，故意歪歪的、不對稱 */
const eyeBig = (x,y,r=11,px=0) => `<g class="blink"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${o}/><circle cx="${x+px}" cy="${y+2}" r="${r/2.4}" fill="${INK}"/></g>`;
const eyeSpiral = (x,y,r=12) => { let d = ""; for(let i = 0; i <= 44; i++){ const t = i * .3, rr = .8 + i * (r - 3.6) / 44; d += `${i ? "L" : "M"}${(x + rr * Math.cos(t)).toFixed(1)} ${(y + rr * Math.sin(t)).toFixed(1)}`; }
  return `<g class="blink"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="3.2"/><path d="${d}" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`; };
const ART = {
  /* 吐司水獺：奶油融化中，三隻眼睛高低不一，手像麵條 */
  otter: `<svg viewBox="-14 -10 228 220"><g class="wob">
    <path d="M44 120 Q40 104 60 104 L140 104 Q160 104 156 120 L160 150 Q164 160 150 160 Q146 182 136 160 Q124 158 120 170 Q116 188 106 164 Q92 160 86 172 Q80 184 74 162 Q56 164 50 154 Z" fill="#f2b45a" ${o}/>
    <path d="M56 118 Q100 108 144 118" fill="none" stroke="#c9822e" stroke-width="5" stroke-linecap="round"/>
    <g transform="rotate(-10 150 112)"><rect x="128" y="96" width="34" height="18" rx="4" fill="#ffe66d" ${o}/></g>
    <path d="M52 132 Q28 128 34 150 Q22 160 38 168" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="170" r="7" fill="#c98a5a" ${o}/>
    <path d="M148 132 Q176 122 166 100 Q188 94 178 76" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="177" cy="73" r="7" fill="#c98a5a" ${o}/><g class="rock"><g transform="translate(174 46) scale(1.3) translate(-177 -52)"><ellipse cx="177" cy="52" rx="19" ry="16" fill="#b9c0cc" ${o} transform="rotate(-12 177 52)"/>
    <g class="sleepE"><path d="M166 50 Q170 54 174 50 M180 48 Q184 52 188 48" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M171 58 Q177 63 183 56" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/></g>
    <g class="awakeE"><circle cx="169" cy="49" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="185" cy="46" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="169" cy="49" r="1.5" fill="${INK}"/><circle cx="185" cy="46" r="1.5" fill="${INK}"/><ellipse cx="178" cy="60" rx="4" ry="5" fill="#7a1f3a" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><path d="M156 36 L150 30 M198 34 L204 28 M200 54 L208 54" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/></g></g></g>
    <circle cx="56" cy="62" r="7" fill="#8a5a38" ${o}/><circle cx="144" cy="62" r="7" fill="#8a5a38" ${o}/>
    <ellipse cx="100" cy="86" rx="54" ry="36" fill="#8a5a38" ${o}/>
    <ellipse cx="100" cy="102" rx="36" ry="22" fill="#f0dcb8" ${o}/>
    <ellipse cx="100" cy="94" rx="11" ry="7" fill="${INK}"/>
    <g class="sleepE"><path d="M100 100 L100 108 M88 110 Q100 120 112 110" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></g>
    <g class="awakeE"><path d="M100 100 L100 104" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><ellipse cx="100" cy="116" rx="10" ry="12" fill="#7a1f3a" ${o}/><ellipse cx="100" cy="122" rx="6" ry="4" fill="#ff6b8a"/></g>
    <circle cx="82" cy="104" r="2" fill="${INK}"/><circle cx="90" cy="108" r="2" fill="${INK}"/><circle cx="118" cy="104" r="2" fill="${INK}"/><circle cx="110" cy="108" r="2" fill="${INK}"/>
    <path d="M70 96 L30 84 M68 104 L26 106 M72 112 L34 126 M130 96 L170 84 M132 104 L174 106 M128 112 L166 126" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
    <g class="sleepE"><circle cx="76" cy="80" r="13" fill="#f0dcb8" ${o}/><circle cx="124" cy="80" r="13" fill="#f0dcb8" ${o}/><path d="M67 80 Q76 88 85 80 M115 80 Q124 88 133 80" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/></g>
    <g class="awakeE"><circle cx="76" cy="80" r="17" fill="#fff" ${o}/><circle cx="124" cy="80" r="17" fill="#fff" ${o}/><circle cx="76" cy="80" r="3.2" fill="${INK}"/><circle cx="124" cy="80" r="3.2" fill="${INK}"/><path d="M58 56 Q74 46 90 58 M110 58 Q126 46 142 56" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M148 60 Q156 72 148 78 Q140 72 148 60Z" fill="#7de3ff" ${o}/><path d="M40 70 L28 64 M42 56 L32 46" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/></g>
    <text class="oops" x="88" y="26" font-size="32" font-weight="900" fill="#ff4d6d" font-family="sans-serif">!!</text>
    </g>
    <g class="zz" fill="${INK}" font-weight="900" font-family="sans-serif"><text x="116" y="34" font-size="22">Z</text></g>
    <g class="zz" style="animation-delay:.7s" fill="${INK}" font-weight="900" font-family="sans-serif"><text x="134" y="18" font-size="15">z</text></g></svg>`,
  /* WiFi 刺蝟：刺是長眼睛的天線，一隻超大眼，嘴巴開到耳朵 */
  hedgehog: `<svg viewBox="-14 -10 228 220"><g class="wob"><g class="ants">
    <path d="M60 100 L34 40" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="36" r="9" fill="#fff" ${o}/><circle cx="34" cy="38" r="3.5" fill="${INK}"/>
    <path d="M84 84 L76 22" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="76" cy="18" r="9" fill="#fff" ${o}/><circle cx="74" cy="20" r="3.5" fill="${INK}"/>
    <path d="M112 82 Q104 54 122 40" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="124" cy="36" r="9" fill="#fff" ${o}/><circle cx="127" cy="36" r="3.5" fill="${INK}"/>
    <path d="M138 96 L172 58" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="175" cy="54" r="9" fill="#fff" ${o}/><circle cx="173" cy="57" r="3.5" fill="${INK}"/>
    </g>
    <path d="M30 144 Q24 100 62 92 Q100 76 138 92 Q178 100 172 144 Q172 176 100 176 Q30 176 30 144Z" fill="#7b5cff" ${o}/>
    <path d="M44 120 L36 112 M52 100 L42 90 M150 98 L160 88 M160 124 L170 118" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="118" r="32" fill="#ffd9a8" ${o}/>
    <circle cx="100" cy="112" r="20" fill="#fff" ${o}/>
    <circle cx="100" cy="112" r="10" fill="#ff4d6d" ${o}/><circle cx="100" cy="112" r="4" fill="${INK}"/>
    <path d="M54 146 Q100 190 148 142 Q100 156 54 146Z" fill="#7a1f3a" ${o}/>
    <path d="M62 148 L68 156 L76 150 L84 160 L92 152 L100 162 L108 152 L116 160 L124 150 L132 156 L140 146" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M60 176 L56 190 M92 178 L96 186 M140 174 L150 190" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g class="wifi" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linecap="round"><path d="M10 82 Q22 70 36 82"/><path d="M16 90 Q22 85 30 90"/></g>
    <text x="150" y="30" font-size="26" font-weight="900" fill="#ff4d6d" font-family="sans-serif">?!</text></svg>`,
  /* 冷場企鵝：肚子是倒著走的時鐘，笑容大到超出臉 */
  penguin: `<svg viewBox="0 -16 200 216"><g class="wob">
    <path d="M100 30 Q154 30 156 100 Q160 172 100 172 Q40 172 44 100 Q46 30 100 30Z" fill="#3c4a8a" ${o}/>
    <g transform="rotate(14 100 22)"><rect x="78" y="-4" width="44" height="34" rx="3" fill="#1a1a2e" ${o}/><rect x="68" y="26" width="64" height="8" rx="3" fill="#1a1a2e" ${o}/><rect x="78" y="16" width="44" height="7" fill="#ff4d6d"/></g>
    ${eyeSpiral(78,62,13)}${eyeBig(122,56,17,-5)}
    <path d="M100 74 Q150 74 148 128 Q146 170 100 172 Q54 170 52 128 Q50 74 100 74Z" fill="#fff8e7" ${o}/>
    <path d="M76 80 Q100 62 124 80 Q118 98 100 100 Q82 98 76 80Z" fill="#ff9f1c" ${o}/>
    <path d="M82 86 Q100 92 118 86" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M62 112 Q100 152 138 112 Q100 124 62 112Z" fill="#7a1f3a" ${o}/>
    <path d="M70 114 Q100 126 130 114 L128 120 Q100 130 72 120Z" fill="#fff"/>
    <path d="M86 128 Q100 122 114 128 Q100 138 86 128Z" fill="#ff6b8a" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
    <g transform="translate(100 154) scale(.7) translate(-100 -150)"><circle cx="100" cy="150" r="24" fill="#fff" ${o}/>
    <g class="clk" style="transform-origin:100px 150px"><path d="M100 150 L100 134" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M100 150 L112 156" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
    <g font-size="9" font-weight="900" fill="${INK}" font-family="sans-serif" text-anchor="middle"><text x="100" y="134">21</text><text x="118" y="153">9</text><text x="100" y="170">6</text><text x="82" y="153">3</text></g></g>
    <path d="M44 120 Q16 112 18 150 Q30 142 48 140Z" fill="#3c4a8a" ${o}/>
    <path d="M156 120 Q190 100 186 138 Q170 134 152 138Z" fill="#3c4a8a" ${o}/>
    <ellipse cx="72" cy="178" rx="26" ry="8" fill="#ff9f1c" ${o}/><ellipse cx="132" cy="180" rx="12" ry="6" fill="#ff9f1c" ${o}/>
    </g>
    </svg>`,
  /* 燈塔蝸牛（閃卡）：茶杯裡長出歪歪的燈塔，眼睛長在打結的觸角上 */
  snail: `<svg viewBox="0 0 200 200"><g class="wob">
    <path d="M10 170 Q10 154 34 154 L176 154 Q194 156 190 172 Z" fill="#7ee0c3" ${o}/>
    <path d="M150 154 Q146 124 164 110 Q178 100 164 90 Q150 84 158 72" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    ${eyeSpiral(158,66,12)}
    <path d="M176 156 Q180 130 190 120" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="190" cy="116" r="9" fill="#fff" ${o}/><circle cx="188" cy="118" r="3.5" fill="${INK}"/>
    <path d="M170 166 Q178 174 188 164" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
    <g transform="rotate(-9 80 150)">
      <path d="M36 112 L128 112 L120 148 Q116 158 100 158 L64 158 Q48 158 44 148 Z" fill="#fff" ${o}/>
      <circle cx="58" cy="132" r="4" fill="#ff7aa8"/><circle cx="82" cy="140" r="4" fill="#ff7aa8"/><circle cx="104" cy="130" r="4" fill="#ff7aa8"/>
      <path d="M128 118 Q150 114 148 134 Q146 148 126 140" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 112 L66 54 L98 54 L106 112 Z" fill="#fff8e7" ${o}/>
      <path d="M62 92 L102 92 M64 74 L100 74" stroke="#ff4d6d" stroke-width="12"/>
      <path d="M58 112 L66 54 L98 54 L106 112 Z" fill="none" ${o}/>
      <rect x="68" y="34" width="28" height="20" rx="4" fill="#ffe27a" ${o}/>
      <path d="M62 34 L82 16 L102 34 Z" fill="#ff4d6d" ${o}/>
    </g></g>
    <g class="beamB" opacity=".8"><path d="M54 40 Q10 30 8 10 Q40 16 50 34Z" fill="#ffe27a" opacity=".7"/><path d="M96 40 Q150 26 160 6 Q120 8 100 32Z" fill="#ffe27a" opacity=".7"/></g>
    <circle cx="26" cy="64" r="11" fill="#fff8e7" ${o}/><path d="M26 64 L26 57 M26 64 L32 67" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
    <path d="M168 40 L172 30 L176 40 L186 44 L176 48 L172 58 L168 48 L158 44Z" fill="#ffe27a" ${o}/></svg>`
};

const CARDS = [
  {id:"otter",   name:"吐司水獺",   trait:"特質：隨時都在睡，被戳到會嚇一大跳（戳他一下）", say:"他說自己一點都不睏。（說完就睡著了）", bg:"#ffb3d1", rare:0},
  {id:"hedgehog",name:"WiFi 刺蝟", trait:"特質：訊號不好就炸毛（戳他一下試試）", say:"他不是在生氣，只是在轉圈圈載入中。", bg:"#b8f27c", rare:0},
  {id:"penguin", name:"冷場企鵝",   trait:"特質：肚子的時鐘倒著走，笑話慢半拍才到", say:"全場安靜，是因為大家都在偷偷憋笑。（大概）", bg:"#7de3ff", rare:0},
  {id:"snail",   name:"茶杯燈塔蝸牛", trait:"特質：慢慢來，迷路也沒關係，而且會發光", say:"仙境本來就沒有直線，你走歪的那一步，也算數。", bg:"#7a5cff", rare:1}
];

/* 星空 */
(function(){ let h=""; for(let i=0;i<40;i++) h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(2)}s"></i>`; $("#stars").innerHTML=h; })();

/* 圖鑑（只存在這支手機，不上傳） */
let dex = new Set();
try{ dex = new Set(JSON.parse(localStorage.getItem("lh_cards_dex")) || []); }catch(e){}
function renderDex(){ $("#dex").innerHTML = `圖鑑：已收集 <b>${dex.size}</b> / ${CARDS.length}`; }
renderDex();

const card = $("#card"), front = $("#front"), again = $("#again");
let last = -1, busy = false;

function pick(){
  // 閃卡約 15%，同一張不連抽
  const wantRare = Math.random() < .15;
  const pool = CARDS.map((c,i)=>i).filter(i => !!CARDS[i].rare === wantRare && i !== last);
  const list = pool.length ? pool : CARDS.map((c,i)=>i).filter(i => i !== last);
  return list[Math.floor(Math.random()*list.length)];
}
function burst(){
  const st = document.querySelector(".stage"), cols = ["#ffe27a","#ff8a65","#7ee0c3","#c9b8ff","#a9d4ff"];
  for(let i=0;i<22;i++){
    const s = document.createElement("i"); s.className = "spark";
    const a = Math.random()*Math.PI*2, d = 90 + Math.random()*90;
    s.style.cssText = `left:50%;top:50%;background:${cols[i%cols.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*540-270}deg`;
    st.appendChild(s); setTimeout(()=>s.remove(), 950);
  }
}
function draw(){
  if(busy) return; busy = true;
  if(card.classList.contains("flip")){
    card.classList.remove("flip"); again.hidden = true;
    setTimeout(() => { busy = false; draw(); }, 500); return;
  }
  const i = pick(); last = i; const c = CARDS[i];
  front.style.background = c.bg; front.classList.toggle("rare", !!c.rare);
  front.innerHTML = `${c.rare?'<span class="rar">閃卡</span>':''}<div class="art">${ART[c.id]}</div>
    <p class="name">${c.name}</p><p class="trait">${c.trait}</p><div class="say">${c.say}</div>`;
  card.classList.add("flip");
  setTimeout(() => { burst(); if(c.rare) setTimeout(burst, 250); again.hidden = false; busy = false;
    dex.add(c.id); try{ localStorage.setItem("lh_cards_dex", JSON.stringify([...dex])); }catch(e){} renderDex(); }, 650);
}
card.addEventListener("click", () => {
  if(!card.classList.contains("flip")) return draw();
  const id = CARDS[last] && CARDS[last].id;
  if(id === "hedgehog"){ front.classList.remove("fluff"); void front.offsetWidth; front.classList.add("fluff"); setTimeout(() => front.classList.remove("fluff"), 1400); }
  if(id === "otter"){ front.classList.remove("woke"); void front.offsetWidth; front.classList.add("woke"); clearTimeout(window.__sl); window.__sl = setTimeout(() => front.classList.remove("woke"), 2200); }
});
card.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ") && !card.classList.contains("flip")) draw(); });
again.addEventListener("click", draw);
</script>
</body>

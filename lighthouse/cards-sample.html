<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>抽牌小鎮｜小樣本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#0b1526; --night2:#1c3049; --ink:#1a1a2e; --paper:#fff8e7; --acc:#f2a53c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--night1),var(--night2));color:#fbf3e4;font-family:"Noto Sans TC",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:18px 16px 36px;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.4;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.08em}
.sub{font-size:13px;opacity:.7;margin:0 0 14px;text-align:center}
.stage{perspective:1000px;width:min(300px,82vw);aspect-ratio:3/4.1;position:relative;margin:6px 0 16px}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);
  box-shadow:0 10px 0 rgba(0,0,0,.35)}
.back{background:repeating-conic-gradient(#2b1a4a 0 12deg,#4a2a7a 12deg 24deg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.back .q{font-size:84px;transform-origin:center;font-weight:900;color:var(--acc);text-shadow:4px 4px 0 var(--ink);animation:bob 1.6s ease-in-out infinite}
.back .hint{font-size:14px;font-weight:700;background:var(--ink);color:#fbf3e4;padding:4px 12px;border-radius:99px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(10deg)}}
.clk{animation:rev 3s linear infinite}
.clk2{animation:rev 18s linear infinite}
.mb1{animation:mbx 5s ease-in-out infinite}
.mb2{animation:mbx 6.5s ease-in-out -2s infinite reverse}
.mb3{animation:mbx 7.5s ease-in-out -4s infinite}
@keyframes mbx{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}
.mem{animation:memp 3.2s ease-in-out infinite}
@keyframes memp{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes rev{to{transform:rotate(-360deg)}}
.front{transform:rotateY(180deg);padding:12px 12px 14px;display:flex;flex-direction:column;color:var(--ink)}
.front .rar{position:absolute;top:10px;right:12px;font-size:12px;font-weight:900;background:var(--ink);color:#ffe27a;padding:2px 10px;border-radius:99px;letter-spacing:.1em}
.front .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.front .art svg{width:100%;height:100%}
.front .name{font-size:23px;font-weight:900;text-align:center;margin:0}
.front .trait{font-size:12.5px;font-weight:700;text-align:center;margin:2px 0 8px;opacity:.75}
.front .say{background:rgba(255,255,255,.65);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:14px;font-weight:700;text-align:center;line-height:1.5}
.front.rare{color:#fff8e7}
.front.rare .name{text-shadow:3px 3px 0 var(--ink)}
.front.rare .trait{opacity:.95}
.front.rare .say{color:var(--ink)}
.front.rare{box-shadow:0 0 0 3px #ffe27a,0 0 30px 6px rgba(255,226,122,.7),0 10px 0 rgba(0,0,0,.35)}
.front.rare::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 66%);background-size:250% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.btn{font:inherit;font-weight:900;font-size:16px;background:var(--acc);color:#36220a;border:3px solid var(--ink);border-radius:14px;padding:10px 24px;
  box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[hidden]{display:none}
.dex{font-size:13px;opacity:.75;margin-top:14px}
.dex b{color:var(--acc)}
.leave{position:fixed;right:12px;bottom:12px;font-size:12px;color:#fbf3e4;opacity:.65;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:99px}
.spark{position:absolute;width:10px;height:10px;border-radius:2px;pointer-events:none;animation:pop 900ms ease-out forwards}
@keyframes pop{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.blink{animation:blink 3.4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.zz{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}
.ants{transform-origin:100px 118px;transform-box:view-box}
.fluff .ants{animation:fluff .18s linear 7}
.fluff .wifi{animation:flick .18s steps(2) 7}
.fluff .wob{animation:puff 1.3s ease-out 1}
@keyframes fluff{0%{transform:rotate(-6deg) scale(1.04)}50%{transform:rotate(6deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.04)}}
@keyframes flick{50%{opacity:0}}
@keyframes puff{0%,100%{transform:scale(1)}20%{transform:scale(1.12,.9)}}
.awakeE,.oops{display:none}
.woke .awakeE,.woke .oops{display:inline}
.woke .sleepE,.woke .zz{display:none}
.woke .wob{animation:jolt .55s ease-out 1}
.rock{transform-box:fill-box;transform-origin:50% 100%}
.woke .rock{animation:rockhop .5s ease-out 1}
@keyframes rockhop{0%{transform:translateY(0)}30%{transform:translateY(-18px) rotate(14deg)}60%{transform:translateY(0) rotate(-8deg)}80%{transform:translateY(-5px)}100%{transform:none}}
.woke .oops{animation:pulse .18s ease-in-out 5}
@keyframes pulse{50%{transform:scale(1.25)}}
.oops{transform-box:fill-box;transform-origin:center}
@keyframes jolt{0%{transform:translateY(0)}20%{transform:translateY(-30px) rotate(-8deg) scale(1.12,1.18)}50%{transform:translateY(0) rotate(5deg) scale(1.08,.92)}70%{transform:translateY(-8px)}100%{transform:none}}
.skin{animation:hueS 9s linear infinite}
.glitch .skin{animation:hueS .7s linear 2}
@keyframes hueS{to{filter:hue-rotate(360deg)}}
.pops,.pops2{animation:floatH 3s ease-in-out infinite;transform-box:fill-box}
.pops2{animation-delay:-1.4s}
@keyframes floatH{50%{transform:translateY(-6px)}}
.glitch .wob{animation:shiver .12s linear 8}
@keyframes shiver{25%{transform:translateX(-3px) skewX(-3deg)}75%{transform:translateX(3px) skewX(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<p class="sub">小樣本・這次，你抽到的是⋯⋯</p>

  <div class="face back"><div class="q">?</div><div class="hint">掉進兔子洞，翻牌</div></div>
  <div class="face front" id="front"></div>

<button class="btn" id="again" hidden>再抽一張</button>
<div class="dex" id="dex"></div>
<a class="leave" href="./">先離開，回 Lighthouse</a>

    <g class="mem" transform="translate(-14 -4)"><circle cx="46" cy="38" r="26" fill="#fff" ${o}/><circle cx="40" cy="70" r="5.5" fill="#fff" stroke="${INK}" stroke-width="3.5"/><circle cx="34" cy="82" r="3" fill="#fff" stroke="${INK}" stroke-width="3"/>
    <clipPath id="memClip"><circle cx="46" cy="38" r="22"/></clipPath>
    <g clip-path="url(#memClip)" style="filter:blur(4px)"><circle class="mb1" cx="38" cy="32" r="14" fill="#ffb3d1"/><circle class="mb2" cx="56" cy="34" r="14" fill="#ffe27a"/><circle class="mb3" cx="46" cy="50" r="15" fill="#a9d4ff"/></g>
    </g>
    </svg>`,
  /* 燈塔蝸牛（閃卡）：茶杯裡長出歪歪的燈塔，眼睛長在打結的觸角上 */
  snail: `<svg viewBox="-8.7 -20.7 220 220"><g class="wob">
    <path d="M10 170 Q10 154 34 154 L176 154 Q194 156 190 172 Z" fill="#7ee0c3" ${o}/>
    <path d="M150 154 Q146 124 164 110 Q178 100 164 90 Q150 84 158 72" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    ${eyeSpiral(158,66,12)}
    <path d="M176 156 Q180 130 190 120" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="190" cy="116" r="9" fill="#fff" ${o}/><circle cx="188" cy="118" r="3.5" fill="${INK}"/>
    <path d="M166 162 Q177 178 190 160" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/><circle cx="168" cy="158" r="4.5" fill="#ff8fb1" opacity=".9"/>
    <g transform="rotate(-9 80 150)">
      <path d="M36 112 L128 112 L120 148 Q116 158 100 158 L64 158 Q48 158 44 148 Z" fill="#fff" ${o}/>
      <circle cx="58" cy="132" r="4" fill="#ff7aa8"/><circle cx="82" cy="140" r="4" fill="#ff7aa8"/><circle cx="104" cy="130" r="4" fill="#ff7aa8"/>
      <path d="M128 118 Q150 114 148 134 Q146 148 126 140" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 112 L66 54 L98 54 L106 112 Z" fill="#fff8e7" ${o}/>
      <path d="M62 92 L102 92 M64 74 L100 74" stroke="#ff4d6d" stroke-width="12"/>
      <path d="M58 112 L66 54 L98 54 L106 112 Z" fill="none" ${o}/>
      <rect x="68" y="34" width="28" height="20" rx="4" fill="#ffe27a" ${o}/>
      <path d="M62 34 L82 16 L102 34 Z" fill="#ff4d6d" ${o}/>
    </g></g>
    <g class="beamB" opacity=".8"><path d="M54 40 Q10 30 8 10 Q40 16 50 34Z" fill="#ffe27a" opacity=".7"/><path d="M96 40 Q150 26 160 6 Q120 8 100 32Z" fill="#ffe27a" opacity=".7"/></g>
    <circle cx="26" cy="64" r="11" fill="#fff8e7" ${o}/><path d="M26 64 L26 57 M26 64 L32 67" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
    <path d="M168 40 L172 30 L176 40 L186 44 L176 48 L172 58 L168 48 L158 44Z" fill="#ffe27a" ${o}/></svg>`
};

const CARDS = [
  {id:"otter",   name:"白日夢水獺",   trait:"特質：被功課和補習壓得好累，腦袋常常偷偷飛走（戳他一下）", say:"他不是在發呆，他正在飛出去。", bg:"#ffb3d1", rare:0},
  {id:"chameleon",name:"濾鏡變色龍", trait:"特質：一隻眼睛看自己，一隻眼睛看別人，顏色換個不停（戳他一下）", say:"他不是愛換顏色，他只是怕被看見原本的樣子。", bg:"#ffd479", rare:0},
  {id:"hedgehog",name:"轉圈圈小怪", trait:"特質：訊號不好就炸毛（戳他一下試試）", say:"他不是在生氣，只是在轉圈圈載入中。", bg:"#b8f27c", rare:0},
  {id:"penguin", name:"倒帶企鵝",   trait:"特質：肚子的時鐘倒著走，常常回頭看昨天", say:"他不是困住了，只是還想再看一眼昨天。", bg:"#7de3ff", rare:0},
  {id:"snail",   name:"茶杯燈塔蝸牛", trait:"特質：慢慢來，迷路也沒關係，而且會發光", say:"仙境本來就沒有直線，你走歪的那一步，也算數。", bg:"#7a5cff", rare:1}
];

/* 星空 */
(function(){ let h=""; for(let i=0;i<40;i++) h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(2)}s"></i>`; $("#stars").innerHTML=h; })();

/* 圖鑑（只存在這支手機，不上傳） */
let dex = new Set();
try{ dex = new Set(JSON.parse(localStorage.getItem("lh_cards_dex")) || []); }catch(e){}
function renderDex(){ $("#dex").innerHTML = `圖鑑：已收集 <b>${dex.size}</b> / ${CARDS.length}`; }
renderDex();

const card = $("#card"), front = $("#front"), again = $("#again");
let last = -1, busy = false;

function pick(){
  // 閃卡約 15%，同一張不連抽
  const wantRare = Math.random() < .15;
  const pool = CARDS.map((c,i)=>i).filter(i => !!CARDS[i].rare === wantRare && i !== last);
  const list = pool.length ? pool : CARDS.map((c,i)=>i).filter(i => i !== last);
  return list[Math.floor(Math.random()*list.length)];
}
function burst(){
  const st = document.querySelector(".stage"), cols = ["#ffe27a","#ff8a65","#7ee0c3","#c9b8ff","#a9d4ff"];
  for(let i=0;i<22;i++){
    const s = document.createElement("i"); s.className = "spark";
    const a = Math.random()*Math.PI*2, d = 90 + Math.random()*90;
    s.style.cssText = `left:50%;top:50%;background:${cols[i%cols.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*540-270}deg`;
    st.appendChild(s); setTimeout(()=>s.remove(), 950);
  }
}
function draw(){
  if(busy) return; busy = true;
  if(card.classList.contains("flip")){
    card.classList.remove("flip"); again.hidden = true;
    setTimeout(() => { busy = false; draw(); }, 500); return;
  }
  const i = pick(); last = i; const c = CARDS[i];
  front.style.background = c.bg; front.classList.toggle("rare", !!c.rare);
  front.innerHTML = `${c.rare?'<span class="rar">閃卡</span>':''}<div class="art">${ART[c.id]}</div>
    <p class="name">${c.name}</p><p class="trait">${c.trait}</p><div class="say">${c.say}</div>`;
  card.classList.add("flip");
  setTimeout(() => { burst(); if(c.rare) setTimeout(burst, 250); again.hidden = false; busy = false;
    dex.add(c.id); try{ localStorage.setItem("lh_cards_dex", JSON.stringify([...dex])); }catch(e){} renderDex(); }, 650);
}
card.addEventListener("click", () => {
  if(!card.classList.contains("flip")) return draw();
  const id = CARDS[last] && CARDS[last].id;
  if(id === "hedgehog"){ front.classList.remove("fluff"); void front.offsetWidth; front.classList.add("fluff"); setTimeout(() => front.classList.remove("fluff"), 1400); }
  if(id === "chameleon"){ front.classList.remove("glitch"); void front.offsetWidth; front.classList.add("glitch"); setTimeout(() => front.classList.remove("glitch"), 1500); }
  if(id === "otter"){ front.classList.remove("woke"); void front.offsetWidth; front.classList.add("woke"); clearTimeout(window.__sl); window.__sl = setTimeout(() => front.classList.remove("woke"), 2200); }
});
card.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ") && !card.classList.contains("flip")) draw(); });
again.addEventListener("click", draw);
</script>
</body>
</html>

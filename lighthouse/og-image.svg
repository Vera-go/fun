<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="70%" stop-color="#1c3049"/>
      <stop offset="100%" stop-color="#3a4f68"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="2.2" opacity=".8"/><circle cx="180" cy="130" r="1.6" opacity=".6"/>
    <circle cx="300" cy="50" r="1.8" opacity=".7"/><circle cx="420" cy="100" r="1.4" opacity=".5"/>
    <circle cx="560" cy="40" r="2" opacity=".75"/><circle cx="700" cy="90" r="1.6" opacity=".6"/>
    <circle cx="830" cy="55" r="2.2" opacity=".8"/><circle cx="960" cy="120" r="1.5" opacity=".55"/>
    <circle cx="1080" cy="70" r="2" opacity=".7"/><circle cx="1150" cy="150" r="1.6" opacity=".6"/>
    <circle cx="250" cy="200" r="1.4" opacity=".5"/><circle cx="650" cy="180" r="1.8" opacity=".65"/>
    <circle cx="950" cy="210" r="1.5" opacity=".55"/><circle cx="40" cy="220" r="1.5" opacity=".5"/>
    <circle cx="500" cy="230" r="1.3" opacity=".45"/><circle cx="1100" cy="240" r="1.4" opacity=".5"/>
  </g>

  <!-- 燈塔整組：往左一點、縮小一點，光束往上打 -->
  <g transform="translate(-70 0) translate(276 610) scale(.84) translate(-276 -610)">
  <!-- 光束 -->
  <g filter="url(#soft)">
    <polygon points="276,258 1500,-340 1500,80" fill="url(#beamGrad)"/>
  </g>
  <circle cx="276" cy="258" r="70" fill="url(#lampGlow)"/>

  <!-- 岩石 -->
  <path d="M120 630 Q220 520 320 560 Q420 515 520 630 Z" fill="#24364a"/>
  <!-- 燈塔塔身 -->
  <polygon points="234,610 318,610 300,300 252,300" fill="#f3ead8"/>
  <polygon points="249,468 303,468 297,418 255,418" fill="#d8694f"/>
  <rect x="258" y="520" width="14" height="26" rx="3" fill="#b99b6b"/>
  <rect x="286" y="520" width="14" height="26" rx="3" fill="#b99b6b"/>
  <!-- 燈室 -->
  <rect x="240" y="228" width="72" height="76" rx="8" fill="#1c3049" stroke="#f3ead8" stroke-width="5"/>
  <circle cx="276" cy="266" r="21" fill="#ffd877"/>
  <polygon points="234,228 318,228 276,170" fill="#d8694f"/>
  </g>

  <!-- 海浪 → 岸邊 -->
  <path d="M0 560 Q150 520 300 555 T600 548 T900 560 T1200 540 V630 H0 Z" fill="#fbf3e4"/>

  <text x="60" y="590" font-family="'Noto Serif TC',serif" font-size="30" font-weight="700" fill="#2c3b4e">Lighthouse</text>
</svg>

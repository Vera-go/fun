<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse｜不是你的錯</title>
<meta name="description" content="這裡很安靜，只是讓你喘口氣的地方。">
<meta property="og:title" content="Lighthouse｜不是你的錯">
<meta property="og:description" content="你在這裡，不是一個人。先靠岸休息一下。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#0b1526; --night2:#1c3049; --horizon:#3a4f68;
  --shore:#fbf3e4; --ink:#2c3b4e; --muted:#73839a; --line:#e6dcc5;
  --acc:#f2a53c; --acc2:#ff8a65; --acc-ink:#36220a; --card:#fffdf8;
  --help1:#2f6f7e; --help2:#5aa0a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--shore);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6}
a{color:inherit}
h1,h2{font-family:"Noto Serif TC","Noto Sans TC",serif}

/* ---------- 夜空場景 ---------- */
.sky{position:relative;height:300px;overflow:hidden;background:linear-gradient(180deg,var(--night1) 0%,var(--night2) 70%,var(--horizon) 100%)}
.stars{position:absolute;inset:0}
.stars i{position:absolute;display:block;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 3.6s ease-in-out infinite}
.scene{position:absolute;left:0;right:0;bottom:26px;height:220px}
.beamFan{animation:sweep 7s ease-in-out infinite alternate;transform-origin:92px 86px}
@keyframes sweep{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.85}}
.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:40px;display:block}
.scene{overflow:visible}

/* 放紙飛機：有個人把它丟出去，紙飛機才慢慢飄向夜空深處。
   外層只負責平滑地飄遠＋縮小（單一緩動曲線，不分段），內層負責輕輕搖晃機身，兩層疊加才不會卡卡的 */
.lantern{position:absolute;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5;
  animation:driftOut var(--dur,10s) ease-in-out forwards}
.lantern .lwrap{position:relative;width:42px;height:26px;animation:sway var(--swayDur,1.9s) ease-in-out infinite alternate;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.45))}
.lantern .lwrap svg{width:100%;height:100%;display:block}
.lantern .label{font-size:12px;color:#ffe9b8;white-space:normal;opacity:.92;max-width:100px;text-align:center;text-wrap:balance;text-shadow:0 1px 4px rgba(0,0,0,.4)}
@keyframes driftOut{
  0%{transform:translate(0,0) scale(.55);opacity:0}
  22%{transform:translate(1vw,-2px) scale(1);opacity:1}
  85%{opacity:1}
  100%{transform:translate(var(--mx,30vw),var(--my,-62px)) scale(.14);opacity:0}
}
@keyframes sway{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-4px)}}

/* 放飛的人：把紙飛機丟出去，然後慢慢淡出，讓紙飛機自己繼續飄 */
.releaser{position:absolute;bottom:26px;width:48px;height:62px;pointer-events:none;z-index:4;
  animation:releaserFade 5.5s ease-in-out forwards}
.releaser svg{width:100%;height:100%;display:block}
@keyframes releaserFade{
  0%{opacity:0;transform:translateY(5px)}
  12%{opacity:1;transform:translateY(0)}
  60%{opacity:1}
  100%{opacity:0;transform:translateY(-2px)}
}

.lookup{position:fixed;left:50%;top:252px;transform:translateX(-50%);background:rgba(11,21,38,.6);color:#ffe9b8;
  padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;pointer-events:none;
  animation:lookupBounce .9s ease-in-out infinite,lookupFade 2.8s ease forwards}
@keyframes lookupBounce{0%,100%{margin-top:0}50%{margin-top:-6px}}
@keyframes lookupFade{0%,75%{opacity:1}100%{opacity:0}}

.hero-text{position:relative;text-align:center;padding:14px 18px 6px;max-width:640px;margin:-6px auto 0}
.hero-text h1{color:var(--shore);font-size:25px;margin:0 0 8px;font-weight:700;letter-spacing:.02em}
.hero-text p{color:#cfe0ee;margin:0;min-height:22px;font-size:14.5px;letter-spacing:.04em;opacity:0}
.hero-text p.fadein{animation:softIn 1.8s ease forwards}
.hero-text p.bye{color:#ffe9b8;font-size:16px}
.hero-text p.fadeout{animation:softOut 1.4s ease forwards}
/* 放飛後的真實計數：在開場語下面淡淡出現，不推動版面 */
/* 放飛後的真實計數：和給使用者的那句話輪流出現在同一行，數字另外上色 */
.hero-text p.bye b{color:var(--acc2);font-size:19px;font-weight:900;margin:0 2px;text-shadow:0 0 14px rgba(255,138,101,.55)}
@keyframes softIn{from{opacity:0;transform:translateY(6px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes softOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateY(-4px);filter:blur(4px)}}

/* ---------- 岸上內容 ---------- */
.wrap{max-width:640px;margin:0 auto;padding:10px 18px 70px;position:relative}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0 18px}
.navbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(60,40,10,.06);transition:transform .15s}
.navbtn:active{transform:scale(.96)}
.navbtn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(242,165,60,.45)}
.navicon{width:17px;height:17px;vertical-align:-3px;margin-right:2px}
.navbtn[data-view="release"] .navicon{width:22px;height:13.5px;vertical-align:-1px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 26px 24px;padding:22px;margin:16px 0;box-shadow:0 10px 30px rgba(44,59,78,.08)}

.btn{border:none;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;background:var(--line);color:var(--ink)}
.btn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(242,165,60,.35)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.chip{border:1.5px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:13px}

.relInput{display:flex;gap:8px;margin-top:12px}
.relInput input{flex:1;border-radius:999px;border:1.5px solid var(--line);padding:10px 16px;background:transparent;color:inherit;font-size:15px;transition:border-color .2s}
.relInput input.shake{animation:shake .4s ease;border-color:var(--acc2)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.relChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.relCount{margin-top:16px;font-size:13.5px;color:var(--muted)}

.brWrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 6px}
.brBall{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d8,#f2a53c 70%);box-shadow:0 0 30px rgba(242,165,60,.35);transition:transform 3.6s ease-in-out;transform:scale(.6)}
.brBall.in{transform:scale(1.15)}
.brWord{font-size:17px;font-weight:700}
.brLeft{font-size:14px;color:var(--muted)}

.reframe{position:relative;min-height:170px;padding-top:6px}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rquote{font-size:44px;color:var(--acc2);opacity:.55;line-height:1;position:relative;top:10px;font-family:Georgia,serif}
.rfav{border:none;background:transparent;font-size:22px;cursor:pointer;line-height:1;padding:2px 4px;color:var(--acc2)}
.wline{vertical-align:-.2em;flex:none}.rfav .wline{vertical-align:middle}
.rline{font-size:17px;font-weight:700;margin:0 0 12px;color:var(--ink)}
.rreframe{color:var(--muted);margin:0}
.rctl{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.rctl .mid{display:flex;align-items:center;gap:6px}
.rdots{font-size:12px;color:var(--muted);letter-spacing:.05em}
.rfade{animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.rfavlink{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.favitem{border-top:1px solid var(--line);padding:12px 0}
.favitem p{margin:4px 0}
.favitem .fline{font-weight:700}
.favitem .freframe{color:var(--muted);font-size:14px}
.favitem .frow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}

.helpfab{position:fixed;right:16px;bottom:16px;border:none;border-radius:999px;padding:13px 20px;background:linear-gradient(135deg,var(--help1),var(--help2));color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 18px rgba(47,111,126,.5);cursor:pointer;z-index:20;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 18px rgba(47,111,126,.5)}50%{box-shadow:0 4px 26px rgba(47,111,126,.85)}}
dialog{border:none;border-radius:22px;padding:24px;max-width:360px;width:90vw;color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(11,21,38,.6)}
.hl{border-top:1px solid var(--line);padding:11px 0}
.hl b{display:block;font-size:15px}
.hl .tel a{font-weight:900;font-size:18px;color:var(--help1)}
/* ---------- 保護自己 ---------- */
.pg{border:1px solid var(--line);border-radius:16px;margin:10px 0;background:#fff8ec;overflow:hidden}
.pg summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:800}
.pg summary::-webkit-details-marker{display:none}
.pg summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:700}
.pg[open] summary::after{content:"－"}
.pgi{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.pgt{flex:1;min-width:0}
.pgtag{flex:none;font-size:12px;font-weight:700;color:var(--acc-ink);background:#ffe3c2;border-radius:99px;padding:2px 9px}
.pg ul{margin:0;padding:0 16px 14px 34px}
.pg li{margin:7px 0;font-size:14.5px;line-height:1.65}
.pg li b{color:#b5521f}
.urgent{border:2px solid #e8604c;background:#fff1ee;border-radius:16px;padding:14px 16px;margin:16px 0}
.urgent .ut{display:flex;align-items:center;gap:6px;font-weight:900;color:#c2412d}
.ur{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px dashed #f3b9ad;padding:8px 0;font-size:14px}
.ur:first-of-type{border-top:0}
.ur b{color:#c2412d;white-space:nowrap}
/* ---------- 陪朋友 ---------- */
.meter{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--muted);margin:6px 0 12px}
.meter .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
.meter b{color:var(--acc2);font-size:16px;min-width:22px;text-align:right}
.flist{display:grid;gap:10px}
.fpick{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.fpick:hover{border-color:var(--acc)}
.fpick:active{transform:scale(.98)}
.fpick.red{border-color:#f0a596;background:#fff6f3}
.fpick.done{opacity:.75}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,#6f86d6,#48c6ef)}
.fpick.red .av{background:linear-gradient(135deg,#ff8a65,#e8604c)}
.ft{flex:1;min-width:0;display:flex;flex-direction:column}
.ft span{font-size:13px;color:var(--muted)}
.fgo{font-size:13px;font-weight:800;color:var(--acc2)}
.fred{font-size:12px;font-weight:800;color:#fff;background:#e8604c;border-radius:99px;padding:2px 9px;white-space:nowrap}
.fsc{font-size:13px;font-weight:800;color:var(--muted)}
.chat{border-radius:18px;overflow:hidden;border:1px solid #1f2b3c;background:#0f1a2a}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#17263b;color:#e8eef7}
.chead .av{width:32px;height:32px;font-size:14px}
.cback{border:none;background:transparent;color:#e8eef7;font-size:26px;line-height:1;cursor:pointer;padding:0 6px}
.cbody{height:360px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 20% 0%,#1d3150,#0f1a2a 70%)}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.55;animation:pop .25s ease}
.msg.them{align-self:flex-start;background:#26384f;color:#eef3fa;border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-bottom-right-radius:5px}
.msg.tip{align-self:stretch;max-width:none;background:rgba(255,248,236,.95);color:var(--ink);font-size:13.5px;border-radius:12px}
.msg.tip.end{text-align:center;font-weight:700}
.tipk{display:inline-block;font-size:12px;font-weight:900;border-radius:99px;padding:1px 9px;margin-right:6px}
.tipk.good{background:#d8f5e1;color:#1f7a3f}.tipk.ok{background:#fff0c9;color:#8a5a00}.tipk.hm{background:#ffe1dc;color:#b33a26}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:#9fb3cc;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cfoot{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:#17263b}
.cfoot:empty{display:none}
.copt{border:1.5px solid #4a6587;background:#1f3149;color:#eef3fa;border-radius:14px;padding:10px 12px;text-align:left;font:inherit;font-size:14px;cursor:pointer}
.copt:hover{border-color:var(--acc)}
.mood{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#9fb3cc}
.mbar{width:70px;height:7px;border-radius:99px;background:#26384f;overflow:hidden}
.mbar i{display:block;height:100%;background:#9fb3cc;transition:width .8s ease,background .8s}
.mbar i.up{background:linear-gradient(90deg,#7ee0a5,#ffd27a)}.mbar i.down{background:#e8604c}
.msg.sys{align-self:center;max-width:90%;background:transparent;color:#8aa0bb;font-size:12.5px;text-align:center;padding:2px 8px}
.msg.epi{align-self:stretch;max-width:none;border-radius:14px;padding:14px 16px;margin-top:8px;color:#1f2b3c;animation:pop .6s ease}
.msg.epi.good{background:linear-gradient(135deg,#fff3dc,#e2f7e9)}.msg.epi.mid{background:#f3efe6}.msg.epi.bad{background:#e9edf2;color:#3a4657}
.ep-k{font-size:12px;font-weight:900;letter-spacing:.2em;color:#b5521f;margin-bottom:4px}
.msg.epi.bad .ep-k{color:#6b7a8f}
.ep-t{font-size:15px;line-height:1.7}
.ep-s{margin-top:8px;font-size:12.5px;color:#73839a}
.mzhead{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px}
.cback.dark{color:var(--ink);font-size:24px}
.chlist{display:grid;gap:10px}
.chpick{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
.chpick:hover{border-color:var(--acc)}
.chpick.done{opacity:.75}
.chn{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#ffd27a;background:#1d3150}
.finale{background:linear-gradient(180deg,#14233a,#1d3150);color:#e8eef7;border-radius:18px;padding:20px 16px}
.fnt{text-align:center;font-size:20px;font-weight:900;color:#ffd27a;letter-spacing:.1em;margin-bottom:14px}
.frow{display:flex;gap:12px;border-top:1px dashed #3a5070;padding:12px 0}
.frow:first-of-type{border-top:0}
.ftime{flex:none;width:52px;font-weight:900;color:#ffd27a;font-size:15px}
.fitems{flex:1;display:grid;gap:6px}
.fit{font-size:14px;line-height:1.6}
.fit b{display:inline-block;min-width:3.2em;color:#9fd0ff;margin-right:6px}
.finale .seq{opacity:0;animation:seqIn .9s ease forwards}
@keyframes seqIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.finale .seq{animation:none;opacity:1}}
.fpunch{text-align:center;font-size:18px;font-weight:900;color:#fff;margin:18px 0 6px;line-height:1.6}
.fafter{text-align:center;font-size:14.5px;color:#cfdced;margin:0;line-height:1.8}
.seg{display:flex;gap:4px;background:#f3e9d6;border-radius:999px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border:none;background:transparent;border-radius:999px;padding:8px 6px;font:inherit;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(60,40,10,.12)}
.btn.small{padding:6px 12px;font-size:13px}
.qprog{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:10px}
.qprog .bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.qprog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.qcard{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.qq{font-size:17px;font-weight:900;margin-bottom:12px;line-height:1.6}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;border:1.5px solid var(--line);background:#fffdf8;border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px;cursor:pointer;color:inherit}
.qopt:hover:not(:disabled){border-color:var(--acc)}
.qopt:disabled{cursor:default}
.qopt.best{border-color:#2f9e44;background:#e8f8ec;font-weight:800}
.qopt.wrong{border-color:#e8604c;background:#fff0ed}
.qopt.dim{opacity:.55}
.qwhy{margin-top:12px;background:#fff3dc;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.qwhy.ok{background:#e8f8ec}
.qwhy b{display:block;margin-bottom:2px}
.qend{text-align:center;padding:10px 0}
.qscore{font-size:40px;font-weight:900;color:var(--acc2)}
.rec{display:grid;gap:10px;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.rec label{display:grid;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
.rec input,.rec textarea{font:inherit;font-size:15px;font-weight:500;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fffdf8;width:100%;box-sizing:border-box}
.rec textarea{resize:vertical}
.rec textarea.shake{animation:shake .4s ease;border-color:var(--acc2)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rlab{font-size:13px;font-weight:800;color:var(--muted)}
.rev{display:flex;flex-wrap:wrap;gap:6px}
.rec .rchk{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.rec .rchk input{width:auto;padding:0}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.rpre,.rsaved pre{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.7;background:#fff8ec;border:1px dashed var(--line);border-radius:12px;padding:12px;margin:4px 0 8px}
.rkeep{font-size:14px;font-weight:800;color:#b5521f;margin:4px 0 8px}
.rbtns a.btn{text-decoration:none;display:inline-flex;align-items:center}
.rtemp{margin-top:8px}
.rwarn{background:#fff1ee;border-radius:10px;padding:8px 10px;margin:6px 0;color:#8a3b2b}
.rsaved{margin-top:12px;font-size:14px}

.mzwrap{position:relative;background:linear-gradient(180deg,#14233a,#1d3150);border-radius:18px;padding:8px}
.mzmap{display:block;width:100%;max-width:420px;margin:0 auto}
.mzmap .e{stroke:#4d6687;stroke-width:2;stroke-dasharray:4 4}
.mzmap .e.dim{stroke:#2b3d57}
.mzmap .e.on{stroke:#ffd27a;stroke-width:3;stroke-dasharray:none}
.mzmap .n circle{fill:#2b3d57;stroke:#4d6687;stroke-width:2}

.rname{font-size:18px;font-weight:900;color:#b5521f}
.rscene{font-size:15.5px;margin:8px 0 12px}
.rins{background:#fff3dc;border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:14.5px}
.rins span{display:block;font-size:12px;font-weight:900;color:var(--acc);margin-bottom:2px}
.rexits{display:grid;gap:8px;margin-top:14px}
.rexit{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px;text-align:left;cursor:pointer;color:inherit}
.rexit:hover{border-color:var(--acc)}
.rexit span{color:var(--acc2);font-weight:900}
.rlist{margin:14px 0;font-size:14px}.rlist ul{padding-left:20px;margin:6px 0}.rlist li{margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:34px;padding:0 20px}

<script>
const C = window.LH;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const app = $("#app");
let view = "release", breath = null;
let rIdx = (() => { try{ return parseInt(localStorage.getItem("lh_reframe_idx"), 10) || 0; }catch(e){ return 0; } })();
let rFavs = (() => { try{ return new Set(JSON.parse(localStorage.getItem("lh_reframe_favs")) || []); }catch(e){ return new Set(); } })();
function saveFavs(){ try{ localStorage.setItem("lh_reframe_favs", JSON.stringify([...rFavs])); }catch(e){} }
function saveRIdx(){ try{ localStorage.setItem("lh_reframe_idx", rIdx); }catch(e){} }

$("#tagline").textContent = C.site.tagline2;
document.title = `Lighthouse｜${C.site.tagline}`;
$("#foot").innerHTML = `<p>${SiteIcons.line("anchor", 16)} ${esc(C.site.disclaimer)}</p><p><a href="../"><svg viewBox="0 0 32 32" width="1.15em" height="1.15em" aria-hidden="true" focusable="false" style="vertical-align:-.2em"><path d="M10 11 V8 Q10 5 13 5 H19 Q22 5 22 8 V11" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="11" width="26" height="16" rx="3" fill="#E6325F" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 18 H29" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12.5" y="15.5" width="7" height="5.5" rx="1.5" fill="#FFD60A" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> 回工具箱</a>・<a href="../wish/#new">想要新功能？來許願</a></p>`;

// 星星：隨機灑在夜空區，閃爍時間錯開
(function scatterStars(){
  const el = $("#stars"), n = 46;
  let html = "";
  for(let i = 0; i < n; i++){
    const x = Math.random() * 100, y = Math.random() * 62, d = (Math.random() * 3).toFixed(2), s = (Math.random() * 1.6 + .6).toFixed(2);
    html += `<i style="left:${x}%;top:${y}%;animation-delay:${d}s;transform:scale(${s})"></i>`;
  }
  el.innerHTML = html;
})();

// 開場語：一次只出現一句，慢慢浮現、停一下、再輕輕淡去，一句結束才換下一句（不會疊在一起）
// 放飛時，heroSay() 會讓目前這句先淡出，換成給使用者的一句話（視線本來就在天空）；
// heroAfter() 排在那句話後面，同一行接著出現（紙飛機計數），天空只佔一行，不會疊成好幾行
let heroQueue = [], heroWake = null, heroBusy = false, heroSeq = 0;
function heroSay(text){ heroSeq++; heroQueue = [{text}]; if(heroWake) heroWake(); }
function heroAfter(html, seq){
  if(seq !== heroSeq) return;   // 已經又放了一架：舊的計數不要
  heroQueue.push({html});
  if(!heroBusy && heroWake) heroWake();
}
// 洗牌：一輪內不重複，用完才重洗；進度存在 localStorage，重新開頁也不會從頭看到同一句
function nextBye(list){
  let bag = [];
  try{ bag = (JSON.parse(localStorage.getItem("lh_bye_bag")) || []).filter(i => i < list.length); }catch(e){}
  if(!bag.length){
    bag = list.map((_, i) => i);
    for(let i = bag.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    let last = -1; try{ last = parseInt(localStorage.getItem("lh_bye_last"), 10); }catch(e){}
    if(bag.length > 1 && bag[bag.length - 1] === last){ const t = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = t; }
  }
  const i = bag.pop();
  try{ localStorage.setItem("lh_bye_bag", JSON.stringify(bag)); localStorage.setItem("lh_bye_last", i); }catch(e){}
  return list[i];
}
(function cycleOpen(){
  const el = $("#openline"), lines = C.openLines;
  const wait = ms => new Promise(r => { const t = setTimeout(r, ms); heroWake = () => { clearTimeout(t); r(); }; });
  (async () => {
    for(let i = 0; ; ){
      if(heroQueue.length){
        const m = heroQueue.shift();
        heroBusy = true;
        if(el.textContent && el.className.startsWith("fadein")){ el.className = el.className.replace("fadein", "fadeout"); await wait(m.html ? 1400 : 700); }
        if(m.html) el.innerHTML = m.html; else el.textContent = m.text;
        el.className = "fadein bye";
        await wait(1800 + (m.html ? 7200 : 4200));
        heroBusy = false;
        if(heroQueue.length) continue;
        el.className = "fadeout bye"; await wait(1400);
        continue;
      }
      el.textContent = lines[i % lines.length]; i++;
      el.className = "fadein"; await wait(1800);
      if(heroQueue.length) continue;
      await wait(2400);
      if(heroQueue.length) continue;
      el.className = "fadeout"; await wait(1400);
    }
  })();
})();

function renderNav(){
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("on", b.dataset.view === view));
}

function renderRelease(){
  const R = C.release;
  app.innerHTML = `<p class="muted small" style="margin-top:0">${esc(R.lead)}</p>
    <div class="relInput"><input id="relIn" maxlength="14" placeholder="${esc(R.placeholder)}" aria-label="讓你難受的話">
      <button class="btn acc" id="relSend">${esc(R.send)}</button></div>
    <div class="relChips">${R.chips.map(w => `<button class="chip" data-rel="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <p class="small muted" style="margin-bottom:0">${esc(R.note)}</p>`;
  const send = v => {
    v = String(v || "").trim();
    if(!v){
      const el = $("#relIn"); el.focus(); el.classList.add("shake");
      setTimeout(() => el.classList.remove("shake"), 420);
      return;
    }
    spawnLantern(v);
    showLookup();
    window.scrollTo({top: 0, behavior: "smooth"});
    heroSay(nextBye(R.byes));
    countPlane();
    $("#relIn").value = "";
  };
  $("#relSend").onclick = () => send($("#relIn").value);
  $("#relIn").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); send(e.target.value); } });
  app.querySelectorAll("[data-rel]").forEach(b => b.addEventListener("click", () => send(b.dataset.rel)));
}
// 紙飛機真實計數：資料庫只記放飛的時間，不記寫的字、不記是誰（見 supabase/schema-v7-lighthouse-planes.sql）
// 連不上就什麼都不顯示，不影響放飛
const PLANES_API = "https://bbydhrcyxxwxtbtemszb.supabase.co/rest/v1/rpc/lighthouse_fly";
const PLANES_KEY = "sb_publishable_hlbBn6LWqC5oLdCS32lchw_xzZeIph7";   // 公開金鑰，保護靠資料庫權限規則
async function countPlane(){
  const seq = heroSeq;
  let stats;
  try{
    const res = await fetch(PLANES_API, {method: "POST", headers: {apikey: PLANES_KEY, "Content-Type": "application/json"}, body: "{}"});
    if(!res.ok) return;
    stats = await res.json();
  }catch(e){ return; }
  const R = C.release, today = Number(stats.today) || 0, total = Number(stats.total) || 0;
  // 數字另外上色：文案先跳脫，再把 {n} 換成 <b>數字</b>
  const num = n => `<b>${n.toLocaleString()}</b>`;
  const html = today >= 2 ? fillStr(esc(R.countToday), {n: num(today)})
    : total >= 2 ? fillStr(esc(R.countTotal), {n: num(total)}) : "";
  if(!html) return;
  heroAfter(html, seq);
}
function fillStr(s, o){ return String(s).replace(/\{(\w+)\}/g, (_, k) => o[k] ?? ""); }
function showLookup(){
  const el = document.createElement("div");
  el.className = "lookup"; el.textContent = "↑ 抬頭看看";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2850);
}
function spawnReleaser(leftPct){
  const sky = document.querySelector(".sky");
  const el = document.createElement("div");
  el.className = "releaser";
  el.style.left = (leftPct - 3) + "%";
  el.innerHTML = `<svg viewBox="0 0 48 62" aria-hidden="true">
    <path d="M14 20 C11 26 10 32 11 38" stroke="#20314a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M26 20 C34 16 40 10 45 6" stroke="#20314a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="12" rx="7" ry="8" fill="#20314a"/>
    <path d="M20 19 C11 22 8 38 10 61 L30 61 C32 38 29 22 20 19 Z" fill="#20314a"/>
  </svg>`;
  sky.appendChild(el);
  setTimeout(() => el.remove(), 5600);
}
function spawnLantern(text){
  const sky = document.querySelector(".sky");
  const leftPct = 21 + Math.random() * 8;
  const dur = (15 + Math.random() * 4).toFixed(2);
  const mx = (62 + Math.random() * 16).toFixed(0);
  const my = -(55 + Math.random() * 20).toFixed(0);
  const swayDur = (2.2 + Math.random() * 1).toFixed(2);
  const el = document.createElement("div");
  el.className = "lantern";
  el.style.left = leftPct + "%";
  el.style.setProperty("--dur", dur + "s");
  el.style.setProperty("--mx", mx + "vw");
  el.style.setProperty("--my", my + "px");
  el.style.setProperty("--swayDur", swayDur + "s");
  el.innerHTML = `<div class="lwrap"><svg viewBox="0 0 64 40" aria-hidden="true">
      <polygon points="62,20 2,5 20,20" fill="#fefbf2"/>
      <polygon points="62,20 20,20 2,33" fill="#cdbd9c"/>
      <polygon points="62,20 20,20 42,13" fill="#e9dcc0"/>
      <polygon points="62,20 2,5 20,20 2,33" fill="none" stroke="#8a7a5c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M20,20 L42,13" fill="none" stroke="#8a7a5c" stroke-width="1.1" stroke-linejoin="round"/>
    </svg></div><div class="label">${esc(text)}</div>`;
  sky.appendChild(el);
  spawnReleaser(leftPct);
  setTimeout(() => el.remove(), dur * 1000 + 150);
}

function renderBreath(){
  const R = C.release;
  app.innerHTML = `<p class="muted" style="margin-top:0">${esc(R.breathLead)}</p>
    <div class="brWrap"><div class="brBall" id="brBall"></div><div class="brWord" id="brWord"></div><div class="brLeft" id="brLeft">3:00</div></div>
    <div id="brCtl" style="text-align:center"><button class="btn acc" id="brStart">開始</button></div>`;
  $("#brStart").onclick = startBreath;
}
function startBreath(){
  stopBreath();
  const R = C.release, ball = $("#brBall"), word = $("#brWord"), left = $("#brLeft");
  breath = {end: Date.now() + 180000, phase: 0};
  const step = () => { const inhale = breath.phase % 2 === 0; ball.classList.toggle("in", inhale); word.textContent = inhale ? R.inhale : R.exhale; breath.phase++; };
  step(); breath.iv = setInterval(step, 3600);
  breath.tick = setInterval(() => {
    const s = Math.max(0, Math.ceil((breath.end - Date.now()) / 1000));
    left.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if(s <= 0) finishBreath();
  }, 250);
  $("#brCtl").innerHTML = `<button class="btn ghost" id="brStop">停止</button>`;
  $("#brStop").onclick = () => { stopBreath(); renderBreath(); };
}
function stopBreath(){ if(breath){ clearInterval(breath.iv); clearInterval(breath.tick); breath = null; } }
function finishBreath(){
  stopBreath();
  $("#brBall").classList.remove("in"); $("#brWord").textContent = C.release.breathDone;
  $("#brCtl").innerHTML = `<button class="btn acc" id="brStart">再來一次</button>`;
  $("#brStart").onclick = startBreath;
}

function renderReframe(){
  const cards = C.reframe.cards, len = cards.length;
  const idx = () => ((rIdx % len) + len) % len;
  const draw = () => {
    const i = idx(), c = cards[i], isFav = rFavs.has(i);
    app.innerHTML = `<div class="rtop"><p class="muted small" style="margin:0">${esc(C.reframe.lead)}</p>
        <button class="rfav" id="rFav" aria-label="收藏這句" title="收藏這句">${SiteIcons.line("star", 24, isFav ? "currentColor" : "none")}</button></div>
      <div class="reframe rfade">
        <div class="rquote">&ldquo;</div>
        <p class="rline">${esc(c.line)}</p>
        <p class="rreframe">${esc(c.reframe)}</p>
      </div>
      <div class="rctl">
        <button class="btn ghost" id="rPrev">← 回去看看</button>
        <span class="mid"><span class="rdots">${i + 1} / ${len}</span></span>
        <button class="btn acc" id="rNext">繼續往前 →</button>
      </div>
      <div style="text-align:center;margin-top:10px">
        <button class="rfavlink" id="rFavList">${SiteIcons.line("star", 14, "currentColor")} 看收藏的句子（${rFavs.size}）</button>
      </div>`;
    $("#rNext").onclick = () => { rIdx++; saveRIdx(); draw(); };
    $("#rPrev").onclick = () => { rIdx--; saveRIdx(); draw(); };
    $("#rFav").onclick = () => { isFav ? rFavs.delete(i) : rFavs.add(i); saveFavs(); draw(); };
    $("#rFavList").onclick = () => openFavDlg();
  };
  draw();
}

function openFavDlg(){
  const cards = C.reframe.cards;
  const favIdx = [...rFavs].sort((a, b) => a - b);
  $("#favDlg").innerHTML = `<h2 style="margin-top:0">${SiteIcons.line("star", 22, "currentColor")} 收藏的句子</h2>
    ${favIdx.length ? favIdx.map(i => `<div class="favitem">
        <p class="fline">${esc(cards[i].line)}</p>
        <p class="freframe">${esc(cards[i].reframe)}</p>
        <div class="frow"><button class="btn" data-goto="${i}">看這句 →</button><button class="rfavlink" data-unfav="${i}">取消收藏</button></div>
      </div>`).join("") : `<p class="muted small">還沒有收藏的句子，看到喜歡的句子，按右上角的星星就可以留下來。</p>`}
    <button class="btn" id="favClose" style="width:100%;margin-top:14px">關閉</button>`;
  $("#favDlg").showModal();
}
$("#favDlg").addEventListener("click", e => {
  const t = e.target;
  if(t.id === "favClose") return $("#favDlg").close();
  if(t.dataset.goto !== undefined){ rIdx = +t.dataset.goto; saveRIdx(); $("#favDlg").close(); renderReframe(); }
  if(t.dataset.unfav !== undefined){ rFavs.delete(+t.dataset.unfav); saveFavs(); openFavDlg(); }
});

function render(){
  renderNav();
  if(view !== "breath") stopBreath();
  if(view === "release") renderRelease();
  else if(view === "breath") renderBreath();
  else if(view === "protect") renderProtect();
  else if(view === "friend") renderFriend();
  else if(view === "maze") renderMaze();
  else renderReframe();
}

document.querySelectorAll(".navbtn").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; render(); }));

// 找人聊聊
const h = C.help;
$("#helpBtn").innerHTML = SiteIcons.line("headset", 18) + " " + esc(h.button);
$("#helpDlg").innerHTML = `<h2 style="margin-top:0">${esc(h.title)}</h2><p class="muted">${esc(h.lead)}</p>
  ${h.lines.map(l => `<div class="hl"><b>${esc(l.name)}</b><div class="tel"><a href="tel:${l.tel.replace(/-/g, "")}" style="color:inherit;text-decoration:none">${esc(l.tel)}</a></div><div class="small muted">${esc(l.note)}</div></div>`).join("")}
  <div class="hl small">${esc(h.school)}</div>
  <p class="small muted">${esc(h.disclaimer)}</p>
  <button class="btn" id="helpClose" style="width:100%">關閉</button>`;
$("#helpBtn").addEventListener("click", () => $("#helpDlg").showModal());
$("#helpDlg").addEventListener("click", e => { if(e.target.id === "helpClose") $("#helpDlg").close(); });

render();
</script>
</body>
</html>

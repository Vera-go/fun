<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>段考倒數</title>
<meta name="description" content="輸入考試日期和範圍，自動排好每天要讀什麼；落後了也會溫和地幫你重新排。">
<meta property="og:title" content="段考倒數｜讀書計畫產生器">
<meta property="og:description" content="輸入考試日期和範圍，自動排好每天要讀什麼；落後了也會溫和地幫你重新排。">
<meta name="theme-color" content="#EEF0FB">
<style>
:root{--bg:#EEF0FB;--card:#fff;--ink:#23264A;--muted:#7479A0;--line:#DCDFF3;--acc:#5B5FD9;--acc2:#F2A33A;--good:#2FA58A;--warn:#D65A4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{margin:0;font-size:24px;font-weight:900}
header .sub{font-size:13px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(35,38,74,.06);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12.5px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#FAFAFF;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.6}
label{font-size:13px;font-weight:800;color:var(--muted);display:grid;gap:4px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;font-weight:900;cursor:pointer;background:var(--acc);color:#fff;box-shadow:0 3px 0 #3F43B0}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3F43B0}
.btn.ghost{background:#EEF0FB;color:var(--ink);box-shadow:0 3px 0 #D3D6EE}
.btn.warn{background:#FCECE9;color:var(--warn);box-shadow:0 3px 0 #F0D3CE}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row > label{flex:1;min-width:120px}
/* 倒數 */
.count{display:flex;align-items:center;gap:16px}
.count .big{font-size:60px;font-weight:900;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.count .big small{font-size:18px;color:var(--ink);margin-left:4px}
.count .t{flex:1;min-width:0}
.count .t b{font-size:19px}
.prog{height:12px;border-radius:99px;background:#E7E9F8;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8B8FF0,var(--acc));transition:width .4s}
.banner{background:#FFF6E6;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.6;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.ok{background:#E8F7F1}
.banner.bad{background:#FDEEEB}
.banner .btn{margin-left:auto}
/* 任務 */
.task{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#F7F8FE;margin-bottom:6px}
.task.done{opacity:.55}
.task.done .nm{text-decoration:line-through}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);flex:none}
.task .tag{flex:none;font-size:12px;font-weight:900;color:#fff;border-radius:99px;padding:2px 8px}
.task .nm{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.task .m{flex:none;font-size:12px;color:var(--muted);font-weight:700}
.task .go{flex:none;text-decoration:none;font-size:12px;font-weight:900;color:var(--acc);border:2px solid #D3D6F5;border-radius:99px;padding:2px 8px;white-space:nowrap}
.day{margin-bottom:12px}
.day h3{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.day h3 .r{margin-left:auto;font-size:12px;color:var(--muted)}
.day.today h3{color:var(--acc)}
.day.review .task{background:#FFF6E6}
.subjects{display:grid;gap:8px}
.subj{border:2px solid var(--line);border-radius:14px;padding:10px}
.subj .top{display:flex;align-items:center;gap:8px}
.subj .top b{flex:1}
.subj .bar{height:8px;border-radius:99px;background:#EEF0FB;overflow:hidden;margin-top:6px}
.subj .bar i{display:block;height:100%}
.subj ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.6}
.empty{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 8px 30px rgba(35,38,74,.18);z-index:20;max-width:92vw;text-align:center}
.toast small{display:block;font-weight:600;color:var(--muted);margin-top:2px}
.portal-foot{text-align:center;color:#7479A0;font:13px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:20px 16px 36px}.portal-foot a{color:#7479A0;text-decoration:none}.portal-foot svg{display:inline-block}.portal-foot a:hover,.portal-foot a:focus-visible{text-decoration:underline;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><rect x="6" y="9" width="36" height="33" rx="7" fill="#fff" stroke="#23264A" stroke-width="2.4"/><path d="M6 18 H42" stroke="#23264A" stroke-width="2.4"/><rect x="6" y="9" width="36" height="9" rx="4" fill="#5B5FD9"/><path d="M15 5 V12 M33 5 V12" stroke="#23264A" stroke-width="2.6" stroke-linecap="round"/><path d="M15 29 l5 5 l12 -11" fill="none" stroke="#2FA58A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>段考倒數</h1><div class="sub">輸入考試和範圍，自動排好每天要讀什麼</div></div>
  </header>
  <div id="app"></div>
</div>
<!-- 回工具箱放在頁面最下方（各網站一致：上方不放） -->
<footer class="portal-foot"><a href="../"><svg viewBox="0 0 32 32" width="1.15em" height="1.15em" aria-hidden="true" focusable="false" style="vertical-align:-.2em"><path d="M10 11 V8 Q10 5 13 5 H19 Q22 5 22 8 V11" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="11" width="26" height="16" rx="3" fill="#E6325F" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 18 H29" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12.5" y="15.5" width="7" height="5.5" rx="1.5" fill="#FFD60A" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> 回工具箱</a>・<a href="../wish/#new">想要新功能？來許願</a></footer>

<script>
/* =========================================================
   段考倒數＋讀書計畫產生器（許願池 #19）
   - 一次規劃一個考試：考試名稱、日期、每天可以讀多久
   - 每科輸入範圍（一行一項），自動把項目平均排到考試前的每一天，各科交錯，考前一天留給總複習
   - 沒做完的項目會提醒，按一下就從今天重新排（不會罵人）
   - 英文可以直接帶入「安安英文教室」的段考單元
   - 每一項都可以按「去專心」，打開讀書島計時
   資料只存在瀏覽器（localStorage）。
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const SUBJECTS = [["英文", "#5B8DEF"], ["數學", "#F08A5D"], ["國文", "#E06C9F"], ["自然", "#2FA58A"], ["社會", "#C9A227"], ["其他", "#8C8FA8"]];
const COLOR = Object.fromEntries(SUBJECTS);
const LEVELS_MIN = {easy:20, normal:30, hard:45};
// 安安英文教室已上線的段考單元（帶入英文範圍用）
const EN_UNITS = [
  ["j1-1-1", "國一上 第一次段考"], ["j1-1-2", "國一上 第二次段考"], ["j1-1-3", "國一上 期末考"],
  ["j1-2-1", "國一下 第一次段考"], ["j1-2-2", "國一下 第二次段考"], ["j1-2-3", "國一下 期末考"],
  ["j2-1-1", "國二上 第一次段考"], ["j2-1-2", "國二上 第二次段考"], ["j2-1-3", "國二上 期末考"],
  ["j2-2-1", "國二下 第一次段考"], ["j2-2-2", "國二下 第二次段考"], ["j2-2-3", "國二下 期末考"],
  ["j3-1-1", "國三上 第一次段考"], ["j3-1-2", "國三上 第二次段考"], ["j3-1-3", "國三上 期末考"],
  ["j3-2-1", "國三下 第一次段考"], ["j3-2-2", "國三下 第二次段考（畢業考）"], ["j3-x", "國三 會考總複習"],
  ["s1-1-1", "高一上 第一次段考"], ["s1-1-2", "高一上 第二次段考"], ["s1-1-3", "高一上 期末考"],
  ["s1-2-1", "高一下 第一次段考"], ["s1-2-2", "高一下 第二次段考"], ["s1-2-3", "高一下 期末考"],
  ["s1-v1", "高一 7000 單字 Level 1–2"], ["s2-1-1", "高二上 第一次段考"],
];

// ---------- 日期小工具（都用當地時間的「年-月-日」字串） ----------
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const WEEK = "日一二三四五六";
const niceDay = s => { const d = parse(s), n = daysBetween(today(), s); return `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）${n === 0 ? "・今天" : n === 1 ? "・明天" : ""}`; };

// ---------- 存檔 ----------
const KEY = "examplan.v1";
let P = null;   // {exam, date, weekday, weekend, review, tasks:[{id, subject, name, min, done, doneDay, day}]}
try{ P = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} };
let uid = Date.now();
const newId = () => "t" + (uid++).toString(36);

// ---------- 排計畫 ----------
// 把還沒做的項目，從今天排到考試前一天：各科輪流、照輸入順序，每天不超過可讀時間；考前一天留給總複習
function plan(){
  const start = today(), last = addDays(P.date, -1);
  const days = [];
  for(let d = start; daysBetween(d, last) >= 0; d = addDays(d, 1)) days.push(d);
  const reviewDay = P.review && days.length >= 2 ? days.pop() : null;
  // 各科輪流
  const bySubj = {};
  P.tasks.filter(t => !t.done).forEach(t => (bySubj[t.subject] = bySubj[t.subject] || []).push(t));
  const queues = Object.values(bySubj), order = [];
  while(queues.some(q => q.length)) queues.forEach(q => { if(q.length) order.push(q.shift()); });
  const cap = d => { const w = parse(d).getDay(); return (w === 0 || w === 6) ? P.weekend : P.weekday; };
  // 平均分配：時間夠的話，每天只用到需要的比例（多留一點緩衝），不要全部擠在前幾天
  const total = order.reduce((s2, t) => s2 + t.min, 0), sumCap = days.reduce((s2, d) => s2 + cap(d), 0);
  const ratio = sumCap ? Math.min(1, total / sumCap) : 1;
  const soft = d => cap(d) ? Math.min(cap(d), Math.max(20, Math.ceil(cap(d) * ratio) + 10)) : 0;
  // 照順序一天一天往後放（同一科的項目維持輸入的先後）；用平均的量排不下，就改用每天的上限再排一次
  let used, overflow;
  const assign = lim => {
    used = Object.fromEntries(days.map(d => [d, 0])); overflow = 0;
    let di = 0;
    for(const t of order){
      t.day = null;
      let k = di;
      while(k < days.length && !(lim(days[k]) > 0 && (used[days[k]] === 0 || used[days[k]] + t.min <= lim(days[k])))) k++;
      if(k >= days.length){ overflow += t.min; continue; }
      t.day = days[k]; used[days[k]] += t.min; di = k;
    }
  };
  assign(soft);
  if(overflow) assign(cap);
  P.reviewDay = reviewDay;
  P.overflow = overflow;
  P.plannedOn = today();
  save();
}

// ---------- 畫面 ----------
function render(){
  if(!P){ renderSetup(); return; }
  const left = daysBetween(today(), P.date);
  const all = P.tasks, done = all.filter(t => t.done).length, pct = all.length ? done / all.length : 0;
  const overdue = all.filter(t => !t.done && t.day && t.day < today());
  const unplaced = all.filter(t => !t.done && !t.day);
  let banner = "";
  if(left < 0) banner = `<div class="banner ok">考試已經結束了，辛苦了！要準備下一次考試，按右下角的「換一個考試」。</div>`;
  else if(overdue.length) banner = `<div class="banner">還有 <b>${overdue.length}</b> 項之前沒做完。沒關係，按一下就從今天開始重新排。<button class="btn sm" data-act="replan">幫我重新排</button></div>`;
  else if(P.overflow > 0 && left > 0){
    const need = Math.ceil(P.overflow / Math.max(1, left - (P.review ? 1 : 0)));
    banner = `<div class="banner bad">時間有點不夠：還有 <b>${unplaced.length}</b> 項（約 ${P.overflow} 分鐘）排不進去。可以每天多讀大約 <b>${need}</b> 分鐘，或把比較不重要的項目刪掉。</div>`;
  }
  const todays = all.filter(t => t.day === today() || (t.done && t.doneDay === today() && t.day !== today()));
  const todayMin = todays.filter(t => !t.done).reduce((a, b) => a + b.min, 0);
  $("#app").innerHTML = `
  <div class="card">
    <div class="count">
      <div class="big">${Math.max(0, left)}<small>天</small></div>
      <div class="t"><b>${left > 0 ? `距離「${esc(P.exam)}」還有 ${left} 天` : left === 0 ? `今天就是「${esc(P.exam)}」，加油！` : `「${esc(P.exam)}」已經結束`}</b>
        <div class="small muted">${niceDay(P.date)}・已完成 ${done} / ${all.length} 項</div>
        <div class="prog"><i style="width:${pct * 100}%"></i></div></div>
    </div>
  </div>
  ${banner}
  <div class="grid">
    <div>
      <div class="card">
        <h2>今天要讀的 <span class="r">${todays.length ? `還剩約 ${todayMin} 分鐘` : ""}</span></h2>
        ${P.reviewDay === today() ? reviewBox() : ""}
        ${todays.length ? todays.map(taskRow).join("") : `<div class="empty">${all.length ? (left > 0 ? "今天沒有排項目，可以休息，或先做明天的。" : "") : "先在右邊加入各科的考試範圍，就會幫你排好每天要讀什麼。"}</div>`}
      </div>
      <div class="card">
        <h2>每天的安排</h2>
        ${schedule()}
      </div>
    </div>
    <div>
      <div class="card">
        <h2>考試範圍</h2>
        <div class="subjects">${subjectsBox()}</div>
        <div style="margin-top:12px">${addForm()}</div>
      </div>
      <div class="card">
        <h2>設定</h2>
        <div class="row">
          <label>考試名稱<input id="sExam" maxlength="20" value="${esc(P.exam)}"></label>
          <label>考試日期<input id="sDate" type="date" value="${P.date}"></label>
        </div>
        <div class="row" style="margin-top:8px">
          <label>平日每天可以讀（分鐘）<input id="sWd" type="number" min="10" max="600" step="10" value="${P.weekday}"></label>
          <label>週末每天可以讀（分鐘）<input id="sWe" type="number" min="0" max="720" step="10" value="${P.weekend}"></label>
        </div>
        <label style="flex-direction:row;display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink)"><input id="sRv" type="checkbox" ${P.review ? "checked" : ""} style="width:20px;height:20px"> 考前一天留給總複習</label>
        <div class="row" style="margin-top:12px"><button class="btn sm" data-act="saveSet">儲存設定並重新排</button><button class="btn sm warn" data-act="reset" style="margin-left:auto">換一個考試</button></div>
        <p class="small muted" style="margin:10px 0 0">計畫只存在這個瀏覽器裡，換手機或清除瀏覽資料就會不見。</p>
      </div>
    </div>
  </div>`;
}
function taskRow(t){
  const late = !t.done && t.day && t.day < today();
  return `<div class="task ${t.done ? "done" : ""}"><input type="checkbox" data-done="${t.id}" ${t.done ? "checked" : ""} aria-label="完成 ${esc(t.name)}">
    <span class="tag" style="background:${COLOR[t.subject] || "#8C8FA8"}">${esc(t.subject)}</span>
    <span class="nm">${esc(t.name)}${late ? ` <span class="small" style="color:var(--acc2)">（${niceDay(t.day).split("（")[0]} 的）</span>` : ""}</span>
    <span class="m">${t.min} 分</span>
    ${t.done ? "" : `<a class="go" href="../study/?subject=${encodeURIComponent(t.subject)}&dur=${t.min >= 45 ? 45 : t.min >= 25 ? 25 : 15}" title="打開讀書島專心計時">去專心</a>`}</div>`;
}
function reviewBox(){
  const subs = [...new Set(P.tasks.map(t => t.subject))];
  return `<div class="banner" style="margin:0 0 8px">今天是<b>總複習日</b>：把每一科的重點、錯過的題目再看一次（${subs.map(esc).join("、")}），早點睡！</div>`;
}
function schedule(){
  const t0 = today();
  if(daysBetween(t0, P.date) < 0) return `<div class="empty">考試已經結束。</div>`;
  const days = [];
  for(let d = t0; daysBetween(d, P.date) > 0; d = addDays(d, 1)) days.push(d);
  if(!days.length) return `<div class="empty">今天就是考試日，祝你考試順利！</div>`;
  return days.map(d => {
    const ts = P.tasks.filter(t => t.day === d);
    const isReview = d === P.reviewDay;
    if(!ts.length && !isReview) return `<div class="day"><h3>${niceDay(d)}<span class="r">休息</span></h3></div>`;
    const min = ts.reduce((a, b) => a + b.min, 0), dn = ts.filter(t => t.done).length;
    return `<div class="day ${d === t0 ? "today" : ""} ${isReview ? "review" : ""}"><h3>${niceDay(d)}${isReview ? "・總複習" : ""}<span class="r">${ts.length ? `${dn} / ${ts.length} 項・${min} 分鐘` : ""}</span></h3>
      ${isReview && !ts.length ? `<div class="task"><span class="nm">每一科的重點和錯題再看一次</span></div>` : ts.map(taskRow).join("")}</div>`;
  }).join("") + `<div class="day"><h3 style="color:var(--warn)">${niceDay(P.date)}・${esc(P.exam)}</h3></div>`;
}
function subjectsBox(){
  const by = {};
  P.tasks.forEach(t => (by[t.subject] = by[t.subject] || []).push(t));
  const keys = SUBJECTS.map(s => s[0]).filter(k => by[k]);
  if(!keys.length) return `<div class="empty">還沒有範圍。用下面的表單加入第一科吧！</div>`;
  return keys.map(k => {
    const ts = by[k], dn = ts.filter(t => t.done).length;
    return `<div class="subj"><div class="top"><span class="tag" style="background:${COLOR[k]};color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:900">${k}</span><b>${dn} / ${ts.length} 項</b><button class="btn sm ghost" data-del="${k}">刪除這科</button></div>
      <div class="bar"><i style="width:${dn / ts.length * 100}%;background:${COLOR[k]}"></i></div>
      <details><summary class="small muted" style="cursor:pointer;margin-top:6px">看項目</summary><ul>${ts.map(t => `<li>${esc(t.name)}（${t.min} 分）${t.done ? " ✓" : ""}</li>`).join("")}</ul></details></div>`;
  }).join("");
}
function addForm(){
  return `<div class="row">
      <label>科目<select id="aSubj">${SUBJECTS.map(([n]) => `<option>${n}</option>`).join("")}</select></label>
      <label>每一項大概要<select id="aLv"><option value="easy">20 分鐘（簡單）</option><option value="normal" selected>30 分鐘（普通）</option><option value="hard">45 分鐘（比較難）</option></select></label>
    </div>
    <label style="margin-top:8px">範圍（一行一項，例如：第 1 課課文、第 1 課習作、1-3 單字）<textarea id="aItems" rows="5" placeholder="第 1 課 課文和單字&#10;第 1 課 習作&#10;第 2 課 課文和單字&#10;第 2 課 習作&#10;複習考卷錯題"></textarea></label>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="add">加入並排計畫</button>
      <span id="enBox" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><select id="enUnit"><option value="">從安安英文教室帶入⋯⋯</option>${EN_UNITS.map(([id, n]) => `<option value="${id}">${n}</option>`).join("")}</select><button class="btn sm ghost" data-act="enImport">帶入</button></span></div>
    <p class="small muted" style="margin:8px 0 0">項目切小一點比較好安排，例如「第 1 課課文」和「第 1 課習作」分開。</p>`;
}
function renderSetup(){
  const d = addDays(today(), 14);
  $("#app").innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">
    <h2>先告訴我考試的資訊</h2>
    <div class="row"><label>考試名稱<input id="nExam" maxlength="20" value="第一次段考"></label><label>考試日期<input id="nDate" type="date" value="${d}" min="${addDays(today(), 1)}"></label></div>
    <div class="row" style="margin-top:8px"><label>平日每天可以讀（分鐘）<input id="nWd" type="number" min="10" max="600" step="10" value="60"></label><label>週末每天可以讀（分鐘）<input id="nWe" type="number" min="0" max="720" step="10" value="120"></label></div>
    <label style="flex-direction:row;display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink)"><input id="nRv" type="checkbox" checked style="width:20px;height:20px"> 考前一天留給總複習</label>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="create">開始規劃</button></div>
    <p class="small muted" style="margin:10px 0 0">下一步會請你輸入每一科的範圍，就會自動排出每天要讀什麼。資料只存在這個瀏覽器裡。</p>
  </div>`;
}

// ---------- 從安安英文教室帶入：載入單元檔，取出單字和文法標題 ----------
function loadEnglishUnit(id){
  return new Promise((ok, fail) => {
    // 單元檔會呼叫 registerUnit，也會寫入這些共用表（這裡用不到，只是讓它跑得起來）
    ["PH", "EXC_NOTE", "VOWEL_AUDIO", "ILLUS", "ILLUS2", "MEMO", "PHRASES"].forEach(k => { window[k] = window[k] || {}; });
    window.registerUnit = (rid, def) => { if(rid === id) ok(def); };
    const sc = document.createElement("script");
    sc.src = `../english/units/${id}.js`; sc.onerror = () => fail(new Error("load"));
    document.head.appendChild(sc);
  });
}
async function importEnglish(id){
  const name = EN_UNITS.find(u => u[0] === id)[1];
  let def;
  try{ def = await loadEnglishUnit(id); }catch(e){ toast("英文單元載入不了", "請檢查網路後再試一次。"); return; }
  const n = def.words.length, chunk = Math.ceil(n / 3);
  const items = [];
  for(let i = 0; i < n; i += chunk) items.push([`${name}：單字 ${i + 1}–${Math.min(n, i + chunk)}`, 30]);
  def.grammar.forEach(g => items.push([`${name}：文法「${g.title}」`, 30]));
  items.push([`${name}：文法測驗＋訂正錯題`, 30]);
  items.forEach(([nm, min]) => P.tasks.push({id:newId(), subject:"英文", name:nm, min, done:false}));
  plan(); render();
  toast(`已帶入${name}（${items.length} 項）`, "可以到安安英文教室上課、背單字、做測驗。");
}

// ---------- 操作 ----------
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  const del = e.target.closest("[data-del]");
  if(del){ if(confirm(`確定要刪除「${del.dataset.del}」的所有項目嗎？`)){ P.tasks = P.tasks.filter(t => t.subject !== del.dataset.del); plan(); render(); } return; }
  if(!a) return;
  const act = a.dataset.act;
  if(act === "create"){
    const date = $("#nDate").value;
    if(!date || date <= today()){ toast("考試日期要在今天之後", ""); return; }
    P = {exam:$("#nExam").value.trim() || "段考", date, weekday:+$("#nWd").value || 60, weekend:+$("#nWe").value || 0, review:$("#nRv").checked, tasks:[]};
    plan(); render();
  }else if(act === "add"){
    const lines = $("#aItems").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 60);
    if(!lines.length){ toast("先輸入範圍", "一行一項，例如：第 1 課課文"); $("#aItems").focus(); return; }
    const subj = $("#aSubj").value, min = LEVELS_MIN[$("#aLv").value] || 30;
    lines.forEach(nm => P.tasks.push({id:newId(), subject:subj, name:nm.slice(0, 40), min, done:false}));
    plan(); render(); toast(`已加入${subj} ${lines.length} 項`, "已經幫你排進每天的計畫。");
  }else if(act === "enImport"){
    const id = $("#enUnit").value; if(!id){ $("#enUnit").focus(); return; }
    importEnglish(id);
  }else if(act === "replan"){
    plan(); render(); toast("重新排好了", "從今天開始，一步一步來就好。");
  }else if(act === "saveSet"){
    const date = $("#sDate").value;
    if(!date){ toast("請選考試日期", ""); return; }
    Object.assign(P, {exam:$("#sExam").value.trim() || P.exam, date, weekday:Math.max(10, +$("#sWd").value || 60), weekend:Math.max(0, +$("#sWe").value || 0), review:$("#sRv").checked});
    plan(); render(); toast("設定已儲存", "計畫已經依新的設定重新排好。");
  }else if(act === "reset"){
    if(confirm("確定要換一個考試嗎？目前的計畫和打勾紀錄會清掉。")){ P = null; save(); render(); }
  }
});
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.done; if(!id) return;
  const t = P.tasks.find(x => x.id === id); if(!t) return;
  t.done = e.target.checked; t.doneDay = t.done ? today() : null;
  save(); render();
  if(t.done){
    const left = P.tasks.filter(x => x.day === today() && !x.done).length;
    toast(left ? `完成！今天還有 ${left} 項` : "今天的都完成了，太棒了！", left ? "" : "可以休息，或先做明天的項目。");
  }
});
let toastTimer = null;
function toast(msg, sub){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.innerHTML = esc(msg) + (sub ? `<small>${esc(sub)}</small>` : "");
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}
// 每天第一次打開：如果計畫是之前排的，空出來的天數不會自動補上，所以只在有落後時提醒；隔天自動更新「今天」
render();
</script>
